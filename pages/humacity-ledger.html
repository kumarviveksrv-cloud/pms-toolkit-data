<div id="hvl-root"></div>

<script>
(function(){
'use strict';

var STORAGE_KEY = "pms_custom_org_v1";
var CAT_COLOR = {
  "Cost-Saving": "#667eea",
  "Development": "#a78bfa",
  "Culture & Engagement": "#c4b5fd",
  "Risk & Compliance": "#f87171"
};

function getOrgData(){
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}

function fmt(sym, n){
  var abs = Math.abs(n);
  var sign = n < 0 ? "-" : "";
  if(sym === String.fromCodePoint(8377)){
    if(abs >= 10000000) return sign + sym + (abs/10000000).toFixed(2) + "Cr";
    if(abs >= 100000) return sign + sym + (abs/100000).toFixed(1) + "L";
    if(abs >= 1000) return sign + sym + Math.round(abs/1000) + "K";
    return sign + sym + Math.round(abs);
  }
  if(abs >= 1000000) return sign + sym + (abs/1000000).toFixed(2) + "M";
  if(abs >= 1000) return sign + sym + Math.round(abs/1000) + "K";
  return sign + sym + Math.round(abs);
}
function fmtSigned(sym, n){
  return (n >= 0 ? "+" : "-") + fmt(sym, Math.abs(n));
}

function buildLedgerEntries(employees, sym){
  var entries = [];
  var stars = employees.filter(function(e){ return e.placement === "Star"; });
  var emerging = employees.filter(function(e){ return e.placement === "Emerging Talent"; });
  var tenured = employees.filter(function(e){ return (e.tenure||0) >= 5; });
  var atRisk = employees.filter(function(e){ return e.flightRisk === "High"; });

  if(stars.length > 0){
    var starSalary = stars.reduce(function(a,e){ return a + e.salary; }, 0);
    entries.push({
      id: "star-retention",
      category: "Cost-Saving",
      action: stars.length + " Star performer" + (stars.length===1?"":"s") + " retained",
      note: "Replacement cost avoided at 1.8x annual salary per Star lost.",
      cost: Math.round(starSalary * 0.05),
      ret: Math.round(starSalary * 1.8),
      formula: "Star headcount salary x 1.8x = replacement cost avoided",
      inputs: stars.length + " Star-placed employees, combined salary base",
      assumption: "1.8x multiplier reflects recruitment, onboarding and productivity ramp cost of replacing a top performer. Source: SHRM replacement cost research."
    });
  }

  if(emerging.length > 0){
    var devCost = Math.round(emerging.reduce(function(a,e){ return a + e.salary; },0) * 0.04);
    entries.push({
      id: "development-investment",
      category: "Development",
      action: "Development investment in " + emerging.length + " Emerging Talent",
      note: "DRI: development cost recovered at 2.8x through performance uplift.",
      cost: devCost,
      ret: Math.round(devCost * 2.8),
      formula: "Development spend x 2.8x DRI = performance uplift return",
      inputs: fmt(sym, devCost) + " estimated development spend across " + emerging.length + " Emerging Talent employees",
      assumption: "2.8x Development Return Index based on McKinsey L&D research comparing structured versus informal development programmes."
    });
  }

  if(tenured.length > 0){
    var tenuredSalary = tenured.reduce(function(a,e){ return a + e.salary; }, 0);
    var avgSalary = employees.reduce(function(a,e){ return a+e.salary; },0) / employees.length;
    entries.push({
      id: "engagement-value",
      category: "Culture & Engagement",
      action: "Engagement value, " + tenured.length + " employees with 5+ years tenure",
      note: "EEI: 8% productivity premium from sustained engagement in long-tenure staff.",
      cost: Math.round(tenured.length * avgSalary * 0.01),
      ret: Math.round(tenuredSalary * 0.08),
      formula: "Tenured employee salaries x 8% EEI productivity premium",
      inputs: tenured.length + " employees at 5+ years tenure, combined salary base",
      assumption: "8% Engagement productivity premium sourced from Gallup State of the Global Workplace research."
    });
  }

  if(atRisk.length > 0){
    var riskSalary = atRisk.reduce(function(a,e){ return a + e.salary; }, 0);
    var avgSalary2 = employees.reduce(function(a,e){ return a+e.salary; },0) / employees.length;
    entries.push({
      id: "risk-mitigation",
      category: "Risk & Compliance",
      action: "Risk mitigation, " + atRisk.length + " employees flagged High flight risk",
      note: "Exposure contained versus unmanaged exit cost at 2x salary each.",
      cost: Math.round(atRisk.length * avgSalary2 * 0.02),
      ret: Math.round(riskSalary * 0.6),
      formula: "At-risk salaries x 60% exposure contained (unmanaged exit modelled at 2x salary)",
      inputs: atRisk.length + " employees marked High flight risk by Analyse Your Org, combined salary base",
      assumption: "60% exposure-contained figure applies a conservative exit probability against a 2x-salary unmanaged replacement cost."
    });
  }

  return entries;
}

function esc(s){ return String(s).replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function swPanel(entry, sym){
  return '<button class="hvl-sw-trigger" data-sw="' + entry.id + '">' +
    '<span>Show workings</span>' +
    '</button>' +
    '<div class="hvl-sw-panel" id="sw-' + entry.id + '">' +
      '<div class="hvl-sw-row"><div class="hvl-sw-key">Formula</div><div class="hvl-sw-val"><span class="hvl-sw-formula">' + esc(entry.formula) + '</span></div></div>' +
      '<div class="hvl-sw-row"><div class="hvl-sw-key">Inputs</div><div class="hvl-sw-val">' + esc(entry.inputs) + '</div></div>' +
      '<div class="hvl-sw-row"><div class="hvl-sw-key">Result</div><div class="hvl-sw-val">' + fmt(sym, entry.ret) + ' return ' + String.fromCodePoint(183) + ' ' + fmtSigned(sym, entry.ret-entry.cost) + ' net</div></div>' +
      '<div class="hvl-sw-note">' + esc(entry.assumption) + '</div>' +
    '</div>';
}

var hciFactors = [false,false,false,false];
var hciBase = { totalRet:0 };

function hciCoeff(){
  return Math.round((0.70 + hciFactors.filter(Boolean).length * 0.15) * 100) / 100;
}

function renderHCI(sym){
  var coeff = hciCoeff();
  var base = hciBase.totalRet;
  var factorDefs = [
    { name:"Leadership Stability", desc:"Is leadership stable, present, and actively engaged right now?" },
    { name:"Org Disruption Free", desc:"Is the org free from major disruption, restructure, or layoffs?" },
    { name:"Culture Health", desc:"Is the culture broadly functional and not in crisis?" },
    { name:"Execution Momentum", desc:"Is the org executing well against its current priorities?" }
  ];
  var factorsHtml = factorDefs.map(function(f,i){
    var yesCls = hciFactors[i] ? " yes" : "";
    return '<div class="hvl-hci-factor' + yesCls + '" data-hci-factor="' + i + '">' +
      '<div class="hvl-hci-factor-top"><div class="hvl-hci-factor-name">' + esc(f.name) + '</div><div class="hvl-hci-toggle"></div></div>' +
      '<div class="hvl-hci-factor-desc">' + esc(f.desc) + '</div>' +
    '</div>';
  }).join("");

  var cons = base * (coeff - 0.15);
  var your = base * coeff;
  var opt = base * (coeff + 0.15);

  return '<div class="hvl-hci">' +
    '<div class="hvl-hci-head" id="hvl-hci-head">' +
      '<div><div class="hvl-hci-title">Human Confidence Index</div><div class="hvl-hci-sub">How confident are you current conditions support these returns?</div></div>' +
      '<div><div class="hvl-hci-coeff" id="hvl-hci-coeff-display">' + coeff.toFixed(2) + 'x</div><div class="hvl-hci-coeff-lbl">HCI Coefficient</div></div>' +
    '</div>' +
    '<div class="hvl-hci-body" id="hvl-hci-body">' +
      '<div class="hvl-hci-explain"><b>What is the Human Confidence Index?</b>Every figure above is computed from your uploaded data. But data reflects the past, your judgement reflects what is happening right now. Answer four observable questions and the coefficient adjusts the total return shown below.</div>' +
      '<div class="hvl-hci-factors">' + factorsHtml + '</div>' +
      '<table class="hvl-hci-table" id="hvl-hci-table">' +
        '<tr><th>Scenario</th><th>HCI</th><th>Adjusted Return</th></tr>' +
        '<tr><td>Conservative</td><td>' + (coeff-0.15).toFixed(2) + 'x</td><td>' + fmt(sym,cons) + '</td></tr>' +
        '<tr class="yours"><td>Your Assessment</td><td>' + coeff.toFixed(2) + 'x</td><td>' + fmt(sym,your) + '</td></tr>' +
        '<tr><td>Optimistic</td><td>' + (coeff+0.15).toFixed(2) + 'x</td><td>' + fmt(sym,opt) + '</td></tr>' +
      '</table>' +
    '</div>' +
  '</div>';
}

function render(){
  var root = document.getElementById("hvl-root");
  var data = getOrgData();

  var header = '<a href="/pages/analyse-your-org.html" class="hvl-back-link">' + String.fromCodePoint(8592) + ' Back to Analyse Your Org</a>' +
    '<div class="hvl-eyebrow"><div class="hvl-dot"></div>The Value Ledger</div>' +
    '<div class="hvl-sub">A financial record of what HR does, written in the language your CEO and CFO already speak. Computed from your uploaded org data, not narrative.</div>';

  if(!data || !data.employees || data.employees.length === 0){
    root.innerHTML = header +
      '<div class="hvl-empty">' +
        '<div class="hvl-empty-title">No org data loaded yet</div>' +
        '<div class="hvl-empty-sub">The Value Ledger runs on your uploaded employee data. Upload your CSV on Analyse Your Org first, then come back here.</div>' +
        '<a class="hvl-empty-btn" href="/pages/analyse-your-org.html">Go to Analyse Your Org</a>' +
      '</div>';
    return;
  }

  var employees = data.employees;
  var sym = data.currencySymbol || String.fromCodePoint(8377);
  var totalComp = employees.reduce(function(a,e){ return a+e.salary; }, 0);
  var entries = buildLedgerEntries(employees, sym);
  var totCost = entries.reduce(function(a,e){ return a+e.cost; }, 0);
  var totRet = entries.reduce(function(a,e){ return a+e.ret; }, 0);
  var totNet = totRet - totCost;
  var ratio = totalComp > 0 ? totRet/totalComp : 0;
  hciBase.totalRet = totRet;

  var html = header;

  html += '<div class="hvl-hero">' +
    '<div>' +
      '<div class="hvl-ratio-lbl">Return on HR Investment</div>' +
      '<div class="hvl-ratio-num">' + sym + ratio.toFixed(1) + '</div>' +
      '<div class="hvl-ratio-desc">returned for every <b>' + sym + '1</b> invested in HR</div>' +
    '</div>' +
    '<div class="hvl-hero-divider"></div>' +
    '<div>' +
      '<div class="hvl-hook">' + entries.length + ' documented entries this cycle, computed from ' + employees.length + ' employee records.</div>' +
      '<div class="hvl-context">This ledger records HR contributions in financial language. <b>' + fmt(sym,totRet) + '</b> in documented value against a <b>' + fmt(sym,totalComp) + '</b> comp base.</div>' +
    '</div>' +
  '</div>';

  html += '<div class="hvl-stats">' +
    '<div class="hvl-stat"><div class="hvl-stat-val" style="color:#4ade80">' + fmt(sym,totRet) + '</div><div class="hvl-stat-lbl">Total Return</div></div>' +
    '<div class="hvl-stat"><div class="hvl-stat-val" style="color:rgba(196,181,253,.6)">' + fmt(sym,totCost) + '</div><div class="hvl-stat-lbl">HR Investment</div></div>' +
    '<div class="hvl-stat"><div class="hvl-stat-val" style="color:' + (totNet>=0?'#4ade80':'#f87171') + '">' + fmtSigned(sym,totNet) + '</div><div class="hvl-stat-lbl">Net Ledger Value</div></div>' +
    '<div class="hvl-stat"><div class="hvl-stat-val" style="color:#a78bfa">' + entries.length + '</div><div class="hvl-stat-lbl">Entries</div></div>' +
    '<div class="hvl-stat"><div class="hvl-stat-val" style="color:#c4b5fd">' + employees.length + '</div><div class="hvl-stat-lbl">Employees</div></div>' +
  '</div>';

  html += renderHCI(sym);

  html += '<div class="hvl-legend">' +
    Object.keys(CAT_COLOR).map(function(cat){
      return '<div class="hvl-leg-item"><div class="hvl-leg-dot" style="background:' + CAT_COLOR[cat] + '"></div>' + esc(cat) + '</div>';
    }).join("") +
  '</div>';

  if(entries.length === 0){
    html += '<div class="hvl-empty"><div class="hvl-empty-title">No ledger entries yet</div><div class="hvl-empty-sub">Your uploaded data does not currently include any employees matching a Star placement, Emerging Talent placement, 5+ year tenure, or High flight risk flag. Entries appear automatically as those conditions are met.</div></div>';
  } else {
    html += '<div class="hvl-ledger">';
    entries.forEach(function(e){
      var net = e.ret - e.cost;
      var catColor = CAT_COLOR[e.category];
      html += '<div class="hvl-lrow">' +
        '<div class="hvl-lrow-top">' +
          '<div style="flex:1;min-width:220px">' +
            '<div class="hvl-lrow-action">' + esc(e.action) + '</div>' +
            '<div class="hvl-lrow-note">' + esc(e.note) + '</div>' +
            '<span class="hvl-pill" style="background:' + catColor + '22;color:' + catColor + ';border:1px solid ' + catColor + '44">' + esc(e.category) + '</span>' +
            swPanel(e, sym) +
          '</div>' +
          '<div class="hvl-lrow-nums">' +
            '<div class="hvl-lrow-cost">' + fmt(sym,e.cost) + ' cost</div>' +
            '<div class="hvl-lrow-ret">' + fmt(sym,e.ret) + ' return</div>' +
            '<div class="hvl-lrow-net">' + fmtSigned(sym,net) + '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    });
    html += '<div class="hvl-total"><div class="hvl-total-lbl">TOTAL ' + String.fromCodePoint(183) + ' ' + entries.length + ' entries</div><div class="hvl-total-net">' + fmtSigned(sym,totNet) + '</div></div>';
    html += '</div>';
  }

  html += '<div class="hvl-statement">' +
    '<div class="hvl-statement-lbl">Intelligence Statement</div>' +
    '<div class="hvl-statement-txt">' + statementText(sym, ratio, totRet, totalComp) + '</div>' +
  '</div>';

  html += '<div class="hvl-note-block">This first version of the Value Ledger covers four categories: Star retention, development investment, tenured engagement value, and flight-risk mitigation. A fifth category, revenue-generating new hires, exists in the source model but is not included here because it depends on hire-date and role-type data your CSV template does not currently collect reliably. It will be added once that data exists rather than estimated with a weak proxy.</div>';

  root.innerHTML = html;

  root.querySelectorAll("[data-sw]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var id = btn.getAttribute("data-sw");
      var panel = document.getElementById("sw-" + id);
      if(panel) panel.classList.toggle("open");
    });
  });

  var hciHead = document.getElementById("hvl-hci-head");
  if(hciHead){
    hciHead.addEventListener("click", function(){
      var body = document.getElementById("hvl-hci-body");
      if(body) body.classList.toggle("open");
    });
  }

  root.querySelectorAll("[data-hci-factor]").forEach(function(el){
    el.addEventListener("click", function(e){
      e.stopPropagation();
      var idx = parseInt(el.getAttribute("data-hci-factor"), 10);
      hciFactors[idx] = !hciFactors[idx];
      var bodyWasOpen = document.getElementById("hvl-hci-body").classList.contains("open");
      render();
      if(bodyWasOpen){
        document.getElementById("hvl-hci-body").classList.add("open");
      }
    });
  });
}

function statementText(sym, ratio, totRet, totalComp){
  if(ratio < 1){
    return "This ledger is still building out. Even so, documented HR activity has returned <b>" + fmt(sym,totRet) + "</b> against a <b>" + fmt(sym,totalComp) + "</b> comp base.";
  }
  if(ratio < 2){
    return "A <b>" + ratio.toFixed(1) + "x return</b> on the comp base. <b>" + fmt(sym,totRet) + "</b> in documented HR value so far.";
  }
  return "For every " + sym + "1 this organisation invests in HR, it receives <b>" + sym + ratio.toFixed(1) + "</b> back. The Value Ledger proves it, with the working shown for every figure.";
}

render();

})();
</script>
