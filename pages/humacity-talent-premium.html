.htp-back-link:hover { color:#a78bfa; }
</style>

<div id="htp-root">
  <div id="htp-hero">
    <a href="/pages/analyse-your-org.html" class="htp-back-link">&#8592; Back to Analyse Your Org</a>
    <div class="htp-title">The <span>Talent Premium</span></div>
    <div class="htp-sub">The financial value of having better-than-average people at the same cost. Five verdict areas: Promotion Accuracy, Manager Quality, Hiring Quality, Selective Retention, and HiPo Identification.</div>
  </div>
  <div id="htp-content"></div>
</div>

<script>
(function(){
"use strict";

var DATA_KEY = "pms_custom_org_v1";
var MARKET_AVG = { promo: 85, mgr: 62, hire: 46, selRet: 59, hipo: 40 };
var SYM = "\u20B9";
var _hciF = [false, false, false, false];
var _hciBase = 0;
var _leverState = {};
var _computed = null;

function fmt(n) {
  var a = Math.abs(n), sg = n < 0 ? "-" : "";
  if (a >= 1e7) return sg + SYM + (a / 1e7).toFixed(2) + "Cr";
  if (a >= 1e5) return sg + SYM + (a / 1e5).toFixed(1) + "L";
  if (a >= 1000) return sg + SYM + Math.round(a / 1000) + "K";
  return sg + SYM + Math.round(a);
}

function hciCoeff() {
  return Math.round((0.70 + _hciF.filter(Boolean).length * 0.15) * 100) / 100;
}

function loadData() {
  try {
    var raw = localStorage.getItem(DATA_KEY);
    if (!raw) return null;
    var parsed = JSON.parse(raw);
    var rows = Array.isArray(parsed) ? parsed : (parsed.employees || parsed.rows || parsed.data || null);
    if (!rows || !rows.length) return null;
    return rows;
  } catch (e) { return null; }
}

function gField(row) {
  var keys = Object.keys(row);
  function find() {
    for (var i = 0; i < arguments.length; i++) {
      var arg = arguments[i];
      for (var j = 0; j < keys.length; j++) {
        if (keys[j].toLowerCase().replace(/[\s_-]/g, "") === arg.toLowerCase().replace(/[\s_-]/g, "")) {
          return row[keys[j]];
        }
      }
    }
    return null;
  }
  var salary = parseFloat(find("salary", "annualsalary", "ctc", "annualctc", "totalctc", "grosssalary")) || 0;
  var grade = (find("grade", "band", "gradeband", "level", "joblevel") || "").toString().trim();
  var perf = parseFloat(find("performancescore", "perfscore", "performancerating", "ratingnumeric", "score")) || 0;
  var placement = (find("placement", "talentsegment", "category", "classification", "segment") || "").toString().trim();
  var tenure = parseFloat(find("tenureyears", "tenure", "yearsofservice", "serviceyears", "tenurey")) || 0;
  var manager = (find("managername", "manager", "reportsto", "managernames") || "").toString().trim();
  var name = (find("name", "employeename", "fullname", "empname") || "").toString().trim();
  var dept = (find("department", "dept", "function", "division", "businessunit") || "").toString().trim();
  return { salary: salary, grade: grade, perf: perf, placement: placement, tenure: tenure, manager: manager, name: name, dept: dept };
}

var STAR_KEYS = ["star", "high performer", "star performer", "outstanding", "exceptional", "exceeds", "hipo - high perf", "top performer"];
var HIPO_KEYS = ["high potential", "hipo", "rising star", "emerging star"];
var INCON_KEYS = ["inconsistent", "underperform", "below expectations", "needs improvement", "low performer", "pip"];
var EMERGING_KEYS = ["emerging talent", "emerging", "developing", "trainee", "new hire"];

function classifyPlacement(p) {
  if (!p) return "core";
  var lp = p.toLowerCase();
  if (STAR_KEYS.some(function(k) { return lp.indexOf(k) !== -1; })) return "star";
  if (HIPO_KEYS.some(function(k) { return lp.indexOf(k) !== -1; })) return "hipo";
  if (INCON_KEYS.some(function(k) { return lp.indexOf(k) !== -1; })) return "inconsistent";
  if (EMERGING_KEYS.some(function(k) { return lp.indexOf(k) !== -1; })) return "emerging";
  return "core";
}

function compute(rawRows) {
  var emps = rawRows.map(function(r) {
    var f = gField(r);
    f.cls = classifyPlacement(f.placement);
    return f;
  }).filter(function(e) { return e.salary > 0; });

  if (!emps.length) return null;

  var gradePerfMap = {};
  emps.forEach(function(e) {
    var g = e.grade || "default";
    if (!gradePerfMap[g]) gradePerfMap[g] = [];
    gradePerfMap[g].push(e.perf);
  });
  var gradeBench = {};
  Object.keys(gradePerfMap).forEach(function(g) {
    var arr = gradePerfMap[g];
    gradeBench[g] = arr.reduce(function(a, b) { return a + b; }, 0) / arr.length;
  });

  var stars = emps.filter(function(e) { return e.cls === "star"; });
  var hipos = emps.filter(function(e) { return e.cls === "hipo"; });
  var inconsistent = emps.filter(function(e) { return e.cls === "inconsistent"; });
  var recentHires = emps.filter(function(e) { return e.tenure <= 1; });
  var keepers = emps.filter(function(e) { return e.cls === "star" || e.cls === "hipo"; });
  var totalComp = emps.reduce(function(a, e) { return a + e.salary; }, 0);

  var starsAboveMid = stars.filter(function(e) { return e.perf >= (gradeBench[e.grade || "default"] || 0); }).length;
  var promoScore = stars.length > 0 ? Math.round((starsAboveMid / stars.length) * 100) : 50;
  var gradeMismatches = stars.length - starsAboveMid;

  var managerSet = {};
  emps.forEach(function(e) { if (e.manager) managerSet[e.manager] = true; });
  var managers = emps.filter(function(e) { return managerSet[e.name]; });
  var mgrBelowTeam = 0;
  managers.forEach(function(mgr) {
    var reports = emps.filter(function(e) { return e.manager === mgr.name; });
    if (!reports.length) return;
    var teamAvg = reports.reduce(function(a, e) { return a + e.perf; }, 0) / reports.length;
    if (mgr.perf < teamAvg) mgrBelowTeam++;
  });
  var mgrScore = managers.length > 0 ? Math.round(((managers.length - mgrBelowTeam) / managers.length) * 100) : 70;
  var starMgrRatio = managers.length > 0 ? (stars.length / managers.length).toFixed(1) : "N/A";

  var aboveBench = recentHires.filter(function(e) { return e.perf > (gradeBench[e.grade || "default"] || 0); }).length;
  var hireScore = recentHires.length > 0 ? Math.round((aboveBench / recentHires.length) * 100) : 60;

  var starTenure = stars.length > 0 ? stars.reduce(function(a, e) { return a + e.tenure; }, 0) / stars.length : 0;
  var inconTenure = inconsistent.length > 0 ? inconsistent.reduce(function(a, e) { return a + e.tenure; }, 0) / inconsistent.length : 0;
  var selRetScore;
  if (inconsistent.length === 0) selRetScore = 85;
  else if (starTenure >= inconTenure) selRetScore = Math.min(95, Math.round(60 + (starTenure - inconTenure) * 5));
  else selRetScore = Math.max(20, Math.round(60 - (inconTenure - starTenure) * 5));

  var starRatio = stars.length / emps.length;
  var hipoRatio = hipos.length / emps.length;
  var hipoScore = starRatio > 0 ? Math.min(95, Math.round((hipoRatio / Math.max(starRatio, 0.1)) * 70)) : Math.round(hipoRatio * 200);

  var perfPremium = Math.round(emps.reduce(function(a, e) {
    return a + (e.perf - (gradeBench[e.grade || "default"] || 0)) * e.salary;
  }, 0));

  var retPremium = Math.round(keepers.reduce(function(a, e) {
    var surplus = e.perf - (gradeBench[e.grade || "default"] || 0);
    var rc = e.salary * 1.5;
    return a + (surplus > 0 ? surplus * e.salary * 0.5 + rc * 0.1 : 0);
  }, 0));

  var hireP = Math.round(recentHires.reduce(function(a, e) {
    var surplus = e.perf - (gradeBench[e.grade || "default"] || 0);
    return a + (surplus > 0 ? surplus * e.salary : 0);
  }, 0));

  var tqp = perfPremium + retPremium + hireP;
  var overallScore = Math.round((promoScore + mgrScore + hireScore + selRetScore + hipoScore) / 5);

  return {
    emps: emps, totalComp: totalComp,
    stars: stars.length, hipos: hipos.length, inconsistent: inconsistent.length,
    managers: managers.length, mgrBelowTeam: mgrBelowTeam, starMgrRatio: starMgrRatio,
    recentHires: recentHires.length, aboveBench: aboveBench,
    starTenure: parseFloat(starTenure.toFixed(1)), inconTenure: parseFloat(inconTenure.toFixed(1)),
    gradeMismatches: gradeMismatches, starsAboveMid: starsAboveMid,
    promoScore: promoScore, mgrScore: mgrScore, hireScore: hireScore,
    selRetScore: selRetScore, hipoScore: hipoScore, overallScore: overallScore,
    tqp: tqp, perfPremium: perfPremium, retPremium: retPremium, hireP: hireP
  };
}

function verdictCls(score) { return score >= 70 ? "strong" : score >= 50 ? "watch" : "weak"; }
function verdictLabel(score) { return score >= 70 ? "Strong" : score >= 50 ? "Watch" : "Weak"; }
function vsMarket(score, avg) {
  var diff = score - avg;
  if (Math.abs(diff) < 5) return "<span style=\"color:rgba(196,181,253,.4)\">At market avg (" + avg + ")</span>";
  if (diff > 0) return "<span style=\"color:#34d399\">+" + diff + " vs market avg (" + avg + ")</span>";
  return "<span style=\"color:#f87171\">" + diff + " vs market avg (" + avg + ")</span>";
}

function renderHCI() {
  var h = hciCoeff();
  var el = document.getElementById("htp-hci-coeff");
  if (el) el.textContent = h.toFixed(2) + "x";
  _hciF.forEach(function(v, i) {
    var f = document.getElementById("htp-hci-f" + i);
    if (f) f.classList.toggle("yes", v);
  });
  var cl = document.getElementById("htp-hci-calc");
  if (cl) {
    var yc = _hciF.filter(Boolean).length;
    cl.innerHTML = "<span class=\"htp-hci-calc-formula\">0.70 + (" + yc + " \u00D7 0.15) = " + h.toFixed(2) + "</span><div class=\"htp-hci-calc-result\">" + h.toFixed(2) + "x</div>";
  }
  var sc = document.getElementById("htp-hci-scen");
  if (sc && _hciBase > 0) {
    var c = Math.round(_hciBase * (h - 0.15));
    var y = Math.round(_hciBase * h);
    var o = Math.round(_hciBase * (h + 0.15));
    sc.innerHTML =
      "<tr><th>Scenario</th><th>HCI</th><th class=\"yours\">Adjusted TQP</th></tr>" +
      "<tr><td class=\"label\">Conservative</td><td class=\"conservative\">" + (h - 0.15).toFixed(2) + "x</td><td class=\"conservative\">" + fmt(c) + "</td></tr>" +
      "<tr><td class=\"label\" style=\"color:#a78bfa\">Your Assessment</td><td class=\"yours\">" + h.toFixed(2) + "x</td><td class=\"yours\">" + fmt(y) + "</td></tr>" +
      "<tr><td class=\"label\">Optimistic</td><td class=\"optimistic\">" + (h + 0.15).toFixed(2) + "x</td><td class=\"optimistic\">" + fmt(o) + "</td></tr>";
  }
  var tqpHero = document.getElementById("htp-tqp-num");
  if (tqpHero && _hciBase > 0) {
    tqpHero.textContent = fmt(Math.round(_hciBase * h));
  }
}

function renderProj() {
  var d = _computed;
  if (!d) return;
  var h = hciCoeff();
  var base = Math.round(d.tqp * h);
  var levers = document.querySelectorAll(".htp-proj-check");
  var uplift = 0;
  levers.forEach(function(el) {
    if (el.classList.contains("on")) uplift += parseInt(el.getAttribute("data-uplift") || "0");
  });
  var tb = document.getElementById("htp-proj-body");
  if (!tb) return;
  var cons = Math.round(base * 0.85);
  var opt = Math.round(base * 1.15 + uplift);
  var proj = base + uplift;
  tb.innerHTML =
    "<tr><td>Current TQP (base)</td><td>" + fmt(cons) + "</td><td class=\"yours\">" + fmt(base) + "</td><td>" + fmt(Math.round(base * 1.15)) + "</td></tr>" +
    (uplift > 0 ? "<tr><td>Lever uplift</td><td>" + fmt(Math.round(uplift * 0.85)) + "</td><td class=\"yours\" style=\"color:#34d399\">+" + fmt(uplift) + "</td><td style=\"color:#34d399\">+" + fmt(Math.round(uplift * 1.15)) + "</td></tr>" : "") +
    "<tr style=\"border-top:1px solid rgba(102,126,234,.15)\"><td><b>Projected TQP</b></td><td>" + fmt(cons + Math.round(uplift * 0.85)) + "</td><td class=\"yours\">" + fmt(proj) + "</td><td>" + fmt(opt) + "</td></tr>";
}

function renderPage(d) {
  _computed = d;
  _hciBase = d.tqp;
  var h = hciCoeff();
  var tqpAdj = Math.round(d.tqp * h);

  var levers = [];
  if (d.mgrScore < 70) levers.push({ text: "Upgrade manager layer - move <b>" + d.mgrBelowTeam + " below-team manager" + (d.mgrBelowTeam !== 1 ? "s" : "") + "</b> to performance management", uplift: Math.round(d.tqp * 0.12) });
  if (d.hireScore < 70 && d.recentHires > 0) levers.push({ text: "Raise hiring bar - target above-baseline performers in next 2 cohorts", uplift: Math.round(d.tqp * 0.08) });
  if (d.hipoScore < 70) levers.push({ text: "Activate HiPo pipeline - move identified potentials into stretch roles", uplift: Math.round(d.tqp * 0.06) });
  if (d.promoScore < 70 && d.stars > 0) levers.push({ text: "Tighten promotion criteria - performance above grade midpoint as prerequisite", uplift: Math.round(d.tqp * 0.05) });
  if (d.selRetScore < 70) levers.push({ text: "Invert retention focus - prioritise Star retention over headcount retention", uplift: Math.round(d.tqp * 0.07) });
  if (!levers.length) levers.push({ text: "All five verdict areas reading Strong. Maintain current talent practices.", uplift: 0 });

  function promoFinding() {
    if (d.stars === 0) return "This org has <b>no Star-rated employees</b>. Promotion Accuracy cannot generate a meaningful signal. The underlying issue is not promotion quality - it is that the talent to promote is not visible in the current dataset.";
    if (d.promoScore >= 70) return "<b>" + d.starsAboveMid + " of " + d.stars + " Stars</b> sit at or above their grade performance midpoint. Promotions are landing on the right people." + (d.gradeMismatches > 0 ? " " + d.gradeMismatches + " grade mismatch" + (d.gradeMismatches > 1 ? "es" : "") + " flagged." : "");
    return "<b>" + d.gradeMismatches + " of " + d.stars + " Stars</b> are performing below their grade midpoint. A wrong promotion puts the wrong person in a more powerful role and makes the vacated role harder to fill.";
  }
  function mgrFinding() {
    if (d.mgrBelowTeam === 0) return "All " + d.managers + " managers are performing at or above their direct report average. The management layer is a driver of performance, not a drag. Star-to-manager ratio: <b>" + d.starMgrRatio + "</b>.";
    return "<b>" + d.mgrBelowTeam + " manager" + (d.mgrBelowTeam > 1 ? "s" : "") + " of " + d.managers + "</b> are performing below their direct report average. The premium generated by these teams exists despite their managers, not because of them.";
  }
  function hireFinding() {
    if (d.recentHires === 0) return "No employees with tenure \u2264 1 year appear in this dataset. Hiring quality cannot be assessed from recent data.";
    if (d.hireScore >= 70) return "<b>" + d.aboveBench + " of " + d.recentHires + " recent hires</b> are outperforming their grade baseline. New hires are contributing to the premium, not diluting it.";
    return "<b>" + (d.recentHires - d.aboveBench) + " of " + d.recentHires + " recent hires</b> are performing at or below their grade baseline. The org is paying market salaries for below-market output in the talent it most recently chose.";
  }
  function selRetFinding() {
    if (d.inconsistent === 0) return "This org has <b>zero Inconsistent Performers</b>. The selective retention signal is clean - the people who remain are performing.";
    if (d.selRetScore >= 70) return "High performers carry an average tenure of <b>" + d.starTenure + " years</b> vs <b>" + d.inconTenure + " years</b> for Inconsistent Performers. The org is retaining the right people.";
    return "Inconsistent Performers are staying longer (<b>" + d.inconTenure + "yr avg</b>) than Stars (<b>" + d.starTenure + "yr avg</b>). The org has an inverted retention profile - holding cost and losing value.";
  }
  function hipFinding() {
    if (d.hipos === 0) return "This org has <b>no identified High Potentials</b>. The leadership pipeline is empty. HiPo misidentification is silent - it does not show on a P&L until 5-7 years later.";
    if (d.hipoScore >= 70) return "<b>" + d.hipos + " High Potentials</b> identified - a healthy pipeline relative to current Stars (" + d.stars + "). The org is investing in its next generation of performance.";
    return "<b>" + d.hipos + " High Potentials</b> identified but the pipeline-to-Star ratio signals conversion risk. A HiPo pool not actively developed will self-select out within 18-24 months.";
  }

  function verdictCard(title, score, finding, metricA, metricB, swRows) {
    var cls = verdictCls(score);
    return "<div class=\"htp-vc " + cls + "\">" +
      "<div class=\"htp-vc-top\"><div class=\"htp-vc-name\">" + title + "</div><div class=\"htp-badge " + cls + "\">" + verdictLabel(score) + "</div></div>" +
      "<div class=\"htp-vc-score-row\"><div class=\"htp-vc-score-num " + cls + "\">" + score + "</div><div class=\"htp-vc-score-right\">" +
        "<div class=\"htp-vc-track\"><div class=\"htp-vc-fill " + cls + "\" style=\"width:" + score + "%\"></div></div>" +
        "<div class=\"htp-vc-vs\">" + vsMarket(score, metricB) + "</div>" +
      "</div></div>" +
      "<div class=\"htp-vc-finding\">" + finding + "</div>" +
      "<div class=\"htp-vc-metrics\">" +
        "<div class=\"htp-vc-metric\"><div class=\"htp-vc-metric-val\">" + metricA[0] + "</div><div class=\"htp-vc-metric-lbl\">" + metricA[1] + "</div></div>" +
        "<div class=\"htp-vc-metric\"><div class=\"htp-vc-metric-val\">Score " + score + "</div><div class=\"htp-vc-metric-lbl\">vs market " + metricB + "</div></div>" +
      "</div>" +
      "<button class=\"htp-sw-trigger\" data-panel=\"htp-sw-" + title.replace(/\s/g,"") + "\">" +
        "<svg width=\"10\" height=\"10\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><path d=\"M8 2v8M5 7l3 3 3-3\"/><path d=\"M2 12h12\"/></svg> Show workings" +
      "</button>" +
      "<div class=\"htp-sw-panel\" id=\"htp-sw-" + title.replace(/\s/g,"") + "\">" +
        swRows.map(function(r) { return "<div class=\"htp-sw-row\"><div class=\"htp-sw-key\">" + r[0] + "</div><div class=\"htp-sw-val\">" + r[1] + "</div></div>"; }).join("") +
      "</div>" +
    "</div>";
  }

  var maxComp = Math.max(Math.abs(d.perfPremium), Math.abs(d.retPremium), Math.abs(d.hireP), 1);

  function compCard(label, val) {
    var cls = val > 0 ? "pos" : val < 0 ? "neg" : "flat";
    var w = Math.round(Math.abs(val) / maxComp * 100);
    var desc = label === "Performance Premium" ? "Employees outperforming their grade baseline. Surplus performance score \u00D7 salary." :
               label === "Retention Premium" ? "Stars and HiPos retained. Avoided replacement cost plus output premium." :
               "New hires (tenure \u2264 1yr) performing above their grade baseline.";
    return "<div class=\"htp-comp-card\"><div class=\"htp-comp-lbl\">" + label + "</div><div class=\"htp-comp-val " + cls + "\">" + fmt(val) + "</div><div class=\"htp-comp-bar\"><div class=\"htp-comp-fill " + cls + "\" style=\"width:" + w + "%\"></div></div><div class=\"htp-comp-desc\">" + desc + "</div></div>";
  }

  var watchAreas = [
    d.promoScore < 70 ? "Promotion Accuracy" : null,
    d.mgrScore < 70 ? "Manager Quality" : null,
    d.hireScore < 70 ? "Hiring Quality" : null,
    d.selRetScore < 70 ? "Selective Retention" : null,
    d.hipoScore < 70 ? "HiPo Identification" : null
  ].filter(Boolean);

  var dominant = [["Performance Premium", d.perfPremium], ["Retention Premium", d.retPremium], ["Hiring Premium", d.hireP]].sort(function(a, b) { return b[1] - a[1]; })[0];

  var stmtTxt = "";
  if (d.tqp <= 0) {
    stmtTxt = "This org is generating <b>no Talent Quality Premium</b>. The workforce is performing at or below the grade baseline for its cost. " + (watchAreas.length > 0 ? "Verdict areas needing immediate attention: <b>" + watchAreas.join(", ") + "</b>." : "");
  } else {
    stmtTxt = "This org generates a <b>Talent Quality Premium of " + fmt(tqpAdj) + "</b> (HCI-adjusted). " + (dominant[1] > 0 ? "<b>" + dominant[0] + "</b> is the primary engine. " : "") + (watchAreas.length > 0 ? "Verdict areas flagged: <b>" + watchAreas.join(", ") + "</b>." : "All five verdict areas reading Strong.");
  }

  var leversHtml = levers.map(function(l, i) {
    return "<div class=\"htp-proj-lever\">" +
      "<div class=\"htp-proj-check\" id=\"htp-lev" + i + "\" data-uplift=\"" + l.uplift + "\" onclick=\"htpToggleLever(" + i + ")\"></div>" +
      "<div class=\"htp-proj-text\">" + l.text + "</div>" +
      (l.uplift > 0 ? "<div class=\"htp-proj-val\">+" + fmt(l.uplift) + "</div>" : "") +
    "</div>";
  }).join("");

  var c = document.getElementById("htp-content");
  c.innerHTML =
    "<div class=\"htp-ctx-bar\">" +
      "<div class=\"htp-ctx-item\"><div class=\"htp-ctx-label\">Headcount</div><div class=\"htp-ctx-val\">" + d.emps.length + " employees</div></div>" +
      "<div class=\"htp-ctx-dot\"></div>" +
      "<div class=\"htp-ctx-item\"><div class=\"htp-ctx-label\">Total comp</div><div class=\"htp-ctx-val\">" + fmt(d.totalComp) + "</div></div>" +
      "<div class=\"htp-ctx-dot\"></div>" +
      "<div class=\"htp-ctx-item\"><div class=\"htp-ctx-label\">Stars</div><div class=\"htp-ctx-val\">" + d.stars + "</div></div>" +
      "<div class=\"htp-ctx-dot\"></div>" +
      "<div class=\"htp-ctx-item\"><div class=\"htp-ctx-label\">HiPos</div><div class=\"htp-ctx-val\">" + d.hipos + "</div></div>" +
    "</div>" +
    "<div class=\"htp-hci\" id=\"htp-hci-wrap\">" +
      "<div class=\"htp-hci-header\" id=\"htp-hci-hdr\">" +
        "<div class=\"htp-hci-left\">" +
          "<div class=\"htp-hci-icon\">H</div>" +
          "<div><div class=\"htp-hci-title\">Human Confidence Index</div><div class=\"htp-hci-sub\">Adjust TQP for current org conditions</div></div>" +
        "</div>" +
        "<div style=\"display:flex;align-items:center;gap:14px;\">" +
          "<div><div class=\"htp-hci-coeff\" id=\"htp-hci-coeff\">0.70x</div><div class=\"htp-hci-coeff-lbl\">HCI Coefficient</div></div>" +
          "<div class=\"htp-hci-chev\" id=\"htp-hci-chev\">\u25BE</div>" +
        "</div>" +
      "</div>" +
      "<div class=\"htp-hci-body\" id=\"htp-hci-body\">" +
        "<div class=\"htp-hci-note\"><b style=\"color:#f0eeff;\">What is the Human Confidence Index?</b><br>Your data reflects the past. Your professional judgement reflects right now. The HCI (0.70 to 1.30) lets you apply that judgement to the base TQP. Four Yes/No questions set the coefficient.</div>" +
        "<div class=\"htp-hci-factors\">" +
          ["Leadership Stability", "Org Disruption Free", "Culture Health", "Execution Momentum"].map(function(name, i) {
            var descs = ["Is leadership stable, present, and actively engaged right now?", "Is the org free from major disruption, restructure, or layoffs?", "Is the culture broadly functional and not in crisis?", "Is the org executing well against its current strategic priorities?"];
            return "<div class=\"htp-hci-factor\" id=\"htp-hci-f" + i + "\" onclick=\"htpHciToggle(" + i + ")\">" +
              "<div class=\"htp-hci-factor-top\"><div class=\"htp-hci-factor-name\">" + name + "</div><div class=\"htp-hci-toggle\"></div></div>" +
              "<div class=\"htp-hci-factor-desc\">" + descs[i] + "</div>" +
            "</div>";
          }).join("") +
        "</div>" +
        "<div class=\"htp-hci-calc\" id=\"htp-hci-calc\"></div>" +
        "<table class=\"htp-hci-scen-table\"><tbody id=\"htp-hci-scen\"></tbody></table>" +
        "<div class=\"htp-hci-scen-note\">Conservative = HCI \u22120.15 \u00B7 Your Assessment = your HCI \u00B7 Optimistic = HCI +0.15</div>" +
      "</div>" +
    "</div>" +
    "<div class=\"htp-hero-card\">" +
      "<div class=\"htp-hero-grid\">" +
        "<div>" +
          "<div class=\"htp-tqp-lbl\">Talent Quality Premium (HCI-adjusted)</div>" +
          "<div class=\"htp-tqp-num\" id=\"htp-tqp-num\">" + fmt(tqpAdj) + "</div>" +
          "<div class=\"htp-tqp-meta\">The financial value of having better-than-average people at the same cost.<br>Computed from <b>" + d.emps.length + " employees</b> \u00B7 HCI " + h.toFixed(2) + "x \u00B7 Base " + fmt(d.tqp) + "</div>" +
          "<button class=\"htp-sw-trigger\" data-panel=\"htp-sw-tqp\">" +
            "<svg width=\"10\" height=\"10\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><path d=\"M8 2v8M5 7l3 3 3-3\"/><path d=\"M2 12h12\"/></svg> Show workings" +
          "</button>" +
          "<div class=\"htp-sw-panel\" id=\"htp-sw-tqp\">" +
            "<div class=\"htp-sw-row\"><div class=\"htp-sw-key\">Formula</div><div class=\"htp-sw-val\"><span class=\"htp-sw-formula\">TQP = Performance Premium + Retention Premium + Hiring Premium</span></div></div>" +
            "<div class=\"htp-sw-row\"><div class=\"htp-sw-key\">Performance</div><div class=\"htp-sw-val\">(perf score - grade avg) \u00D7 salary, summed = <b>" + fmt(d.perfPremium) + "</b></div></div>" +
            "<div class=\"htp-sw-row\"><div class=\"htp-sw-key\">Retention</div><div class=\"htp-sw-val\">Stars and HiPos above grade baseline: (surplus \u00D7 salary \u00D7 0.5) + (1.5x salary \u00D7 0.1) = <b>" + fmt(d.retPremium) + "</b></div></div>" +
            "<div class=\"htp-sw-row\"><div class=\"htp-sw-key\">Hiring</div><div class=\"htp-sw-val\">Recent hires (tenure \u22641yr) above grade baseline: surplus \u00D7 salary = <b>" + fmt(d.hireP) + "</b></div></div>" +
            "<div class=\"htp-sw-row\"><div class=\"htp-sw-key\">HCI Adjust</div><div class=\"htp-sw-val\">Base " + fmt(d.tqp) + " \u00D7 " + h.toFixed(2) + " = <b>" + fmt(tqpAdj) + "</b></div></div>" +
            "<div class=\"htp-sw-row\"><div class=\"htp-sw-key\">Data</div><div class=\"htp-sw-val\">" + d.emps.length + " employees from your uploaded CSV. No illustrative figures.</div></div>" +
          "</div>" +
        "</div>" +
        "<div class=\"htp-hero-divider\"></div>" +
        "<div>" +
          "<div class=\"htp-overall-score\">" + d.overallScore + "</div>" +
          "<div class=\"htp-overall-lbl\">Overall Verdict Score / 100</div>" +
          "<div class=\"htp-stats-row\">" +
            "<div class=\"htp-stat\"><div class=\"htp-stat-num\" style=\"color:#fbbf24\">" + d.stars + "</div><div class=\"htp-stat-lbl\">Stars</div></div>" +
            "<div class=\"htp-stat\"><div class=\"htp-stat-num\" style=\"color:#a78bfa\">" + d.hipos + "</div><div class=\"htp-stat-lbl\">HiPos</div></div>" +
            "<div class=\"htp-stat\"><div class=\"htp-stat-num\" style=\"color:#667eea\">" + d.managers + "</div><div class=\"htp-stat-lbl\">Managers</div></div>" +
            "<div class=\"htp-stat\"><div class=\"htp-stat-num\" style=\"color:#f87171\">" + d.inconsistent + "</div><div class=\"htp-stat-lbl\">Inconsistent</div></div>" +
          "</div>" +
        "</div>" +
      "</div>" +
    "</div>" +
    "<div class=\"htp-section-head\"><div class=\"htp-section-title\">Five Verdict Areas</div></div>" +
    "<div class=\"htp-verdict-grid\">" +
      verdictCard("Promotion Accuracy", d.promoScore, promoFinding(), [d.starsAboveMid + " of " + d.stars + " Stars above midpoint", ""], MARKET_AVG.promo,
        [["Method", "Stars at or above grade performance midpoint / total Stars"], ["Stars above midpoint", d.starsAboveMid + " of " + d.stars], ["Grade mismatches", d.gradeMismatches], ["Market avg", MARKET_AVG.promo]]) +
      verdictCard("Manager Quality", d.mgrScore, mgrFinding(), [d.mgrBelowTeam + " below team avg", ""], MARKET_AVG.mgr,
        [["Method", "Managers outperforming their direct report average / total managers"], ["Below team avg", d.mgrBelowTeam + " of " + d.managers + " managers"], ["Star-to-manager ratio", d.starMgrRatio], ["Market avg", MARKET_AVG.mgr]]) +
      verdictCard("Hiring Quality", d.hireScore, hireFinding(), [d.aboveBench + " of " + d.recentHires + " above baseline", ""], MARKET_AVG.hire,
        [["Method", "Recent hires (tenure \u22641yr) above grade performance baseline / total recent hires"], ["Above baseline", d.aboveBench + " of " + d.recentHires], ["Market avg", MARKET_AVG.hire]]) +
      verdictCard("Selective Retention", d.selRetScore, selRetFinding(), ["Star avg " + d.starTenure + "yr, Inconsistent " + d.inconTenure + "yr", ""], MARKET_AVG.selRet,
        [["Method", "Star avg tenure vs Inconsistent Performer avg tenure"], ["Stars", d.stars + " at " + d.starTenure + "yr avg"], ["Inconsistent", d.inconsistent + " at " + d.inconTenure + "yr avg"], ["Market avg", MARKET_AVG.selRet]]) +
      verdictCard("HiPo Identification", d.hipoScore, hipFinding(), [d.hipos + " HiPos identified", ""], MARKET_AVG.hipo,
        [["Method", "HiPo count relative to current Star density"], ["HiPos", d.hipos + " (" + Math.round(d.hipos / d.emps.length * 100) + "% of org)"], ["Stars", d.stars + " (" + Math.round(d.stars / d.emps.length * 100) + "% of org)"], ["Market avg", MARKET_AVG.hipo]]) +
    "</div>" +
    "<div class=\"htp-proj-section\">" +
      "<div class=\"htp-proj-title\">Forward Projection</div>" +
      "<div class=\"htp-proj-sub\">Select the levers you plan to act on. The model shows projected TQP under Conservative, Your Assessment, and Optimistic scenarios.</div>" +
      leversHtml +
      "<table class=\"htp-proj-table\"><thead><tr><th>Line</th><th>Conservative</th><th class=\"yours\">Your Assessment</th><th>Optimistic</th></tr></thead><tbody id=\"htp-proj-body\"></tbody></table>" +
    "</div>" +
    "<div class=\"htp-section-head\"><div class=\"htp-section-title\">Premium Breakdown</div></div>" +
    "<div class=\"htp-breakdown-grid\">" +
      compCard("Performance Premium", d.perfPremium) +
      compCard("Retention Premium", d.retPremium) +
      compCard("Hiring Premium", d.hireP) +
    "</div>" +
    "<div class=\"htp-stmt\"><div class=\"htp-stmt-lbl\">Intelligence Statement</div><div class=\"htp-stmt-txt\">" + stmtTxt + "</div></div>";

  document.getElementById("htp-hci-hdr").addEventListener("click", function() {
    var body = document.getElementById("htp-hci-body");
    var chev = document.getElementById("htp-hci-chev");
    var open = body.classList.contains("open");
    body.classList.toggle("open", !open);
    if (chev) chev.textContent = open ? "\u25BE" : "\u25B4";
  });

  renderHCI();
  renderProj();

  document.querySelectorAll(".htp-sw-trigger").forEach(function(btn) {
    btn.addEventListener("click", function() {
      var panelId = btn.getAttribute("data-panel");
      var panel = document.getElementById(panelId);
      if (!panel) return;
      var open = panel.classList.contains("open");
      document.querySelectorAll(".htp-sw-panel.open").forEach(function(p) { p.classList.remove("open"); });
      if (!open) panel.classList.add("open");
    });
  });
}

window.htpHciToggle = function(i) {
  _hciF[i] = !_hciF[i];
  renderHCI();
  renderProj();
};

window.htpToggleLever = function(i) {
  var el = document.getElementById("htp-lev" + i);
  if (!el) return;
  el.classList.toggle("on");
  renderProj();
};

function renderEntryCard() {
  var c = document.getElementById("htp-content");
  c.innerHTML =
    "<div class=\"htp-entry-card\">" +
      "<div class=\"htp-entry-icon\">L2</div>" +
      "<div class=\"htp-entry-title\">Upload your org data to run the Talent Premium</div>" +
      "<div class=\"htp-entry-sub\">The Talent Premium is computed from your actual employee dataset. It needs salary, performance score, grade, placement, and tenure data from your CSV upload.</div>" +
      "<a href=\"/pages/analyse-your-org.html\" class=\"htp-entry-btn\">Go to Analyse Your Org</a>" +
    "</div>";
}

var rawRows = loadData();
if (!rawRows) {
  renderEntryCard();
} else {
  var d = compute(rawRows);
  if (!d) {
    renderEntryCard();
  } else {
    renderPage(d);
  }
}

})();
</script>
