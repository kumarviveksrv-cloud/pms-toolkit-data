  fear_2: { severity: "warning", action: "Implement fortnightly cross-team Knowledge Shares - 30-minute rotating sessions where one team teaches the rest something only they know.", detail: "Structured as: here is something we figured out that no one else knows yet. Rotating host. Recorded. Creates a habit of sharing before hoarding becomes the norm.", timeframe: "60 days", owner: "HR + Team Leads" },
  fear_3: { severity: "warning", action: "CEO publicly reverses one recent decision in response to team input - documented, shared org-wide, with explicit attribution to the person whose input changed the thinking.", detail: "Must be genuine. If no current reversal is possible, CEO identifies a decision under consideration and publicly invites structured input before finalising.", timeframe: "21 days", owner: "CEO" },
  middle_0: { severity: "critical", action: "Mandate structured weekly 1:1s for all managers - 30 minutes, employee-led agenda, no status updates, notes owned by the employee.", detail: "HR provides the framework: what are you working on, what is in your way, what do you need from me. Manager's job is to listen and remove blockers. First round within 14 days.", timeframe: "14 days", owner: "HR + All Managers" },
  middle_1: { severity: "warning", action: "Introduce a quarterly Talent Visibility Review - each manager presents their top performer to skip-level leadership with a specific development or promotion recommendation.", detail: "Format: here is my top person, here is why they are exceptional, here is what I am recommending. Skip-level must respond with a decision within 30 days.", timeframe: "45 days", owner: "HR + Senior Leadership" },
  middle_2: { severity: "critical", action: "Implement a 72-Hour Cascade Protocol - any major leadership decision must reach every frontline employee within 72 hours via their direct manager, with a standard briefing template.", detail: "Template: what was decided, what it means for your team, what questions to expect, what to say if you do not know. HR tracks cascade completion.", timeframe: "30 days", owner: "HR + All Managers" },
  middle_3: { severity: "warning", action: "Mandatory Performance Conversation training for all managers - half-day workshop, role-played scenarios, followed by a 60-day commitment to document one performance conversation per underperformer.", detail: "Covers: how to open a performance conversation, how to give specific feedback without triggering defensiveness, how to document it correctly. HR monitors compliance.", timeframe: "30 days", owner: "HR" },
  execution_0: { severity: "critical", action: "Run a one-day OKR Rewire workshop - rewrite every team's objectives to include a specific revenue or cost number each team directly impacts.", detail: "Each team leaves with one north star metric (a financial number), three key results in financial language, and a weekly check-in habit against that number. HR facilitates.", timeframe: "30 days", owner: "HR + Team Leads + CFO" },

  execution_3: { severity: "critical", action: "Project Accountability Reviews - every project over 2 weeks gets a weekly 15-minute status check with a traffic light (Red/Amber/Green) and a named owner accountable for each commitment.", detail: "Red projects get immediate escalation. No project stays Red for more than 2 weeks without a formal reset. The person who commits to a deadline explains publicly why it was missed.", timeframe: "14 days", owner: "HR + Project Owners" },
  hr_0: { severity: "warning", action: "HR implements a monthly Business Partner Review - one structured proactive meeting per business unit per month, focused on people risks not yet on leadership's radar.", detail: "Agenda: what talent risks are coming in 90 days, what HR is seeing that the business unit should know, what decisions are coming that HR needs to be part of. Not a status report.", timeframe: "30 days", owner: "HR" },
  hr_1: { severity: "warning", action: "Redesign the exit process - structured exit interview in the last week, 30-day post-exit check-in call, and an Exit Intelligence Report published to leadership quarterly.", detail: "Exit interview: what made you stay as long as you did, what was the moment you decided to leave, what would have changed your decision. Report aggregates themes without identifying individuals.", timeframe: "90 days", owner: "HR" },
  hr_2: { severity: "critical", action: "Rebuild the onboarding programme - 90-day structured plan with clear milestones at day 14 (orientation complete), day 30 (first contribution made), day 90 (fully productive).", detail: "Day 14: can describe the company mission, their team's role, and their first project. Day 30: has completed one piece of reviewed work. Day 90: operating independently. Manager and HR both sign off.", timeframe: "30 days to launch", owner: "HR" },
  hr_3: { severity: "warning", action: "Implement a quarterly People Risk Register - a structured document listing the top 5 people risks, their probability, financial impact if they materialise, and mitigation underway.", detail: "Format: risk name, probability, financial impact, mitigation, owner, next review date. Presented to leadership every quarter. Forces HR to think in financial risk language.", timeframe: "30 days", owner: "HR" }
};

function loadCSVHints() {
  try {
    var raw = localStorage.getItem(DATA_KEY);
    if (!raw) return;
    var parsed = JSON.parse(raw);
    var rows = Array.isArray(parsed) ? parsed : (parsed.employees || parsed.rows || parsed.data || []);
    if (!rows.length) return;
    var keys = Object.keys(rows[0]);
    function findVal(row) {
      for (var i = 0; i < arguments.length; i++) {
        var arg = arguments[i];
        for (var j = 0; j < keys.length; j++) {
          if (keys[j].toLowerCase().replace(/[\s_-]/g,"") === arg.toLowerCase().replace(/[\s_-]/g,"")) return row[keys[j]];
        }
      }
      return null;
    }
    var emps = rows.map(function(r) {
      return {
        perf: parseFloat(findVal(r, "performancescore", "perfscore", "score")) || 0,
        placement: (findVal(r, "placement", "talentsegment", "category") || "").toLowerCase(),
        tenure: parseFloat(findVal(r, "tenureyears", "tenure", "yearsofservice")) || 0,
        manager: (findVal(r, "managername", "manager") || "").trim(),
        name: (findVal(r, "name", "employeename") || "").trim(),
        salary: parseFloat(findVal(r, "salary", "annualsalary", "ctc")) || 0
      };
    }).filter(function(e) { return e.salary > 0; });
    if (!emps.length) return;
    var stars = emps.filter(function(e) { return e.placement.indexOf("star") !== -1 || e.placement.indexOf("high performer") !== -1; });
    var inconsistent = emps.filter(function(e) { return e.placement.indexOf("inconsistent") !== -1 || e.placement.indexOf("underperf") !== -1; });
    var starTenure = stars.length > 0 ? stars.reduce(function(a,e){return a+e.tenure;},0)/stars.length : 0;
    var inconTenure = inconsistent.length > 0 ? inconsistent.reduce(function(a,e){return a+e.tenure;},0)/inconsistent.length : 0;
    var managerSet = {};
    emps.forEach(function(e) { if (e.manager) managerSet[e.manager] = true; });
    var managers = emps.filter(function(e) { return managerSet[e.name]; });
    if (stars.length > 0 && inconsistent.length > 0 && inconTenure > starTenure) {
      _csvHints.fear = "Your org data shows Inconsistent Performers staying longer (" + inconTenure.toFixed(1) + "yr avg) than Stars (" + starTenure.toFixed(1) + "yr avg). This inverted retention profile is a fear-based culture signal.";
    }
    if (managers.length > 0) {
      var ratio = (stars.length / managers.length).toFixed(1);
      if (parseFloat(ratio) < 1.0) {
        _csvHints.middle = "Your data shows " + stars.length + " Stars and " + managers.length + " managers (ratio " + ratio + "x). A low Star-to-manager ratio often signals manager advocacy gaps.";
      }
    }
    if (inconsistent.length > 3) {
      _csvHints.hr = "Your data shows " + inconsistent.length + " Inconsistent Performers in the dataset. A structured exit process and regular performance conversations may be overdue.";
    }
  } catch (e) {}
}

function getVitalStatus(vitalId) {
  var v = VITALS.find(function(v) { return v.id === vitalId; });
  var yesCount = 0, answered = 0;
  v.signals.forEach(function(s, i) {
    var key = vitalId + "_" + i;
    if (_answers[key] === true) { yesCount++; answered++; }
    else if (_answers[key] === false) { answered++; }
  });
  if (answered === 0) return { status: "unanswered", score: 0, answered: 0, total: 4 };
  if (answered < 4) return { status: "partial", score: yesCount, answered: answered, total: 4 };
  if (yesCount >= 3) return { status: "healthy", score: yesCount, answered: 4, total: 4 };
  if (yesCount === 2) return { status: "warning", score: yesCount, answered: 4, total: 4 };
  return { status: "critical", score: yesCount, answered: 4, total: 4 };
}

function getDNAType() {
  var allDone = VITALS.every(function(v) { return getVitalStatus(v.id).answered === 4; });
  if (!allDone) return null;
  var L = getVitalStatus("leadership").status;
  var F = getVitalStatus("fear").status;
  var M = getVitalStatus("middle").status;
  var E = getVitalStatus("execution").status;
  var H = getVitalStatus("hr").status;
  if (L==="healthy" && F==="healthy" && M==="healthy" && E==="healthy" && H==="healthy") return "quiet_compounding";
  if (L==="healthy" && F==="healthy" && E==="healthy" && M!=="critical") return "disciplined_challenger";
  if (L==="healthy" && F==="healthy" && (E==="warning"||E==="critical")) return "resilient_community";
  if (F==="critical") return "fear_factory";
  if (M==="critical" && F!=="critical") return "frozen_middle";
  if (L==="critical") return "founders_shadow";
  if (E==="critical" && L!=="critical" && F!=="critical") return "busy_illusion";
  return "legacy_trap";
}

function statusLabel(s) {
  if (s === "healthy") return "Healthy";
  if (s === "warning") return "Watch";
  if (s === "critical") return "Critical";
  if (s === "partial") return "In progress";
  return "Unanswered";
}

function render() {
  var c = document.getElementById("hov-content");
  var progressHtml = VITALS.map(function(v) {
    var vs = getVitalStatus(v.id);
    return "<div class=\"hov-prog-pill " + vs.status + "\" onclick=\"hovScrollTo('" + v.id + "')\">" +
      (vs.status === "healthy" ? "\u2713" : vs.status === "critical" ? "\u26A0" : vs.answered + "/4") + " " + v.name +
    "</div>";
  }).join("");

  var vitalsHtml = VITALS.map(function(v, vi) {
    var vs = getVitalStatus(v.id);
    var hint = _csvHints[v.id] ? "<div class=\"hov-ctx-hint\">Data signal: <b>" + _csvHints[v.id] + "</b></div>" : "";
    var signalsHtml = v.signals.map(function(q, qi) {
      var key = v.id + "_" + qi;
      var ans = _answers[key];
      return "<div class=\"hov-signal\">" +
        "<div class=\"hov-signal-num\">" + (qi + 1) + "</div>" +
        "<div class=\"hov-signal-q\">" + q + "</div>" +
        "<div class=\"hov-signal-btns\">" +
          "<button class=\"hov-sig-btn yes" + (ans === true ? " active" : "") + "\" onclick=\"hovAnswer('" + key + "',true)\">Yes</button>" +
          "<button class=\"hov-sig-btn no" + (ans === false ? " active" : "") + "\" onclick=\"hovAnswer('" + key + "',false)\">No</button>" +
        "</div>" +
      "</div>";
    }).join("");
    var dots = [0,1,2,3].map(function(i) {
      var key = v.id + "_" + i;
      var cls = _answers[key] === true ? "yes" : _answers[key] === false ? "no" : "";
      return "<div class=\"hov-score-dot " + cls + "\"></div>";
    }).join("");
    return "<div class=\"hov-vital\" id=\"hov-vital-" + v.id + "\">" +
      "<div class=\"hov-vital-head\">" +
        "<div><div class=\"hov-vital-name\">" + v.name + "</div></div>" +
        "<div class=\"hov-vital-badge " + vs.status + "\">" + statusLabel(vs.status) + "</div>" +
      "</div>" +
      "<div class=\"hov-vital-sub\">" + v.sub + "</div>" +
      hint +
      "<div class=\"hov-signal-list\">" + signalsHtml + "</div>" +
      "<div class=\"hov-vital-score\">" + dots + "</div>" +
    "</div>";
  }).join("");

  var dnaKey = getDNAType();
  var dna = dnaKey ? DNA_TYPES[dnaKey] : null;

  var resultsHtml = "";
  if (dna) {
    var summaryHtml = VITALS.map(function(v) {
      var vs = getVitalStatus(v.id);
      return "<div class=\"hov-vs-card " + vs.status + "\" onclick=\"hovScrollTo('" + v.id + "')\">" +
        "<div class=\"hov-vs-name\">" + v.name.split(" ")[0] + "</div>" +
        "<div class=\"hov-vs-score " + vs.status + "\">" + vs.score + "/4</div>" +
      "</div>";
    }).join("");

    var failedSignals = [];
    VITALS.forEach(function(v) {
      v.signals.forEach(function(s, i) {
        var key = v.id + "_" + i;
        if (_answers[key] === false) {
          var rx = PRESCRIPTIONS[key];
          if (rx) failedSignals.push({ key: key, vital: v.name, severity: rx.severity, action: rx.action, detail: rx.detail, timeframe: rx.timeframe, owner: rx.owner });
        }
      });
    });

    var rxHtml = "";
    if (failedSignals.length > 0) {
      var rxCards = failedSignals.map(function(s, i) {
        return "<div class=\"hov-rx-card " + s.severity + "\">" +
          "<div class=\"hov-rx-card-hdr\" onclick=\"hovRxToggle(" + i + ")\">" +
            "<div class=\"hov-rx-sev\"></div>" +
            "<div style=\"flex:1\">" +
              "<div class=\"hov-rx-signal-name\">" + s.vital + " \u00B7 " + (s.severity === "critical" ? "CRITICAL" : "WARNING") + "</div>" +
              "<div class=\"hov-rx-action\">" + s.action + "</div>" +
            "</div>" +
            "<div style=\"font-size:12px;color:rgba(196,181,253,.3);flex-shrink:0;\" id=\"hov-rx-chev-" + i + "\">\u25BE</div>" +
          "</div>" +
          "<div class=\"hov-rx-card-body\" id=\"hov-rx-body-" + i + "\">" +
            "<div class=\"hov-rx-detail\">" + s.detail + "</div>" +
            "<div class=\"hov-rx-meta\"><span>Timeframe: <b>" + s.timeframe + "</b></span><span>Owner: <b>" + s.owner + "</b></span></div>" +
          "</div>" +
        "</div>";
      }).join("");
      rxHtml = "<div class=\"hov-rx-section\">" +
        "<div class=\"hov-rx-eyebrow\">The Prescription</div>" +
        "<div class=\"hov-rx-title\">" + failedSignals.length + " intervention" + (failedSignals.length !== 1 ? "s" : "") + " recommended.</div>" +
        "<div class=\"hov-rx-sub\">Each intervention is specific and time-bound. Click to expand the detail and implementation guide.</div>" +
        rxCards +
      "</div>";
    } else {
      rxHtml = "<div class=\"hov-pending-note\">All vital signs healthy. No interventions required. Return here if any signal changes.</div>";
    }

    var totalScore = VITALS.reduce(function(a, v) { return a + getVitalStatus(v.id).score; }, 0);
    var healthPct = Math.round((totalScore / 20) * 100);
    var critCount = VITALS.filter(function(v) { return getVitalStatus(v.id).status === "critical"; }).length;
    var warnCount = VITALS.filter(function(v) { return getVitalStatus(v.id).status === "warning"; }).length;
    var stmtTxt = dna.name === "The Quiet Compounding Machine"
      ? "This org is reading as <b>The Quiet Compounding Machine</b> - all five vital signs healthy. The advantage this kind of org builds is not visible in any single quarter. It compounds over time. The risk is complacency - assuming the model continues to work without active maintenance."
      : critCount > 0
      ? "This org is currently reading as <b>" + dna.name + "</b>. With <b>" + critCount + " critical vital sign" + (critCount > 1 ? "s" : "") + "</b>" + (warnCount > 0 ? " and " + warnCount + " at Watch" : "") + ", the financial risk is material and increasing. " + failedSignals.length + " specific interventions are available above - each costed, time-bound, and owned."
      : "This org is reading as <b>" + dna.name + "</b>. No vital signs are in critical condition, but " + (warnCount > 0 ? warnCount + " are at Watch." : "one or more signals need attention.") + " The prescription above is specific. The window to address watch signals before they become critical is typically 90-180 days.";

    resultsHtml =
      "<div style=\"margin-bottom:24px\">" +
        "<div class=\"hov-rx-eyebrow\" style=\"margin-bottom:12px\">Vital Signs Overview</div>" +
        "<div class=\"hov-vitals-summary\">" + summaryHtml + "</div>" +
      "</div>" +
      "<div class=\"hov-dna-card\">" +
        "<div class=\"hov-dna-eyebrow\">Organisation DNA Type</div>" +
        "<div class=\"hov-dna-type\">" + dna.name + "</div>" +
        "<div class=\"hov-dna-desc\">" + dna.desc + "</div>" +
        "<div class=\"hov-dna-grid\">" +
          "<div class=\"hov-dna-cell\"><div class=\"hov-dna-cell-lbl\">What this org does well</div><div class=\"hov-dna-cell-txt\">" + dna.good + "</div></div>" +
          "<div class=\"hov-dna-cell\"><div class=\"hov-dna-cell-lbl\">Where it is vulnerable</div><div class=\"hov-dna-cell-txt\">" + dna.vulnerable + "</div></div>" +
          "<div class=\"hov-dna-cell\"><div class=\"hov-dna-cell-lbl\">What breaks it</div><div class=\"hov-dna-cell-txt\">" + dna.breaks + "</div></div>" +
        "</div>" +
      "</div>" +
      rxHtml +
      "<div class=\"hov-stmt\"><div class=\"hov-stmt-lbl\">Intelligence Statement</div><div class=\"hov-stmt-txt\">" + stmtTxt + "</div></div>" +
      "<button class=\"hov-reset\" onclick=\"hovReset()\">Reset all answers</button>";
  } else {
    var answered = Object.keys(_answers).length;
    if (answered > 0 && answered < 20) {
      resultsHtml = "<div class=\"hov-pending-note\">" + answered + " of 20 signals answered. Complete all 20 to see your organisation DNA type and prescriptions.</div>";
    }
  }

  c.innerHTML =
    "<div class=\"hov-progress\" id=\"hov-progress\">" + progressHtml + "</div>" +
    (resultsHtml ? "<div id=\"hov-results\">" + resultsHtml + "</div>" : "") +
    vitalsHtml;
}

window.hovAnswer = function(key, val) {
  _answers[key] = val;
  render();
};

window.hovScrollTo = function(vitalId) {
  var el = document.getElementById("hov-vital-" + vitalId);
  if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
};

window.hovRxToggle = function(i) {
  var body = document.getElementById("hov-rx-body-" + i);
  var chev = document.getElementById("hov-rx-chev-" + i);
  if (!body) return;
  var open = body.classList.contains("open");
  body.classList.toggle("open", !open);
  if (chev) chev.textContent = open ? "\u25BE" : "\u25B4";
};

window.hovReset = function() {
  _answers = {};
  render();
};

loadCSVHints();
render();

})();
