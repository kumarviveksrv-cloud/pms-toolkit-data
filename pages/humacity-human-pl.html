<script>
(function(){
"use strict";

var DATA_KEY = "pms_custom_org_v1";
var SYM = "\u20B9";
var _hciF = [false, false, false, false];
var _userInputs = {};
var _computed = null;

function fmt(n) {
  var a = Math.abs(n), sg = n < 0 ? "-" : "";
  if (a >= 1e7) return sg + SYM + (a / 1e7).toFixed(2) + "Cr";
  if (a >= 1e5) return sg + SYM + (a / 1e5).toFixed(1) + "L";
  if (a >= 1000) return sg + SYM + Math.round(a / 1000) + "K";
  return sg + SYM + Math.round(a);
}

function hciCoeff() {
  return Math.round((0.70 + _hciF.filter(Boolean).length * 0.15) * 100) / 100;
}

function loadData() {
  try {
    var raw = localStorage.getItem(DATA_KEY);
    if (!raw) return null;
    var parsed = JSON.parse(raw);
    var rows = Array.isArray(parsed) ? parsed : (parsed.employees || parsed.rows || parsed.data || null);
    if (!rows || !rows.length) return null;
    return rows;
  } catch (e) { return null; }
}

function gField(row) {
  var keys = Object.keys(row);
  function find() {
    for (var i = 0; i < arguments.length; i++) {
      var arg = arguments[i];
      for (var j = 0; j < keys.length; j++) {
        if (keys[j].toLowerCase().replace(/[\s_-]/g,"") === arg.toLowerCase().replace(/[\s_-]/g,"")) return row[keys[j]];
      }
    }
    return null;
  }
  return {
    salary: parseFloat(find("salary","annualsalary","ctc","annualctc")) || 0,
    placement: (find("placement","talentsegment","category") || "").toLowerCase().trim(),
    tenure: parseFloat(find("tenureyears","tenure","yearsofservice")) || 0,
    department: (find("department","dept","team","function","division","businessunit") || "").toLowerCase().trim()
  };
}

var REVENUE_DEPT_KEYS = ["sales", "business development", "bd", "account management", "customer success", "growth", "revenue", "partnerships", "biz dev"];
function isRevenueDept(dept) {
  if (!dept) return false;
  return REVENUE_DEPT_KEYS.some(function(k){ return dept.indexOf(k) !== -1; });
}

function compute(rawRows) {
  var emps = rawRows.map(gField).filter(function(e) { return e.salary > 0; });
  if (!emps.length) return null;
  var totalComp = emps.reduce(function(a,e){return a+e.salary;},0);
  var stars = emps.filter(function(e) {
    var p = e.placement;
    return p.indexOf("star") !== -1 || p.indexOf("high performer") !== -1 || p.indexOf("hipo") !== -1 || p.indexOf("high potential") !== -1;
  });
  var emerging = emps.filter(function(e) {
    var p = e.placement;
    return p.indexOf("emerging") !== -1 || p.indexOf("developing") !== -1;
  });
  var tenured = emps.filter(function(e) { return e.tenure >= 5; });
  var inconsistent = emps.filter(function(e) {
    var p = e.placement;
    return p.indexOf("inconsistent") !== -1 || p.indexOf("underperf") !== -1 || p.indexOf("below") !== -1 || p.indexOf("needs improvement") !== -1;
  });
  var recentHires = emps.filter(function(e) { return e.tenure <= 2; });
  var hasDeptData = emps.some(function(e){ return !!e.department; });
  var revenueHires = hasDeptData ? recentHires.filter(function(e){ return isRevenueDept(e.department); }) : recentHires;
  var retentionSavings = Math.round(stars.reduce(function(a,e){return a+e.salary*1.5;},0)*0.3);
  var perfUplift = Math.round(emerging.reduce(function(a,e){return a+e.salary*0.08;},0));
  var culturePremium = Math.round(tenured.reduce(function(a,e){return a+e.salary*0.06;},0));
  var flightRisk = Math.round(inconsistent.reduce(function(a,e){return a+e.salary*0.6;},0));
  var skillDebt = Math.round(totalComp * 0.03);
  var growthGap = Math.round(totalComp * 0.02);
  var talentAcqValueDefault, acqCostDefault;
  if (hasDeptData) {
    talentAcqValueDefault = Math.round(revenueHires.reduce(function(a,e){return a+e.salary*1.40;},0));
    acqCostDefault = Math.round(revenueHires.reduce(function(a,e){return a+e.salary*0.15;},0));
  } else {
    talentAcqValueDefault = Math.round(recentHires.reduce(function(a,e){return a+e.salary*0.2;},0));
    acqCostDefault = Math.round(totalComp * 0.05);
  }
  var defaults = {
    talentAcqValue: talentAcqValueDefault,
    acqCost: acqCostDefault,
    devInvest: Math.round(emerging.reduce(function(a,e){return a+e.salary*0.04;},0)),
    hrFuncCost: Math.round(totalComp * 0.04),
    complianceCost: Math.round(totalComp * 0.015),
    cultureSpend: Math.round(totalComp * 0.02)
  };
  Object.keys(defaults).forEach(function(k) {
    if (_userInputs[k] === undefined) _userInputs[k] = defaults[k];
  });
  return {
    emps: emps.length, totalComp: totalComp,
    stars: stars.length, emerging: emerging.length, tenured: tenured.length,
    inconsistent: inconsistent.length, recentHires: recentHires.length,
    hasDeptData: hasDeptData,
    retentionSavings: retentionSavings, perfUplift: perfUplift,
    culturePremium: culturePremium,
    flightRisk: flightRisk, skillDebt: skillDebt, growthGap: growthGap
  };
}

function calcPL(d) {
  var talentAcqValue = _userInputs.talentAcqValue || 0;
  var retentionSavings = d.retentionSavings;
  var perfUplift = d.perfUplift;
  var culturePremium = d.culturePremium;
  var totalRevenue = talentAcqValue + retentionSavings + perfUplift + culturePremium;
  var acqCost = _userInputs.acqCost || 0;
  var devInvest = _userInputs.devInvest || 0;
  var hrFuncCost = _userInputs.hrFuncCost || 0;
  var totalCOGS = acqCost + devInvest + hrFuncCost;
  var grossMargin = totalRevenue - totalCOGS;
  var grossMarginPct = totalRevenue > 0 ? (grossMargin / totalRevenue * 100).toFixed(1) : "0.0";
  var complianceCost = _userInputs.complianceCost || 0;
  var cultureSpend = _userInputs.cultureSpend || 0;
  var totalOpEx = complianceCost + cultureSpend;
  var opProfit = grossMargin - totalOpEx;
  var totalAdj = d.flightRisk + d.skillDebt + d.growthGap;
  var netProfit = opProfit - totalAdj;
  var hrInvestment = totalCOGS + totalOpEx;
  var ratio = hrInvestment > 0 ? (netProfit / hrInvestment) : 0;
  return {
    talentAcqValue: talentAcqValue, retentionSavings: retentionSavings,
    perfUplift: perfUplift, culturePremium: culturePremium, totalRevenue: totalRevenue,
    acqCost: acqCost, devInvest: devInvest, hrFuncCost: hrFuncCost, totalCOGS: totalCOGS,
    grossMargin: grossMargin, grossMarginPct: grossMarginPct,
    complianceCost: complianceCost, cultureSpend: cultureSpend,
    totalOpEx: totalOpEx, opProfit: opProfit,
    flightRisk: d.flightRisk, skillDebt: d.skillDebt, growthGap: d.growthGap, totalAdj: totalAdj,
    netProfit: netProfit, hrInvestment: hrInvestment, ratio: ratio
  };
}

function renderHCI(pl, d) {
  var h = hciCoeff();
  if (pl) {
    try {
      localStorage.setItem("virorah_humacity_l4_result", JSON.stringify({
        humanNetProfit: Math.round(pl.netProfit * h),
        computedAt: new Date().toISOString()
      }));
    } catch(e){}
  }
  var el = document.getElementById("hhpl-hci-coeff");
  if (el) el.textContent = h.toFixed(2) + "x";
  _hciF.forEach(function(v, i) {
    var f = document.getElementById("hhpl-hci-f" + i);
    if (f) f.classList.toggle("yes", v);
  });
  var cl = document.getElementById("hhpl-hci-calc");
  if (cl) {
    var yc = _hciF.filter(Boolean).length;
    cl.innerHTML = "0.70 + (" + yc + " \u00D7 0.15) = <b style=\"color:#a78bfa;\">" + h.toFixed(2) + "</b>";
  }
  var sc = document.getElementById("hhpl-hci-scen");
  if (sc && pl) {
    var base = pl.netProfit;
    var c = Math.round(base * (h - 0.15));
    var y = Math.round(base * h);
    var o = Math.round(base * (h + 0.15));
    sc.innerHTML =
      "<tr><th>Scenario</th><th>HCI</th><th class=\"yours\">Adjusted Net</th></tr>" +
      "<tr><td class=\"label\">Conservative</td><td class=\"conservative\">" + (h-0.15).toFixed(2) + "x</td><td class=\"conservative\">" + fmt(c) + "</td></tr>" +
      "<tr><td class=\"label\" style=\"color:#a78bfa\">Your Assessment</td><td class=\"yours\">" + h.toFixed(2) + "x</td><td class=\"yours\">" + fmt(y) + "</td></tr>" +
      "<tr><td class=\"label\">Optimistic</td><td class=\"optimistic\">" + (h+0.15).toFixed(2) + "x</td><td class=\"optimistic\">" + fmt(o) + "</td></tr>";
  }
  var ratioEl = document.getElementById("hhpl-ratio-num");
  var heroRatioEl = document.getElementById("hhpl-hero-ratio");
  if (ratioEl && pl) {
    var adjRatio = pl.hrInvestment > 0 ? (Math.round(pl.netProfit * h) / pl.hrInvestment).toFixed(1) : "0.0";
    ratioEl.textContent = SYM + adjRatio + "x";
    if (heroRatioEl) heroRatioEl.textContent = SYM + adjRatio + "x";
  }
  var netEl = document.getElementById("hhpl-net-val");
  if (netEl && pl) {
    var adj = Math.round(pl.netProfit * h);
    netEl.textContent = fmt(adj);
    netEl.className = "hhpl-pl-net-val " + (adj >= 0 ? "pos" : "neg");
  }
  var ratRowEl = document.getElementById("hhpl-ratio-row-val");
  if (ratRowEl && pl) {
    var adjR = pl.hrInvestment > 0 ? (Math.round(pl.netProfit * h) / pl.hrInvestment).toFixed(1) : "0.0";
    ratRowEl.textContent = SYM + adjR + "x";
  }
}

function plRow(label, val, cls, fieldKey, desc) {
  var isEditable = !!fieldKey;

window.hhplHciToggle = function(i) {

  }
};

window.hhplEdit = function(field, rowEl) {
  var current = _userInputs[field] || 0;
  var valEl = rowEl.querySelector(".hhpl-pl-row-val");
  if (!valEl) return;
  valEl.innerHTML = "<input class=\"hhpl-edit-input\" id=\"hhpl-inp-" + field + "\" type=\"number\" value=\"" + current + "\">";
  var inp = document.getElementById("hhpl-inp-" + field);
  if (inp) {
    inp.focus();
    inp.addEventListener("blur", function() { hhplSave(field); });
    inp.addEventListener("keydown", function(e) { if (e.key === "Enter") hhplSave(field); });
  }
};

window.hhplSave = function(field) {
  var inp = document.getElementById("hhpl-inp-" + field);
  if (!inp) return;
  var val = parseInt(inp.value);
  if (!isNaN(val) && val >= 0) {
    _userInputs[field] = val;
    if (_computed) renderPL(_computed);
  }
};
