<style>
  .ab-wrap {
    max-width: 540px;
    margin: 0 auto;
    padding: 32px 20px;
    font-family: inherit;
    color: #e2e8f0;
  }

  .ab-card {
    background: #1a1f35;
    border: 1px solid #2d3550;
    border-radius: 16px;
    padding: 28px 24px;
    margin-bottom: 20px;
  }

  .ab-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #7c8db0;
    margin-bottom: 6px;
  }

  .ab-value {
    font-size: 15px;
    font-weight: 500;
    color: #e2e8f0;
  }

  .ab-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .04em;
  }

  .ab-badge.active {
    background: #0d3d2a;
    color: #34d399;
    border: 1px solid #34d399;
  }

  .ab-badge.pending {
    background: #3d2a0d;
    color: #fbbf24;
    border: 1px solid #fbbf24;
  }

  .ab-badge.cancelled {
    background: #3d0d0d;
    color: #f87171;
    border: 1px solid #f87171;
  }

  .ab-row {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 20px;
  }

  .ab-row:last-child {
    margin-bottom: 0;
  }

  .ab-col {
    flex: 1;
  }

  .ab-input {
    width: 100%;
    padding: 12px 14px;
    background: #0f1424;
    border: 1px solid #2d3550;
    border-radius: 10px;
    color: #e2e8f0;
    font-size: 14px;
    font-family: monospace;
    letter-spacing: .04em;
    box-sizing: border-box;
    outline: none;
  }

  .ab-input:focus {
    border-color: #6366f1;
  }

  .ab-btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
    margin-top: 12px;
  }

  .ab-btn:disabled {
    opacity: .45;
    cursor: not-allowed;
  }

  .ab-btn.primary {
    background: #6366f1;
    color: #fff;
  }

  .ab-btn.primary:hover:not(:disabled) {
    opacity: .88;
  }

  .ab-btn.danger {
    background: transparent;
    color: #f87171;
    border: 1px solid #f87171;
  }

  .ab-btn.danger:hover:not(:disabled) {
    background: #3d0d0d;
  }

  .ab-msg {
    font-size: 13px;
    margin-top: 10px;
    padding: 10px 14px;
    border-radius: 8px;
    display: none;
  }

  .ab-msg.error {
    background: #3d0d0d;
    color: #f87171;
    display: block;
  }

  .ab-msg.success {
    background: #0d3d2a;
    color: #34d399;
    display: block;
  }

  .ab-msg.info {
    background: #1a2550;
    color: #93c5fd;
    display: block;
  }

  .ab-divider {
    border: none;
    border-top: 1px solid #2d3550;
    margin: 20px 0;
  }

  .ab-cancel-section {
    margin-top: 8px;
  }

  .ab-cancel-warning {
    font-size: 12px;
    color: #7c8db0;
    margin-top: 8px;
    line-height: 1.5;
  }

  #ab-status-section {
    display: none;
  }

  .ab-spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255, 255, 255, .3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: ab-spin .6s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }

  @keyframes ab-spin {
    to {
      transform: rotate(360deg);
    }
  }
</style>

<div class="ab-wrap">

  <div class="ab-card" id="ab-key-section">
    <div class="ab-label">Your Access Key</div>
    <input
      class="ab-input"
      id="ab-key-input"
      type="text"
      placeholder="VIRO-XXXX-XXXX-XXXX"
      autocomplete="off"
      spellcheck="false"
    />
    <button class="ab-btn primary" id="ab-check-btn" onclick="abCheckStatus()">
      View Billing Status
    </button>
    <div class="ab-msg" id="ab-key-msg"></div>
  </div>

  <div id="ab-status-section">

    <div class="ab-card">
      <div class="ab-row">
        <div class="ab-col">
          <div class="ab-label">Plan</div>
          <div class="ab-value" id="ab-plan">-</div>
        </div>
        <div class="ab-col">
          <div class="ab-label">Status</div>
          <div class="ab-value" id="ab-status-badge">-</div>
        </div>
      </div>
      <div class="ab-row">
        <div class="ab-col">
          <div class="ab-label">Member Since</div>
          <div class="ab-value" id="ab-since">-</div>
        </div>
        <div class="ab-col">
          <div class="ab-label">Next Billing Date</div>
          <div class="ab-value" id="ab-next-billing">-</div>
        </div>
      </div>
    </div>

    <div class="ab-card ab-cancel-section" id="ab-cancel-card" style="display:none;">
      <hr class="ab-divider" style="margin-top:0;">
      <div class="ab-label" style="color:#f87171;">Cancel Subscription</div>
      <p class="ab-cancel-warning">
        Your access will continue until the end of your current billing period.
        After that, your account will revert to the Free plan.
        This action cannot be undone.
      </p>
      <button class="ab-btn danger" id="ab-cancel-btn" onclick="abConfirmCancel()">
        Cancel Subscription
      </button>
      <div class="ab-msg" id="ab-cancel-msg"></div>
    </div>

  </div>
</div>

<script>
  const WORKER = 'https://pms-toolkit-ai.kumarvivek-srv.workers.dev';

  function abFmt(isoDate) {
    if (!isoDate) return '-';
    const d = new Date(isoDate);
    return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  function abShowMsg(id, type, text) {
    const el = document.getElementById(id);
    el.className = 'ab-msg ' + type;
    el.textContent = text;
  }

  function abHideMsg(id) {
    const el = document.getElementById(id);
    el.className = 'ab-msg';
    el.textContent = '';
  }

  /* Signed-in Pro users do not type a key: the Worker finds theirs from their account. */
  function abGetKey() {
    const typed = document.getElementById('ab-key-input').value.trim().toUpperCase();
    if (typed) return typed;
    return (window._pmsPlan === 'pro' || window._pmsPlan === 'admin') ? 'CLERK-SESSION' : '';
  }

  async function abCheckStatus() {
    const key = abGetKey();
    if (!key) { abShowMsg('ab-key-msg', 'error', 'Please enter your access key.'); return; }

    const btn = document.getElementById('ab-check-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="ab-spinner"></span>Checking...';
    abHideMsg('ab-key-msg');

    try {
      const res = await fetch(WORKER + '?action=get-subscription-status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key }),
      });
      const data = await res.json();

      if (!res.ok) {
        /* Never leave the page blank: bring the key box back so the error is visible. */
        const ks = document.getElementById('ab-key-section');
        if (ks) ks.style.display = '';
        abShowMsg('ab-key-msg', 'error', data.error || 'Could not retrieve billing info.');
        return;
      }

      document.getElementById('ab-plan').textContent =
        data.plan === 'pro' ? 'Virorah PMS Pro' : 'Free';

      let statusLabel = '-', statusClass = '';
      if (data.revoked) {
        statusLabel = 'Cancelled'; statusClass = 'cancelled';
      } else if (data.cancelAtCycleEnd) {
        statusLabel = 'Cancellation Pending'; statusClass = 'pending';
      } else if (data.subscriptionStatus === 'active' || data.plan === 'pro') {
        statusLabel = 'Active'; statusClass = 'active';
      } else {
        statusLabel = data.subscriptionStatus || 'Active'; statusClass = 'active';
      }
      document.getElementById('ab-status-badge').innerHTML =
        '<span class="ab-badge ' + statusClass + '">' + statusLabel + '</span>';

      document.getElementById('ab-since').textContent = abFmt(data.createdAt);
      document.getElementById('ab-next-billing').textContent =
        data.cancelAtCycleEnd ? 'Cancelled - access until ' + abFmt(data.cancelledAt) :
        data.nextBillingDate  ? abFmt(data.nextBillingDate) : '-';

      const cancelCard = document.getElementById('ab-cancel-card');
      if (!data.revoked && !data.cancelAtCycleEnd && data.plan === 'pro') {
        cancelCard.style.display = 'block';
      } else {
        cancelCard.style.display = 'none';
      }

      document.getElementById('ab-status-section').style.display = 'block';

    } catch (e) {
      abShowMsg('ab-key-msg', 'error', 'Connection error. Please try again.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'View Billing Status';
    }
  }

  /* Signed in with a Pro plan: skip the key box and load the billing status straight away. */
  document.addEventListener('pms:auth-ready', function (e) {
    if (e.detail && e.detail.plan === 'admin') {
      /* Admin access is permanent and has no subscription record, so there is nothing to load. */
      abShowMsg('ab-key-msg', 'success', 'You are signed in as an admin. Admin access is permanent and has no subscription or billing to manage.');
      return;
    }
    if (e.detail && e.detail.plan === 'pro') {
      const sec = document.getElementById('ab-key-section');
      if (sec) sec.style.display = 'none';
      abCheckStatus();
    }
  });

  async function abConfirmCancel() {
    const confirmed = confirm(
      'Are you sure you want to cancel?\n\nYour access will continue until the end of the current billing period.'
    );
    if (!confirmed) return;

    const key = abGetKey();
    const btn = document.getElementById('ab-cancel-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="ab-spinner"></span>Cancelling...';
    abHideMsg('ab-cancel-msg');

    try {
      const res = await fetch(WORKER + '?action=cancel-subscription', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key }),
      });
      const data = await res.json();

      if (!res.ok) {
        abShowMsg('ab-cancel-msg', 'error', data.error || 'Cancellation failed. Please contact support.');
        btn.disabled = false;
        btn.textContent = 'Cancel Subscription';
        return;
      }

      abShowMsg('ab-cancel-msg', 'success', data.message || 'Subscription cancelled successfully.');
      btn.style.display = 'none';

      document.getElementById('ab-status-badge').innerHTML =
        '<span class="ab-badge pending">Cancellation Pending</span>';
      if (data.accessUntil) {
        document.getElementById('ab-next-billing').textContent =
          'Access until ' + abFmt(data.accessUntil);
      }

    } catch (e) {
      abShowMsg('ab-cancel-msg', 'error', 'Connection error. Please try again.');
      btn.disabled = false;
      btn.textContent = 'Cancel Subscription';
    }
  }
</script>


    </div><!-- /pms-content -->
