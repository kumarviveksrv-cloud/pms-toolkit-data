<script>
(function(){
"use strict";

var DATA_KEY = "pms_custom_org_v1";
var SYM = "\u20B9";
var _hciF = [false, false, false, false];
var _computed = null;

function fmt(n) {
  var a = Math.abs(n), sg = n < 0 ? "-" : "";
  if (a >= 1e7) return sg + SYM + (a / 1e7).toFixed(2) + "Cr";
  if (a >= 1e5) return sg + SYM + (a / 1e5).toFixed(1) + "L";
  if (a >= 1000) return sg + SYM + Math.round(a / 1000) + "K";
  return sg + SYM + Math.round(a);
}

function hciCoeff() {
  return Math.round((0.70 + _hciF.filter(Boolean).length * 0.15) * 100) / 100;
}

function loadData() {
  try {
    var raw = localStorage.getItem(DATA_KEY);
    if (!raw) return null;
    var parsed = JSON.parse(raw);
    var rows = Array.isArray(parsed) ? parsed : (parsed.employees || parsed.rows || parsed.data || null);
    if (!rows || !rows.length) return null;
    return rows;
  } catch (e) { return null; }
}

function gField(row) {
  var keys = Object.keys(row);
  function find() {
    for (var i = 0; i < arguments.length; i++) {
      var arg = arguments[i];
      for (var j = 0; j < keys.length; j++) {
        if (keys[j].toLowerCase().replace(/[\s_-]/g,"") === arg.toLowerCase().replace(/[\s_-]/g,"")) return row[keys[j]];
      }
    }
    return null;
  }
  return {
    salary: parseFloat(find("salary","annualsalary","ctc","annualctc")) || 0,
    placement: (find("placement","talentsegment","category") || "").toLowerCase().trim(),
    tenure: parseFloat(find("tenureyears","tenure","yearsofservice")) || 0,
    perf: parseFloat(find("performancescore","perfscore","score")) || 0,
    manager: (find("managername","manager","reportsto") || "").trim(),
    name: (find("name","employeename","fullname") || "").trim(),
    department: (find("department","dept","team","function","division","businessunit") || "").toLowerCase().trim(),
    level: (find("level","grade","band","joblevel") || "").toLowerCase().trim()
  };
}

var REVENUE_DEPT_KEYS = ["sales", "business development", "bd", "account management", "customer success", "growth", "revenue", "partnerships", "biz dev"];
function isRevenueDept(dept) {
  if (!dept) return false;
  return REVENUE_DEPT_KEYS.some(function(k){ return dept.indexOf(k) !== -1; });
}

var SENIOR_LEVEL_KEYS = ["senior", "lead", "director", "principal", "staff", "head", "vp", "chief"];
function isSeniorLevel(level) {
  if (!level) return false;
  return SENIOR_LEVEL_KEYS.some(function(k){ return level.indexOf(k) !== -1; });
}

function compute(rawRows) {
  var emps = rawRows.map(gField).filter(function(e) { return e.salary > 0; });
  if (!emps.length) return null;
  var totalComp = emps.reduce(function(a,e){return a+e.salary;},0);
  var avgSalary = totalComp / emps.length;
  var stars = emps.filter(function(e) {
    var p = e.placement;
    return p.indexOf("star") !== -1 || (p.indexOf("high performer") !== -1 && p.indexOf("high potential") === -1);
  });
  var hipos = emps.filter(function(e) {
    var p = e.placement;
    return p.indexOf("high potential") !== -1 || p.indexOf("hipo") !== -1;
  });
  var emerging = emps.filter(function(e) {
    return e.placement.indexOf("emerging") !== -1 || e.placement.indexOf("developing") !== -1;
  });
  var tenured = emps.filter(function(e) { return e.tenure >= 5; });
  var inconsistent = emps.filter(function(e) {
    return e.placement.indexOf("inconsistent") !== -1 || e.placement.indexOf("underperf") !== -1 || e.placement.indexOf("below") !== -1 || e.placement.indexOf("needs improvement") !== -1;
  });
  var managerSet = {};
  emps.forEach(function(e) { if (e.manager) managerSet[e.manager] = true; });
  var managers = emps.filter(function(e) { return managerSet[e.name]; });
  var mgrBelowTeam = 0;
  var gradePerfMap = {};
  emps.forEach(function(e) { var g = e.perf > 0 ? "all" : "none"; if (!gradePerfMap[g]) gradePerfMap[g] = []; gradePerfMap[g].push(e.perf); });
  var globalPerfAvg = emps.length > 0 ? emps.reduce(function(a,e){return a+e.perf;},0)/emps.length : 3;
  managers.forEach(function(mgr) {
    var reports = emps.filter(function(e) { return e.manager === mgr.name; });
    if (!reports.length) return;
    var teamAvg = reports.reduce(function(a,e){return a+e.perf;},0)/reports.length;
    if (mgr.perf < teamAvg) mgrBelowTeam++;
  });

  var gradePerfMap = {};
  emps.forEach(function(e) { var g = e.level || "default"; if (!gradePerfMap[g]) gradePerfMap[g] = []; gradePerfMap[g].push(e.perf); });
  var gradeBench = {};
  Object.keys(gradePerfMap).forEach(function(g) { var arr = gradePerfMap[g]; gradeBench[g] = arr.reduce(function(a,b){return a+b;},0) / arr.length; });

  var talentEquity = Math.round(stars.concat(hipos).reduce(function(a,e){
    var surplus = e.perf - (gradeBench[e.level || "default"] || 0);
    return a + surplus * e.salary * 2;
  }, 0));

  var seniorEmps = emps.filter(function(e){ return isSeniorLevel(e.level); });
  var institutionalKnowledge = Math.round(seniorEmps.reduce(function(a,e){
    return a + e.salary * Math.min(e.tenure * 0.08, 0.60);
  }, 0));

  var orgLearningVelocity = Math.round(emerging.reduce(function(a,e){return a+e.salary*0.35;},0));

  var hasDeptData = emps.some(function(e){ return !!e.department; });
  var relationshipCapital = 0;
  if (hasDeptData) {
    var revenueEmps = emps.filter(function(e){ return isRevenueDept(e.department) && e.tenure >= 2; });
    relationshipCapital = Math.round(revenueEmps.reduce(function(a,e){
      return a + e.salary * Math.min(e.tenure * 0.12, 0.80);
    }, 0));
  }

  var cultureAsset = Math.round(tenured.reduce(function(a,e){return a+e.salary*0.08;},0));

  var totalAssets = talentEquity + institutionalKnowledge + orgLearningVelocity + relationshipCapital + cultureAsset;

  var talentConcentrationRisk = Math.round(
    inconsistent.reduce(function(a,e){return a+e.salary*0.60;},0) +
    hipos.reduce(function(a,e){return a+e.salary*0.25;},0)
  );
  var skillDebtLiab = Math.round(totalComp * 0.03);
  var growthReadinessGap = Math.round(totalComp * 0.02);
  var cultureLiability = Math.round(
    inconsistent.reduce(function(a,e){return a+e.salary*0.25;},0) + totalComp * 0.01
  );
  var obsoleteEmps = tenured.filter(function(e){
    return e.placement.indexOf("inconsistent") !== -1 || e.placement.indexOf("underperf") !== -1 || e.placement.indexOf("below") !== -1 || e.placement.indexOf("needs improvement") !== -1;
  });
  var workforceObsolescence = Math.round(obsoleteEmps.reduce(function(a,e){return a+e.salary*0.30;},0));

  var totalLiabs = talentConcentrationRisk + skillDebtLiab + growthReadinessGap + cultureLiability + workforceObsolescence;

  var retainedEarnings = 0;
  var retainedEarningsAvailable = false;
  try {
    var l4raw = localStorage.getItem("virorah_humacity_l4_result");
    if (l4raw) {
      var l4data = JSON.parse(l4raw);
      if (typeof l4data.humanNetProfit === "number") {
        retainedEarnings = l4data.humanNetProfit;
        retainedEarningsAvailable = true;
      }
    }
  } catch(e) {}

  var netHumanCapital = totalAssets - totalLiabs;
  var assetDensity = totalComp > 0 ? (totalAssets / totalComp).toFixed(2) : "0.00";

  var starScore = Math.min(25, Math.round((stars.length / emps.length) * 250));
  var mgrScore = managers.length > 0 ? Math.min(20, Math.round(((managers.length - mgrBelowTeam) / managers.length) * 20)) : 10;
  var retScore = inconsistent.length === 0 ? 20 : Math.min(20, Math.max(5, Math.round(20 - inconsistent.length / emps.length * 100)));
  var pipeScore = hipos.length > 0 ? Math.min(20, Math.round(hipos.length / Math.max(stars.length, 1) * 30)) : 5;
  var knowScore = Math.min(15, Math.round(tenured.length / emps.length * 60));
  var humacityScore = starScore + mgrScore + retScore + pipeScore + knowScore;

  return {
    emps: emps.length, totalComp: totalComp, avgSalary: avgSalary,
    stars: stars.length, hipos: hipos.length, emerging: emerging.length,
    tenured: tenured.length, inconsistent: inconsistent.length, managers: managers.length,
    hasDeptData: hasDeptData,
    talentEquity: talentEquity, institutionalKnowledge: institutionalKnowledge, seniorCount: seniorEmps.length,
    orgLearningVelocity: orgLearningVelocity, relationshipCapital: relationshipCapital,
    cultureAsset: cultureAsset, totalAssets: totalAssets,
    talentConcentrationRisk: talentConcentrationRisk, skillDebtLiab: skillDebtLiab,
    growthReadinessGap: growthReadinessGap, cultureLiability: cultureLiability,
    workforceObsolescence: workforceObsolescence, totalLiabs: totalLiabs,
    retainedEarnings: retainedEarnings, retainedEarningsAvailable: retainedEarningsAvailable,
    netHumanCapital: netHumanCapital, assetDensity: assetDensity,
    humacityScore: humacityScore,
    starScore: starScore, mgrScore: mgrScore, retScore: retScore,
    pipeScore: pipeScore, knowScore: knowScore
  };
}

function renderHCI(d) {
  var h = hciCoeff();
  var el = document.getElementById("hbs-hci-coeff");
  if (el) el.textContent = h.toFixed(2) + "x";
  _hciF.forEach(function(v, i) {
    var f = document.getElementById("hbs-hci-f" + i);
    if (f) f.classList.toggle("yes", v);
  });
  var cl = document.getElementById("hbs-hci-calc");
  if (cl) {
    var yc = _hciF.filter(Boolean).length;
    cl.innerHTML = "0.70 + (" + yc + " \u00D7 0.15) = <b style=\"color:#a78bfa;\">" + h.toFixed(2) + "</b>";
  }
  var sc = document.getElementById("hbs-hci-scen");
  if (sc && d) {
    var base = d.netHumanCapital;
    var c = Math.round(base * (h - 0.15)) + d.retainedEarnings;
    var y = Math.round(base * h) + d.retainedEarnings;
    var o = Math.round(base * (h + 0.15)) + d.retainedEarnings;
    sc.innerHTML =
      "<tr><th>Scenario</th><th>HCI</th><th class=\"yours\">Adj. Net Human Capital</th></tr>" +
      "<tr><td class=\"label\">Conservative</td><td class=\"conservative\">" + (h-0.15).toFixed(2) + "x</td><td class=\"conservative\">" + fmt(c) + "</td></tr>" +
      "<tr><td class=\"label\" style=\"color:#a78bfa\">Your Assessment</td><td class=\"yours\">" + h.toFixed(2) + "x</td><td class=\"yours\">" + fmt(y) + "</td></tr>" +
      "<tr><td class=\"label\">Optimistic</td><td class=\"optimistic\">" + (h+0.15).toFixed(2) + "x</td><td class=\"optimistic\">" + fmt(o) + "</td></tr>";
  }
  var netEl = document.getElementById("hbs-equity-val");
  if (netEl && d) {
    var adj = Math.round(d.netHumanCapital * h) + d.retainedEarnings;
    netEl.textContent = fmt(adj);
    netEl.className = "hbs-bs-equity-val " + (adj >= 0 ? "pos" : "neg");
  }
  var densEl = document.getElementById("hbs-density-val");
  if (densEl && d) {
    var adjAssets = Math.round(d.totalAssets * h);
    densEl.textContent = d.totalComp > 0 ? (adjAssets / d.totalComp).toFixed(2) + "x" : "0.00x";
  }
}

function bsRow(label, val, side, swText) {
  var swId = "hbs-sw-" + label.replace(/[^a-zA-Z0-9]/g, "");
  return "<div class=\"hbs-bs-row\">" +
    "<div>" +
      "<div class=\"hbs-bs-row-label\">" + label + "</div>" +
      "<button class=\"hbs-sw-trigger\" onclick=\"hbsSwToggle('" + swId + "')\">\u25BE workings</button>" +
      "<div class=\"hbs-sw-panel\" id=\"" + swId + "\">" + swText + "</div>" +
    "</div>" +
    "<div class=\"hbs-bs-row-val " + side + "\">" + fmt(val) + "</div>" +
  "</div>";
}

function driverCls(score, max) { var pct = score / max; return pct >= 0.65 ? "high" : pct >= 0.4 ? "mid" : "low"; }

        "<div class=\"hbs-driver\"><div class=\"hbs-driver-lbl\">Pipeline</div><div class=\"hbs-driver-val " + driverCls(d.pipeScore, 20) + "\">" + d.pipeScore + "/20</div></div>" +

  });

  renderHCI(d);
}

window.hbsHciToggle = function(i) {
  _hciF[i] = !_hciF[i];
  if (_computed) renderHCI(_computed);
};

window.hbsSwToggle = function(id) {
  var panel = document.getElementById(id);
  if (!panel) return;
  var open = panel.classList.contains("open");
  document.querySelectorAll(".hbs-sw-panel.open").forEach(function(p) { p.classList.remove("open"); });
  if (!open) panel.classList.add("open");
};

  } else {
    renderPage(_computed);
  }
}
