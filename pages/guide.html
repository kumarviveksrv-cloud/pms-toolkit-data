<script>
const GUIDES = {

  'how-to-run-9box': {
    title: 'How to Run a 9-Box Calibration',
    description: 'Step-by-step guide to placing employees correctly in the 9-Box matrix',
    category: 'Performance',
    tier: 'Free',
    readTime: '8 min',
    calculatorLink: '/pages/scenarios-details.html?recordId=custom_org&calc=ninebox',
    calculatorName: '9-Box Grid Calculator',
    toc: ['What is the 9-Box?','Before You Start','Step-by-Step Process','Common Mistakes','Calibration Checklist'],
    related: [
      { slug: 'mastering-calibration', title: 'Mastering Calibration Sessions', icon: '⚖️' },
      { slug: 'manager-dashboard-review', title: 'Manager Dashboard Review', icon: '📋' },
      { slug: 'succession-pipeline', title: 'Building a Succession Pipeline', icon: '🔮' },
    ],
    content: `
      <section id="what-is">
        <div class="section-label">Overview</div>
        <h2 class="section-heading">What is the 9-Box Grid?</h2>
        <div class="guide-text">
          <p>The 9-Box Grid is the most widely used talent management tool in the world. Used by GE, McKinsey, and virtually every Fortune 500 company, it plots employees on a 3×3 matrix - <strong>Performance</strong> on the X-axis and <strong>Potential</strong> on the Y-axis.</p>
          <p>The result: nine distinct talent categories ranging from "Low Performer" to "Star", each requiring a different management response. Done well, it gives HR and senior leadership a single, shared view of your talent landscape - who to invest in, who to accelerate, who to manage out.</p>
          <div class="callout"><strong>Why it works:</strong> The 9-Box forces managers to make a two-dimensional judgment about their people. Most annual reviews only capture performance. The 9-Box adds the crucial question: <em>can this person grow beyond their current role?</em></div>
          <p>The challenge isn't understanding the grid - it's running the calibration process fairly, consistently, and without bias. That's what this guide covers.</p>
        </div>
      </section>
      <section id="before">
        <div class="section-label">Preparation</div>
        <h2 class="section-heading">Before You Start</h2>
        <div class="guide-text">
          <div class="step-block"><div class="step-num">1</div><div class="step-content"><div class="step-title">Define your rating scale</div><div class="step-body">Performance ratings should be based on a consistent 1–5 scale anchored to observable behaviours - not gut feel. Every manager in the room must be using the same definition of a "4".</div></div></div>
          <div class="step-block"><div class="step-num">2</div><div class="step-content"><div class="step-title">Gather potential evidence</div><div class="step-body">Potential is harder to rate than performance. Use three indicators: <strong>Learning agility</strong> (how quickly do they pick up new skills?), <strong>Leadership behaviour</strong> (do others follow them?), and <strong>Ambition + drive</strong> (do they seek stretch assignments?).</div></div></div>
          <div class="step-block"><div class="step-num">3</div><div class="step-content"><div class="step-title">Pre-populate the grid before the meeting</div><div class="step-body">Don't fill in the 9-Box live in the room - that anchors everyone to the first opinion. Have each manager independently place their direct reports first, then compare placements in the calibration session.</div></div></div>
          <div class="warning-box"><strong>⚠️ Watch out for:</strong> Recency bias (rating based on last 3 months, not the full year), halo effect (one strong project inflates the whole rating), and the "nice manager" trap (managers who rate everyone high to avoid conflict).</div>
        </div>
      </section>
      <section id="process">
        <div class="section-label">The Process</div>
        <h2 class="section-heading">Step-by-Step: Running the Session</h2>
        <div class="guide-text">
          <div class="step-block"><div class="step-num">1</div><div class="step-content"><div class="step-title">Set the rules upfront (5 min)</div><div class="step-body">Open with the ground rules: this is a talent conversation, not a performance review. Ratings are not final until the full group agrees. All placements are confidential. No one defends - everyone challenges constructively.</div></div></div>
          <div class="step-block"><div class="step-num">2</div><div class="step-content"><div class="step-title">Review pre-submitted placements (15 min)</div><div class="step-body">Display all managers' pre-submitted placements on a shared screen. Highlight discrepancies - where two managers placed the same person in very different boxes. These are your calibration flashpoints.</div></div></div>
          <div class="step-block"><div class="step-num">3</div><div class="step-content"><div class="step-title">Calibrate box by box, not person by person (30–45 min)</div><div class="step-body">Work through the boxes systematically. Start with the <strong>Stars (top-right)</strong> - these are your easiest conversations and build momentum. Then tackle the <strong>Low Performers (bottom-left)</strong>. Leave the middle boxes for last.</div></div></div>
          <div class="step-block"><div class="step-num">4</div><div class="step-content"><div class="step-title">Apply the distribution check (10 min)</div><div class="step-body">After placements, count the distribution. A healthy org typically has 10–15% Stars, 25–35% High Performers, 40–50% Core Performers, 10–20% in the lower boxes.</div></div></div>
          <div class="step-block"><div class="step-num">5</div><div class="step-content"><div class="step-title">Define next steps per box (10 min)</div><div class="step-body">The 9-Box only has value if it drives action. Agree on the management response for each box before leaving the room.</div></div></div>
        </div>
      </section>
      <section id="mistakes">
        <div class="section-label">Common Pitfalls</div>
        <h2 class="section-heading">Mistakes That Kill the 9-Box</h2>
        <div class="guide-text">
          <ul>
            <li><strong>Treating it as a once-a-year exercise.</strong> The 9-Box should be a living document, updated at least twice a year.</li>
            <li><strong>No action after the session.</strong> If the output stays in a slide deck and no manager has a different conversation as a result, the exercise was theatre.</li>
            <li><strong>Using only manager input.</strong> The best organisations triangulate manager ratings with 360° feedback, OKR attainment, and skip-level conversations.</li>
            <li><strong>Forgetting to look at box trajectories.</strong> Someone moving from box 5 to box 2 in 12 months is a different conversation than someone who's been in box 5 for three years.</li>
          </ul>
        </div>
      </section>`,
    checklist: [
      'Defined consistent performance rating scale (1–5) with behavioural anchors',
      'Gathered performance data for the full review period (not just last 3 months)',
      'Collected potential evidence: learning agility, leadership behaviour, drive',
      'Asked each manager to independently pre-place their direct reports',
      'Identified calibration flashpoints (same person, different box from two managers)',
      'Booked a 90-minute calibration session with all relevant managers',
      'Set and shared ground rules before the session starts',
      'Worked through Stars and Low Performers first, then the middle boxes',
      'Ran the distribution check - no box has >50% of the population',
      'Defined specific next steps (development, conversations, opportunities) per box',
      'Scheduled a follow-up review in 6 months to track movement',
    ]
  },

  'bell-curve-vs-forced-ranking': {
    title: 'Bell Curve vs Forced Ranking',
    description: 'When to use each approach and how to avoid the pitfalls of both',
    category: 'Performance',
    tier: 'Free',
    readTime: '6 min',
    calculatorLink: '/pages/scenarios-details.html?recordId=custom_org&calc=bellcurve',
    calculatorName: 'Bell Curve Calculator',
    toc: ["What's the Difference?",'The Case For Each','When They Go Wrong','The Hybrid Approach','Implementation Checklist'],
    related: [
      { slug: 'how-to-run-9box', title: 'How to Run a 9-Box Calibration', icon: '📊' },
      { slug: 'mastering-calibration', title: 'Mastering Calibration Sessions', icon: '⚖️' },
      { slug: 'salary-increment-planning', title: 'Salary Increment Planning', icon: '💰' },
    ],
    content: `
      <section id="difference">
        <div class="section-label">Overview</div>
        <h2 class="section-heading">What's the Difference?</h2>
        <div class="guide-text">
          <p><strong>Bell Curve (Normal Distribution):</strong> Employees are expected to fall naturally across a distribution - typically 10% exceptional, 25% above average, 45% average, 15% below average, and 5% poor performers. The curve is a target shape, not a hard quota.</p>
          <p><strong>Forced Ranking (Stack Ranking):</strong> Employees are explicitly ranked 1 to N within their group, and a fixed percentage must land in each category regardless of actual performance. The bottom X% face consequences every single cycle.</p>
          <div class="callout"><strong>The key distinction:</strong> Bell Curve is a <em>guideline</em> that shapes calibration conversations. Forced Ranking is a <em>mandate</em> that determines outcomes. One informs - the other dictates.</div>
        </div>
      </section>
      <section id="case-for">
        <div class="section-label">The Arguments</div>
        <h2 class="section-heading">The Case For Each</h2>
        <div class="guide-text">
          <div class="step-block"><div class="step-num">🔔</div><div class="step-content"><div class="step-title">Why Bell Curve works</div><div class="step-body">It combats grade inflation - the single biggest calibration disease in most organisations. When every manager rates 80% of their team as "exceeds expectations," the rating loses all meaning.</div></div></div>
          <div class="step-block"><div class="step-num">📋</div><div class="step-content"><div class="step-title">Why Forced Ranking was invented</div><div class="step-body">GE's logic in the 1980s: continuously improving the talent pool by removing the bottom 10% annually raises the average quality of the organisation over time.</div></div></div>
          <div class="step-block"><div class="step-num">🏢</div><div class="step-content"><div class="step-title">Context where each fits</div><div class="step-body">Bell Curve fits most organisations. Forced Ranking has narrow applications: large sales organisations with clear individual metrics, or organisations where role performance is genuinely zero-sum.</div></div></div>
        </div>
      </section>
      <section id="wrong">
        <div class="section-label">The Pitfalls</div>
        <h2 class="section-heading">When They Go Wrong</h2>
        <div class="guide-text">
          <div class="warning-box"><strong>Bell Curve failures:</strong> Applying the curve rigidly to small teams. Treating the target distribution as a hard quota. Using the curve as a substitute for actual manager judgment.</div>
          <div class="warning-box"><strong>Forced Ranking failures:</strong> Microsoft abandoned stack ranking in 2013 after it was cited as a primary cause of talent loss and internal political behaviour. It also destroys high-performing teams: a team of 10 stars still has a bottom 10%.</div>
          <div class="callout"><strong>The research verdict:</strong> A 2012 study of 14,000 employees found forced ranking reduced collaboration scores by 28% and increased voluntary turnover among high performers by 19%.</div>
        </div>
      </section>
      <section id="hybrid">
        <div class="section-label">Best Practice</div>
        <h2 class="section-heading">The Hybrid Approach That Actually Works</h2>
        <div class="guide-text">
          <div class="step-block"><div class="step-num">1</div><div class="step-content"><div class="step-title">Set a target distribution, not a quota</div><div class="step-body">Publish the expected distribution as a target. Allow deviations of up to 10 percentage points without justification. Deviations beyond that require written rationale reviewed by HR.</div></div></div>
          <div class="step-block"><div class="step-num">2</div><div class="step-content"><div class="step-title">Calibrate at the business unit level, not team level</div><div class="step-body">Bell curves applied to teams of fewer than 15 people are statistically meaningless. Aggregate ratings across the business unit (50+ people) before checking distribution health.</div></div></div>
          <div class="step-block"><div class="step-num">3</div><div class="step-content"><div class="step-title">Use distribution as a diagnostic, not a sentence</div><div class="step-body">The distribution flags the conversation - it doesn't decide the outcome.</div></div></div>
          <div class="step-block"><div class="step-num">4</div><div class="step-content"><div class="step-title">Never tie distribution directly to headcount decisions</div><div class="step-body">The moment "bottom 10%" automatically means "managed out," you have forced ranking - regardless of what you call it.</div></div></div>
        </div>
      </section>`,
    checklist: [
      'Decided which approach fits your organisation - bell curve guideline or forced ranking mandate',
      'Checked team sizes - bell curve only applied to groups of 15+ people',
      'Published target distribution to all managers before calibration season',
      'Clarified that distribution is a guideline, not a hard quota',
      'Set the deviation threshold that triggers HR review (e.g. >10% variance)',
      'Confirmed consequences are NOT automatically tied to distribution position',
      'Trained managers on the difference between grade inflation and genuine high performance',
      'Built an appeals or review process for employees who dispute their placement',
      "Reviewed last year's distribution for signs of gaming",
      'Planned a post-cycle review to assess whether the distribution produced fair outcomes',
    ]
  },

  'setting-okrs-that-work': {
    title: 'Setting OKRs That Actually Work',
    description: 'A practical framework for goals that drive real outcomes',

      <section id="what-is">
        <div class="section-label">Overview</div>
        <h2 class="section-heading">What Makes a Good OKR?</h2>
        <div class="guide-text">
          <p>OKRs - Objectives and Key Results - were invented at Intel by Andy Grove and made famous by Google. Set a clear, inspiring <strong>Objective</strong> (what you want to achieve) and pair it with 2–4 measurable <strong>Key Results</strong> (how you'll know you got there).</p>
          <div class="callout"><strong>The OKR test:</strong> Read your Objective out loud. Does it make someone lean forward? Now read your Key Results. Can you unambiguously answer "did we hit this?" at the end of the quarter? If no to either - you have a to-do list with aspirational language, not an OKR.</div>
        </div>
      </section>
      <section id="before">
        <div class="section-label">Preparation</div>
        <h2 class="section-heading">Before You Write a Single Goal</h2>
        <div class="guide-text">
          <div class="step-block"><div class="step-num">1</div><div class="step-content"><div class="step-title">What are the 3–5 things that must be true for this year to be a success?</div><div class="step-body">Not everything - the 3–5 things. If your CEO cannot answer this in one sentence per theme, your organisation isn't ready for OKRs.</div></div></div>
          <div class="step-block"><div class="step-num">2</div><div class="step-content"><div class="step-title">Are you using OKRs for alignment or accountability?</div><div class="step-body">Alignment OKRs are shared across teams. Accountability OKRs are individually owned. Mixing both without clarity creates the worst of both worlds.</div></div></div>
          <div class="step-block"><div class="step-num">3</div><div class="step-content"><div class="step-title">What is the grading convention?</div><div class="step-body">Google uses a 0–1 scale where 0.7 is considered a success. Decide this before launch and don't change it mid-cycle.</div></div></div>
          <div class="warning-box"><strong>⚠️ The cascade trap:</strong> Don't cascade OKRs top-down like a waterfall. Best practice: "top-down context, bottom-up goals."</div>
        </div>
      </section>
      <section id="process">
        <div class="section-label">The Process</div>
        <h2 class="section-heading">Writing OKRs Step-by-Step</h2>
        <div class="guide-text">
          <div class="step-block"><div class="step-num">1</div><div class="step-content"><div class="step-title">Write the Objective - make it a rallying cry, not a task</div><div class="step-body">Bad: "Improve customer satisfaction." Good: "Become the most trusted onboarding experience in our category by Q4."</div></div></div>
          <div class="step-block"><div class="step-num">2</div><div class="step-content"><div class="step-title">Write 2–4 Key Results - outcomes, not activities</div><div class="step-body">Bad: "Launch new onboarding flow." Good: "Increase Day-30 retention from 61% to 78%." The launch is an activity. The retention improvement is a Key Result.</div></div></div>
          <div class="step-block"><div class="step-num">3</div><div class="step-content"><div class="step-title">Apply the "so what" test to each Key Result</div><div class="step-body">If we hit this number and nothing else changed, would the Objective be meaningfully advanced? If no - it's a proxy metric.</div></div></div>
          <div class="step-block"><div class="step-num">4</div><div class="step-content"><div class="step-title">Set the baseline before setting the target</div><div class="step-body">"Increase NPS from 32 to 55" is valid. "Increase NPS to 55" is not - no baseline means no way to assess ambition or fairness.</div></div></div>
          <div class="step-block"><div class="step-num">5</div><div class="step-content"><div class="step-title">Run a weekly or bi-weekly check-in, not a quarterly one</div><div class="step-body">OKRs without cadenced check-ins are just goal documents. 15 minutes. Three questions: status, confidence score, one blocker.</div></div></div>
        </div>
      </section>
      <section id="mistakes">
        <div class="section-label">Common Pitfalls</div>
        <h2 class="section-heading">The Most Common OKR Mistakes</h2>
        <div class="guide-text">
          <ul>
            <li><strong>Too many OKRs.</strong> More than 3 Objectives and 9 Key Results means you have priorities, not OKRs.</li>
            <li><strong>Tying OKRs directly to bonuses.</strong> The moment OKRs are financially consequential, people start sandbagging.</li>
            <li><strong>Set-and-forget culture.</strong> OKRs that aren't reviewed regularly become irrelevant within six weeks.</li>
            <li><strong>Writing KRs for tasks you'd do anyway.</strong> "Complete Q3 product roadmap" is not a Key Result - it's your job.</li>
          </ul>
        </div>
      </section>`,
    checklist: [
      'Company-level Objectives are set by leadership and communicated before team OKR-writing begins',
      'Each Objective is qualitative, inspiring, and achievable within the OKR period',
      'Each team has no more than 3 Objectives and 4 Key Results per Objective',

    content: `
      <section id="what-is">
        <div class="section-label">Overview</div>
        <h2 class="section-heading">What Is Pay Equity (and What It Is Not)</h2>
        <div class="guide-text">
          <p><strong>Equal pay</strong> is a legal standard: employees doing the same job must receive the same pay regardless of gender or ethnicity. <strong>Equitable pay</strong> is a business and fairness standard: when you control for role, level, experience, and performance, do systematic pay gaps still exist between demographic groups?</p>
          <div class="callout"><strong>The compa-ratio framework:</strong> Compa-ratio = actual salary ÷ market midpoint for their role and level. Below 0.85 = underpaid. Above 1.15 = overpaid. Analysing compa-ratios by gender and ethnicity reveals structural gaps invisible in raw salary comparisons.</div>
        </div>
      </section>
      <section id="before">
        <div class="section-label">Preparation</div>
        <h2 class="section-heading">Before You Run the Numbers</h2>
        <div class="guide-text">
          <div class="step-block"><div class="step-num">1</div><div class="step-content"><div class="step-title">Build a clean, consistent job architecture</div><div class="step-body">Map every role to a level band (e.g. L1–L6). This is the hardest part of a pay audit - and the most important.</div></div></div>
          <div class="step-block"><div class="step-num">2</div><div class="step-content"><div class="step-title">Gather market benchmarks by role and level</div><div class="step-body">Use salary surveys (Radford, Mercer, Korn Ferry) or local market data to establish market midpoints for each role-level combination.</div></div></div>
          <div class="step-block"><div class="step-num">3</div><div class="step-content"><div class="step-title">Decide on your control variables</div><div class="step-body">Role, level, function, geography, years of experience, and performance rating. Be cautious about tenure - it can perpetuate historical inequity.</div></div></div>
          <div class="warning-box"><strong>⚠️ Statistical significance matters:</strong> Fewer than 30 people in a demographic group means findings are likely to mislead more than inform.</div>
        </div>
      </section>
      <section id="process">
        <div class="section-label">The Audit</div>
        <h2 class="section-heading">Running the Audit Step-by-Step</h2>
        <div class="guide-text">
          <div class="step-block"><div class="step-num">1</div><div class="step-content"><div class="step-title">Calculate compa-ratios for every employee</div><div class="step-body">Compa-ratio = Actual Salary ÷ Market Midpoint. A compa-ratio of 0.92 means the employee is paid 8% below market.</div></div></div>
          <div class="step-block"><div class="step-num">2</div><div class="step-content"><div class="step-title">Segment compa-ratios by demographic group</div><div class="step-body">A gap of more than 5 percentage points in average compa-ratio between groups within the same level warrants investigation.</div></div></div>
          <div class="step-block"><div class="step-num">3</div><div class="step-content"><div class="step-title">Run a regression analysis</div><div class="step-body">An unadjusted gender pay gap of 18% might reduce to 4% after controlling for level and role - but that remaining 4% is the systemic gap you need to fix.</div></div></div>
          <div class="step-block"><div class="step-num">4</div><div class="step-content"><div class="step-title">Identify outliers in both directions</div><div class="step-body">Flag every employee with compa-ratio below 0.85 (underpaid) or above 1.20 (significantly overpaid).</div></div></div>
          <div class="step-block"><div class="step-num">5</div><div class="step-content"><div class="step-title">Build a remediation cost estimate</div><div class="step-body">In most organisations, 3–5% of total payroll is sufficient to close identified gaps. Present with a phased timeline.</div></div></div>
        </div>
      </section>
      <section id="mistakes">
        <div class="section-label">Taking Action</div>
        <h2 class="section-heading">What to Do With the Findings</h2>
        <div class="guide-text">
          <ul>
            <li><strong>The communication question.</strong> Acknowledge publicly that an audit was conducted and gaps are being corrected - without disclosing individual data.</li>
            <li><strong>The "we can't afford it" response.</strong> Pay equity corrections are legal and ethical obligations, not optional expenses.</li>
            <li><strong>The recurring gap problem.</strong> Fix the process that created the gaps - starting salary practices, promotion rates, calibration quality.</li>
          </ul>
          <div class="warning-box"><strong>Don't reduce anyone's salary.</strong> Pay equity corrections should only move salaries upward.</div>
        </div>
      </section>`,

      <section id="what-is">
        <div class="section-label">Overview</div>
        <h2 class="section-heading">Why Most Succession Plans Fail</h2>
        <div class="guide-text">
          <p>A succession plan is a document. A succession <em>pipeline</em> is a living system that continuously identifies talent, accelerates development, and tracks readiness.</p>
          <div class="callout"><strong>The hard truth:</strong> According to PwC's annual CEO survey, 69% of organisations have no identified internal successor for their CEO. The reason is almost never a lack of talent - it's a lack of intentional development.</div>
        </div>
      </section>
      <section id="before">
        <div class="section-label">The Framework</div>
        <h2 class="section-heading">The 4-Horizon Pipeline Model</h2>
        <div class="guide-text">
          <div class="step-block"><div class="step-num">🟢</div><div class="step-content"><div class="step-title">Ready Now</div><div class="step-body">Could step into the role within 3 months. In most organisations, 5–10% of high potentials genuinely qualify as Ready Now for the next level.</div></div></div>
          <div class="step-block"><div class="step-num">🔵</div><div class="step-content"><div class="step-title">Ready in 1 Year</div><div class="step-body">Has the raw capability but needs one or two more experiences: a stretch assignment, a cross-functional rotation, or significant exposure to a weaker business dimension.</div></div></div>
          <div class="step-block"><div class="step-num">🟡</div><div class="step-content"><div class="step-title">Ready in 2 Years</div><div class="step-body">Strong long-term potential but earlier in the development journey. These are your investment candidates.</div></div></div>
          <div class="step-block"><div class="step-num">⚪</div><div class="step-content"><div class="step-title">Not Yet Identified</div><div class="step-body">Roles with no viable internal candidate. The most important category to be honest about - it drives external sourcing decisions.</div></div></div>
          <div class="warning-box"><strong>⚠️ The depth check:</strong> Every critical role should have at least one Ready Now and one Ready in 1 Year candidate. One name across all horizons = a single point of failure.</div>

      <section id="process">
        <div class="section-label">Building the Pipeline</div>
        <h2 class="section-heading">Building Your Bench Step-by-Step</h2>
        <div class="guide-text">
          <div class="step-block"><div class="step-num">1</div><div class="step-content"><div class="step-title">Identify critical roles (not just senior roles)</div><div class="step-body">Ask: "If this person left tomorrow with no notice, how bad would it be?" High impact = critical role.</div></div></div>
          <div class="step-block"><div class="step-num">2</div><div class="step-content"><div class="step-title">Map the competency profile for each critical role</div><div class="step-body">Define what "ready" looks like - 4–6 competencies reflecting where the business is going, not just where it is.</div></div></div>
          <div class="step-block"><div class="step-num">3</div><div class="step-content"><div class="step-title">Assess candidates against the future competency profile</div><div class="step-body">Rate each candidate: Demonstrated, Developing, or Gap. Three or more gaps = Ready in 2+ Years regardless of 9-Box placement.</div></div></div>
          <div class="step-block"><div class="step-num">4</div><div class="step-content"><div class="step-title">Build individual development plans for each successor</div><div class="step-body">Document the two or three experiences they need to be ready, who owns making those experiences happen, and a timeline.</div></div></div>

        <h2 class="section-heading">Accelerating Successor Readiness</h2>

      <section id="what-is">
        <div class="section-label">Overview</div>
        <h2 class="section-heading">What Is a Manager Dashboard Review?</h2>
        <div class="guide-text">
          <p>A structured conversation between an HR Business Partner and a line manager - using team analytics data as the anchor - to identify talent risks, performance patterns, and development priorities before they become problems.</p>
          <div class="callout"><strong>The manager's perspective matters:</strong> The HRBP's role is not auditor - it's thought partner. The conversation should feel like two people solving a puzzle together.</div>

        <h2 class="section-heading">The Six Metrics That Matter</h2>

          <div class="step-block"><div class="step-num">1</div><div class="step-content"><div class="step-title">Performance distribution</div><div class="step-body">Compare to the organisation benchmark. 70% at top two ratings = either exceptional team or grade inflation problem.</div></div></div>
          <div class="step-block"><div class="step-num">2</div><div class="step-content"><div class="step-title">Flight risk concentration</div><div class="step-body">Each departure of a top performer costs 1.5–2x their annual salary. If 40%+ of high performers are medium or high risk, something structural needs to change.</div></div></div>

          <div class="step-block"><div class="step-num">4</div><div class="step-content"><div class="step-title">OKR health score</div><div class="step-body">Below 50% - don't ask "why is this low?" Ask "what's getting in the way?"</div></div></div>

    content: `
      <section id="what-is">
        <div class="section-label">Overview</div>
        <h2 class="section-heading">Why Calibration Breaks Down</h2>
        <div class="guide-text">
          <p>Calibration sessions are the single most important event in the performance management calendar. They're also the one most likely to be done badly - an hour of rushed conversation with the most senior person's opinions dominating.</p>
          <div class="callout"><strong>What calibration is actually for:</strong> Ensuring that a "4" given by one manager means the same thing as a "4" given by another. Without calibration, you don't have a performance system - you have individual manager opinions using the same numerical scale.</div>
        </div>
      </section>
      <section id="before">
        <div class="section-label">Preparation</div>
        <h2 class="section-heading">Before the Session: The Setup That Determines Everything</h2>
        <div class="guide-text">
          <div class="step-block"><div class="step-num">1</div><div class="step-content"><div class="step-title">Anchor each rating to behavioural definitions</div><div class="step-body">Bad: "5 = Exceptional." Good: "5 = Consistently delivers results that exceed their role scope; regularly cited by peers and stakeholders as a critical contributor."</div></div></div>
          <div class="step-block"><div class="step-num">2</div><div class="step-content"><div class="step-title">Require managers to submit ratings with written evidence</div><div class="step-body">Ratings submitted without evidence are opinions. Require 2–3 specific examples per employee - not summaries, but concrete instances.</div></div></div>
          <div class="step-block"><div class="step-num">3</div><div class="step-content"><div class="step-title">Pre-analyse the submissions for anomalies</div><div class="step-body">Flag: outlier distributions by manager, employees rated very differently by managers who've both worked with them, and anyone at rating 1–2 who has received no prior feedback.</div></div></div>
          <div class="step-block"><div class="step-num">4</div><div class="step-content"><div class="step-title">Share the "state of play" before the meeting</div><div class="step-body">Send the aggregate distribution summary (no names) so managers arrive with awareness of where their ratings sit relative to the group.</div></div></div>
        </div>
      </section>
      <section id="process">
        <div class="section-label">Facilitation</div>
        <h2 class="section-heading">Facilitation Techniques That Work</h2>
        <div class="guide-text">

      <section id="what-is">

        <h2 class="section-heading">What DEI Data Actually Tells You</h2>
        <div class="guide-text">
          <p>Good DEI analytics identifies where in the talent lifecycle disadvantage is occurring, how large the gaps are, and what is driving them.</p>
          <div class="callout"><strong>The representation vs. equity distinction:</strong> Representation metrics tell you about outcomes. Equity metrics (promotion rates, performance ratings, compa-ratios by demographic) tell you about processes. Most organisations track representation and wonder why it doesn't improve - because representation is the output of dozens of process decisions.</div>
        </div>
      </section>
      <section id="before">
        <div class="section-label">The Metrics</div>
        <h2 class="section-heading">The Five Metrics Worth Tracking</h2>
        <div class="guide-text">
          <div class="step-block"><div class="step-num">1</div><div class="step-content"><div class="step-title">Promotion rate by demographic group (within level)</div><div class="step-body">If women at Senior level are promoted at 12% per year and men at 19% - controlling for performance rating - you have a structural promotion gap.</div></div></div>
          <div class="step-block"><div class="step-num">2</div><div class="step-content"><div class="step-title">Performance rating distribution by demographic group</div><div class="step-body">Systematically lower ratings for equivalent employees points to calibration bias - not a performance problem.</div></div></div>
          <div class="step-block"><div class="step-num">3</div><div class="step-content"><div class="step-title">Pay compa-ratio gap by gender and ethnicity</div><div class="step-body">Report the adjusted pay gap - the gap remaining after controlling for role, level, and performance. That's the actual inequity.</div></div></div>
          <div class="step-block"><div class="step-num">4</div><div class="step-content"><div class="step-title">High potential identification rate by demographic group</div><div class="step-body">Underrepresentation in the HiPo pool signals systematic bias in how potential is assessed or who has access to visibility.</div></div></div>
          <div class="step-block"><div class="step-num">5</div><div class="step-content"><div class="step-title">Attrition rate by demographic group and level</div><div class="step-body">Selective attrition - women or minority employees leaving at higher rates at mid-senior levels - is the primary driver of underrepresentation in leadership.</div></div></div>

        <h2 class="section-heading">Interpreting Your DEI Dashboard</h2>

          <div class="step-block"><div class="step-num">1</div><div class="step-content"><div class="step-title">Look for patterns, not single data points</div><div class="step-body">Lower promotion rates AND lower performance ratings AND lower HiPo identification rates for the same group is harder to explain by any single confounding factor.</div></div></div>
          <div class="step-block"><div class="step-num">2</div><div class="step-content"><div class="step-title">Control before you conclude</div><div class="step-body">When gaps remain after controlling for legitimate factors, you've found something that needs explaining.</div></div></div>
          <div class="step-block"><div class="step-num">3</div><div class="step-content"><div class="step-title">Be honest about statistical significance</div><div class="step-body">For organisations under 200 employees, focus on gender analysis only. Treat ethnic minority analysis as directional rather than conclusive.</div></div></div>

      <section id="what-is">
        <div class="section-label">Overview</div>
        <h2 class="section-heading">What a PIP Is (and Isn't)</h2>
        <div class="guide-text">
          <p>A PIP used only as exit documentation creates a process that is expensive, legally risky, demoralising for the employee, and exhausting for the manager - while almost never producing improved performance.</p>
          <div class="callout"><strong>The honest conversation you need to have first:</strong> "Do I believe this person can succeed in this role with the right support, or am I initiating this because I've already decided the relationship is over?" If the latter - a PIP is the wrong tool.</div>
          <p>When designed and run well, PIPs succeed roughly 30–40% of the time - meaning the employee genuinely improves and continues in the role.</p>
        </div>
      </section>
      <section id="before">
        <div class="section-label">Preparation</div>
        <h2 class="section-heading">Before You Start a PIP</h2>
        <div class="guide-text">
          <div class="step-block"><div class="step-num">1</div><div class="step-content"><div class="step-title">Document that informal feedback has already been given</div><div class="step-body">A PIP should never be the first time an employee hears that their performance is a concern. No paper trail of prior feedback = legally fragile and humanly unfair.</div></div></div>
          <div class="step-block"><div class="step-num">2</div><div class="step-content"><div class="step-title">Diagnose the root cause of underperformance</div><div class="step-body">Five causes: skills gap, motivation gap, role clarity gap, resourcing gap, or personal circumstances. Each requires a different response. A PIP is not the right tool for a resourcing gap.</div></div></div>
          <div class="step-block"><div class="step-num">3</div><div class="step-content"><div class="step-title">Consult HR and legal before initiating</div><div class="step-body">In most jurisdictions, a formal PIP constitutes the beginning of a disciplinary process. HRBP involvement from the start is non-negotiable.</div></div></div>
          <div class="warning-box"><strong>⚠️ Protected characteristics:</strong> Verify that performance concerns are independent of any protected characteristic before initiating. PIPs disproportionately against protected groups create discrimination claims.</div>
        </div>
      </section>
      <section id="process">
        <div class="section-label">Design</div>
        <h2 class="section-heading">Designing the PIP</h2>
        <div class="guide-text">
          <div class="step-block"><div class="step-num">1</div><div class="step-content"><div class="step-title">Write specific, measurable performance expectations</div><div class="step-body">Bad: "Needs to improve communication." Good: "Must send project status updates to stakeholders every Friday by 3pm, with no more than one missed update in the 8-week period."</div></div></div>
          <div class="step-block"><div class="step-num">2</div><div class="step-content"><div class="step-title">Define the support that will be provided</div><div class="step-body">A PIP without support commitments from the organisation is a disciplinary document, not an improvement plan.</div></div></div>
          <div class="step-block"><div class="step-num">3</div><div class="step-content"><div class="step-title">Set a clear timeline with a midpoint review</div><div class="step-body">30–90 days typically. Build in a formal midpoint review - it gives clarity on progress and creates a documented checkpoint.</div></div></div>
          <div class="step-block"><div class="step-num">4</div><div class="step-content"><div class="step-title">State the consequences clearly - but not harshly</div><div class="step-body">Every PIP must state what happens if expectations are met (continuation in role) and what happens if they're not (typically termination). This must be stated explicitly, not implied.</div></div></div>
        </div>
      </section>
      <section id="mistakes">
        <div class="section-label">Execution</div>
        <h2 class="section-heading">Running the PIP Period</h2>
        <div class="guide-text">

            <li><strong>Weekly check-ins - not less frequent.</strong> Check-ins that slip to bi-weekly signal the manager isn't serious.</li>
            <li><strong>Document everything in writing within 24 hours.</strong> A written summary the employee acknowledged receiving is documentation. A memory of a Tuesday meeting is not.</li>
            <li><strong>Don't change the goalposts.</strong> Adding new requirements mid-PIP is both unfair and legally indefensible.</li>

      <section id="what-is">
        <div class="section-label">Overview</div>
        <h2 class="section-heading">Why Most 360 Programmes Fail</h2>
        <div class="guide-text">
          <p>The most common failure is using 360 feedback as a performance rating tool rather than a development tool. When scores feed directly into compensation decisions, raters start gaming the system - friends inflate, rivals deflate, everyone rates at the safe middle.</p>
          <div class="callout"><strong>The cardinal rule:</strong> Decide upfront whether the 360 is for development or evaluation - and keep these uses completely separate. Mixing the two poisons both.</div>
        </div>

        <div class="section-label">Design</div>
        <h2 class="section-heading">Designing the Right Questions</h2>
        <div class="guide-text">
          <div class="step-block"><div class="step-num">1</div><div class="step-content"><div class="step-title">Focus on 6–8 competencies maximum</div><div class="step-body">40 questions across 12 competencies generates survey fatigue. Select competencies most relevant to the individual's role and development stage.</div></div></div>
          <div class="step-block"><div class="step-num">2</div><div class="step-content"><div class="step-title">Use frequency-scaled questions, not agreement scales</div><div class="step-body">"1 = Rarely, 5 = Almost Always" forces raters to anchor on actual observed behaviour. "1 = Strongly Disagree" produces socially desirable responses.</div></div></div>
          <div class="step-block"><div class="step-num">3</div><div class="step-content"><div class="step-title">Include 2–3 open-ended questions, not 10</div><div class="step-body">Three questions: "Greatest strength as a leader?", "One behaviour change that would most increase effectiveness?", "What should they keep doing they might not realise is impactful?"</div></div></div>
          <div class="warning-box"><strong>⚠️ Rater anonymity is not optional.</strong> If raters believe responses can be attributed to them, they will not be honest - especially when rating upward.</div>
        </div>
      </section>
      <section id="process">
        <div class="section-label">Process</div>
        <h2 class="section-heading">Running the Process Fairly</h2>
        <div class="guide-text">
          <div class="step-block"><div class="step-num">1</div><div class="step-content"><div class="step-title">Involve the recipient in rater selection, but don't let them control it</div><div class="step-body">Recipient proposes list. Manager/HRBP reviews and adds 2–3 names the recipient didn't suggest - including people they may find challenging.</div></div></div>
          <div class="step-block"><div class="step-num">2</div><div class="step-content"><div class="step-title">Set a two-week completion window, no more</div><div class="step-body">Send reminders at Day 7 and Day 12. Close on time - chasing beyond the deadline teaches raters that deadlines are flexible.</div></div></div>
          <div class="step-block"><div class="step-num">3</div><div class="step-content"><div class="step-title">Require a minimum response rate</div><div class="step-body">Minimum 5 rater responses before generating the report, with at least 2 in each rater category.</div></div></div>

            <li><strong>Give the recipient the report 48 hours before the debrief.</strong> Reading a 360 report in front of a coach is overwhelming - the recipient needs time to process privately.</li>
            <li><strong>Start the debrief with strengths, not gaps.</strong> People who understand their genuine strengths create more improvement than those focused exclusively on weakness remediation.</li>

          <div class="callout"><strong>The three philosophies:</strong> <strong>Performance-led:</strong> high performers get disproportionately large increments. <strong>Market-led:</strong> increments sized to bring everyone to market. <strong>Blended:</strong> base increment tied to market position, performance modifier applied on top. Whichever you adopt - articulate it explicitly.</div>

          <div class="step-block"><div class="step-num">2</div><div class="step-content"><div class="step-title">Build market position into the increment formula</div><div class="step-body">An employee at 0.82 compa-ratio needs a larger increment than one at 1.05 compa-ratio - even with the same rating.</div></div></div>
          <div class="step-block"><div class="step-num">3</div><div class="step-content"><div class="step-title">Set aside a retention pool</div><div class="step-body">Reserve 10–15% of the budget before distributing the rest. Used for targeted retention awards to high-risk, high-value employees identified during the talent review.</div></div></div>

        <h2 class="section-heading">The Seven Signs Your PMS Is Theatre</h2>

          <div class="step-block"><div class="step-num">1</div><div class="step-content"><div class="step-title">Rating distributions are suspiciously uniform - and high</div><div class="step-body">If the average rating is consistently 3.8–4.2 on a 5-point scale across most managers and teams, you have grade inflation.</div></div></div>
          <div class="step-block"><div class="step-num">2</div><div class="step-content"><div class="step-title">Calibration outcomes don't change ratings</div><div class="step-body">In most theatre organisations, fewer than 5% of ratings change as a result of calibration. Healthy calibration typically results in 15–25% of ratings being adjusted.</div></div></div>
          <div class="step-block"><div class="step-num">3</div><div class="step-content"><div class="step-title">Employees are surprised by their ratings</div><div class="step-body">In a real performance culture, the formal rating should be the least surprising event of the year.</div></div></div>
          <div class="step-block"><div class="step-num">4</div><div class="step-content"><div class="step-title">High performers and average performers receive similar increments</div><div class="step-body">If the spread between Rating 5 and Rating 3 increment is less than 4 percentage points, the compensation system is not differentiating.</div></div></div>
          <div class="step-block"><div class="step-num">5</div><div class="step-content"><div class="step-title">Low performers remain in role without active management</div><div class="step-body">Rating someone a 2 and then managing them exactly as you manage a 4 signals to everyone that ratings have no consequences.</div></div></div>
          <div class="step-block"><div class="step-num">6</div><div class="step-content"><div class="step-title">The PMS is owned by HR, not by the business</div><div class="step-body">Real performance culture is owned by the senior leadership team.</div></div></div>
          <div class="step-block"><div class="step-num">7</div><div class="step-content"><div class="step-title">Employees describe the review process as a waste of time</div><div class="step-body">If more than 40% answer "no" to "Does the performance review process help you understand what you need to do to progress?" - you have a theatre problem.</div></div></div>
        </div>
      </section>
      <section id="why">
        <div class="section-label">Root Causes</div>
        <h2 class="section-heading">Why Performance Theatre Happens</h2>
        <div class="guide-text">
          <div class="step-block"><div class="step-num">🔥</div><div class="step-content"><div class="step-title">Feedback is emotionally costly and rarely rewarded</div><div class="step-body">Managers who avoid difficult feedback suffer no visible consequences. Managers who lean into it get no obvious reward. The incentive structure consistently favours conflict avoidance.</div></div></div>
          <div class="step-block"><div class="step-num">📊</div><div class="step-content"><div class="step-title">The rating is designed for multiple conflicting purposes</div><div class="step-body">Increment, bonus, promotion, PIP initiation, development feedback, board reporting - all from a single 1–5 number. When the rating has too many uses, managers optimise for one and compromise the rest.</div></div></div>
          <div class="step-block"><div class="step-num">⚖️</div><div class="step-content"><div class="step-title">Low performance has no real consequences, so ratings drift upward</div><div class="step-body">If a Rating 2 triggers months of PIP administration and a Rating 3 triggers nothing - the rational calculation is always the 3.</div></div></div>
        </div>
      </section>
      <section id="fix">
        <div class="section-label">The Fix</div>
        <h2 class="section-heading">Building a Real Performance Culture</h2>
        <div class="guide-text">
          <div class="step-block"><div class="step-num">1</div><div class="step-content"><div class="step-title">Separate the rating from the conversation</div><div class="step-body">Decouple the development conversation from the compensation decision. Hold development conversations in Q2 and compensation conversations in Q4. The conversations are better because the stakes of each are lower.</div></div></div>
          <div class="step-block"><div class="step-num">2</div><div class="step-content"><div class="step-title">Make manager feedback quality a metric, not an assumption</div><div class="step-body">Quarterly pulse: "Has your manager given you specific, actionable feedback in the last 30 days?" Manager scores should feed into manager performance assessments.</div></div></div>
          <div class="step-block"><div class="step-num">3</div><div class="step-content"><div class="step-title">Make low ratings consequential - but make them supported</div><div class="step-body">HRBP assigned to every low-performance case, standardised PIP template, clear legal guardrails, manager coaching toolkit.</div></div></div>
          <div class="step-block"><div class="step-num">4</div><div class="step-content"><div class="step-title">Start calibration with data, not manager self-reports</div><div class="step-body">The HRBP opens with: "Here's what I'm seeing in the data before you've said a word." Distribution by manager, year-on-year trends, outliers, demographic patterns.</div></div></div>
        </div>
      </section>`,

      <section id="what-is">
        <div class="section-label">Overview</div>
        <h2 class="section-heading">What Is the Balanced Scorecard?</h2>
        <div class="guide-text">
          <p>The Balanced Scorecard (BSC) was developed by Kaplan and Norton at Harvard Business School in the early 1990s. It addresses a fundamental problem with traditional performance measurement: organisations that manage by financial metrics alone are driving by looking in the rear-view mirror.</p>
          <p>The BSC adds three forward-looking perspectives - Customer, Internal Process, and Learning & Growth - to the traditional Financial perspective. The result is a measurement framework that captures both what has been achieved and what capabilities are being built for the future.</p>
          <div class="callout"><strong>Why HR leaders need the BSC:</strong> HR is often asked to justify its existence in financial terms - cost per hire, turnover cost, training ROI. The BSC gives HR a legitimate framework for demonstrating strategic value across dimensions that matter to the business, not just the finance team.</div>
          <p>Applied to HR, the Balanced Scorecard answers one critical question: how does HR's work translate into organisational performance - not just operationally, but strategically?</p>
        </div>
      </section>

        <div class="section-label">The Framework</div>
        <h2 class="section-heading">The Four Perspectives Explained</h2>
        <div class="guide-text">
          <div class="step-block"><div class="step-num">💰</div><div class="step-content"><div class="step-title">Financial Perspective - What does HR cost, and what does it return?</div><div class="step-body">This is not just HR's budget. It includes the financial impact of HR's decisions: cost of turnover, revenue per employee, productivity of new hires, ROI of learning programmes. HR metrics here should connect to P&L outcomes - not just HR department costs.</div></div></div>
          <div class="step-block"><div class="step-num">👥</div><div class="step-content"><div class="step-title">Customer Perspective - Who are HR's customers, and are they satisfied?</div><div class="step-body">HR has two customer groups: employees (whose experience drives engagement and retention) and business leaders (whose talent needs HR exists to serve). Metrics here include manager satisfaction with HR partnership, employee experience scores, and time-to-fill for critical roles.</div></div></div>
          <div class="step-block"><div class="step-num">⚙️</div><div class="step-content"><div class="step-title">Internal Process Perspective - Are HR's core processes reliable and efficient?</div><div class="step-body">This covers the quality and consistency of HR's operational execution: recruitment cycle time, performance review completion rates, calibration consistency, payroll accuracy, and policy compliance. Broken processes here undermine everything else.</div></div></div>
          <div class="step-block"><div class="step-num">🌱</div><div class="step-content"><div class="step-title">Learning & Growth Perspective - Is the organisation building future capability?</div><div class="step-body">This is where HR's strategic contribution lives: succession pipeline depth, leadership capability scores, learning hours per employee, internal promotion rate, and diversity of the talent pipeline. These are leading indicators - they predict financial outcomes 2–3 years in advance.</div></div></div>
          <div class="callout"><strong>The causality chain:</strong> Learning & Growth → Internal Process quality → Customer satisfaction → Financial outcomes. The BSC is most powerful when organisations can draw an explicit line from capability investments today to financial performance tomorrow.</div>

          <div class="step-block"><div class="step-num">2</div><div class="step-content"><div class="step-title">Select 3–5 metrics per perspective maximum</div><div class="step-body">A Balanced Scorecard with 40 metrics is not balanced - it's a data dump. The discipline of selection is where strategy is operationalised. Choose metrics that are genuinely leading indicators, not just data that's easy to collect.</div></div></div>
          <div class="step-block"><div class="step-num">3</div><div class="step-content"><div class="step-title">Establish baselines before setting targets</div><div class="step-body">You cannot set a meaningful target without a baseline. For every metric on the scorecard, spend time understanding current performance before agreeing on what "good" looks like. Arbitrary targets produce gaming, not improvement.</div></div></div>
          <div class="step-block"><div class="step-num">4</div><div class="step-content"><div class="step-title">Build the strategy map - show the causality</div><div class="step-body">A strategy map is a one-page visual that shows how each perspective's objectives connect to the others. Drawing these arrows explicitly forces the HR leadership team to articulate and test its theory of how HR creates value. Arrows that can't be defended shouldn't be on the map.</div></div></div>
          <div class="step-block"><div class="step-num">5</div><div class="step-content"><div class="step-title">Review quarterly - but measure continuously</div><div class="step-body">The BSC review cadence is quarterly - strategic enough to be meaningful, frequent enough to enable course correction. But data collection should be continuous. Quarterly reviews that rely on data gathered in the week before the meeting are reviews of memory, not performance.</div></div></div>
          <div class="warning-box"><strong>⚠️ The compliance trap:</strong> The most common BSC failure is selecting metrics that HR controls rather than metrics that matter to the business. "Training hours delivered" is a metric HR controls. "Manager capability score (rated by direct reports)" is a metric that matters to the business. Always prefer the latter.</div>
        </div>
      </section>

          </ul>

        </div>

        ${guide.content.split('<section').map((section, idx) => {
          if (idx === 0) return '';
          return `<div class="content-section" style="animation-delay:${idx * 0.08}s"><section ${section}</div>`;
        }).join('')}
        <div class="content-section" style="animation-delay:.4s">
          <div class="section-label">Implementation Checklist</div>
          <h2 class="section-heading">${guide.toc[guide.toc.length - 1]}</h2>
          <p style="font-size:13px;color:#6b7280;margin-bottom:20px;">Tick off each step as you complete it - your progress is saved automatically.</p>
          <div class="checklist-wrap" id="checklist-wrap">
            ${checklist.map((item, i) => `<div class="checklist-item ${progress[i] ? 'checked' : ''}" data-index="${i}" onclick="toggleCheck(${i})"><div class="check-box"></div><div class="check-text">${item}</div></div>`).join('')}
          </div>
          <div style="margin-top:16px;padding:14px;background:#f0f4ff;border-radius:8px;text-align:center;font-size:13px;color:#667eea;font-weight:600;display:none;" id="completion-msg"></div>
        </div>
      </div>
      <div class="guide-sidebar">
        ${guide.calculatorLink ? `<div class="cta-card"><div class="cta-icon">📊</div><div class="cta-title">Try it on your data</div><div class="cta-sub">Run the ${guide.calculatorName} on your own organisation's employee data.</div><a href="${guide.calculatorLink}" class="cta-btn">Open Calculator →</a></div>` : ''}
        ${guide.toc ? `<div class="sidebar-card"><div class="sidebar-title">In This Guide</div>${guide.toc.map(item => `<div class="toc-item"><div class="toc-dot"></div>${item}</div>`).join('')}</div>` : ''}
        ${guide.related && guide.related.length ? `<div class="sidebar-card"><div class="sidebar-title">Related Guides</div>${guide.related.map(r => `<a class="related-item" href="/pages/guide.html?slug=${r.slug}"><span class="related-icon">${r.icon}</span>${r.title}</a>`).join('')}</div>` : ''}
        <div class="sidebar-card" style="text-align:center;">
          <div style="font-size:24px;margin-bottom:8px;">💡</div>
          <div style="font-size:12px;font-weight:700;color:#1a1a2e;margin-bottom:6px;">All guides are included in your plan</div>
          <div style="font-size:11px;color:#6b7280;line-height:1.6;">Free guides are available to all users. Pro guides require a Pro subscription.</div>
        </div>
      </div>
    </div>`;

  updateCompletionMsg(slug);
}

function toggleCheck(index) {
  const slug = getSlug();
  const progress = loadProgress(slug);
  progress[index] = !progress[index];
  saveProgress(slug, progress);
  const item = document.querySelector(`[data-index="${index}"]`);
  if (item) item.classList.toggle('checked', !!progress[index]);
  const checklist = GUIDES[slug].checklist || [];
  const completed = checklist.filter((_, i) => progress[i]).length;
  const pct = Math.round(completed / checklist.length * 100);
  const bar = document.getElementById('hero-progress-bar');
  if (bar) bar.style.width = pct + '%';
  const label = document.querySelector('.progress-label');
  if (label) label.textContent = `${completed}/${checklist.length} checklist items complete · ${pct}%`;
  updateCompletionMsg(slug);
}

function updateCompletionMsg(slug) {
  const guide = GUIDES[slug];
  if (!guide || !guide.checklist) return;
  const progress = loadProgress(slug);
  const completed = guide.checklist.filter((_, i) => progress[i]).length;
  const msg = document.getElementById('completion-msg');
  if (!msg) return;
  if (completed === guide.checklist.length) { msg.style.display = 'block'; msg.textContent = '🎉 All done! You\'re fully prepared.'; }
  else if (completed > 0) { msg.style.display = 'block'; msg.textContent = `${guide.checklist.length - completed} item${guide.checklist.length - completed > 1 ? 's' : ''} left to complete.`; }
  else { msg.style.display = 'none'; }
}

render();
</script>
