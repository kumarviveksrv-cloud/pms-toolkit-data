 "how-to-run-9box": {
  "title": "How to Run a 9-Box Calibration",
  "description": "Step-by-step guide to placing employees correctly in the 9-Box matrix",
  "category": "Performance",
  "tier": "Free",
  "readTime": "8 min",
  "calculatorLink": "/pages/scenarios-details.html?recordId=custom_org&calc=ninebox",
  "calculatorName": "9-Box Grid Calculator",
  "toc": [

  ],
  "related": [
   {

    "icon": "⚖️"
   },
   {

   {

    "icon": "🔮"
   }
  ],
  "content": "\n      <section id=\"what-is\">\n        <div class=\"section-label\">Overview</div>\n        <h2 class=\"section-heading\">What is the 9-Box Grid?</h2>\n        <div class=\"guide-text\">\n          <p>The 9-Box Grid is the most widely used talent management tool in the world. Used by GE, McKinsey, and virtually every Fortune 500 company, it plots employees on a 3×3 matrix - <strong>Performance</strong> on the X-axis and <strong>Potential</strong> on the Y-axis.</p>\n          <p>The result: nine distinct talent categories ranging from \"Low Performer\" to \"Star\", each requiring a different management response. Done well, it gives HR and senior leadership a single, shared view of your talent landscape - who to invest in, who to accelerate, who to manage out.</p>\n          <div class=\"callout\"><strong>Why it works:</strong> The 9-Box forces managers to make a two-dimensional judgment about their people. Most annual reviews only capture performance. The 9-Box adds the crucial question: <em>can this person grow beyond their current role?</em></div>\n          <p>The challenge isn't understanding the grid - it's running the calibration process fairly, consistently, and without bias. That's what this guide covers.</p>\n        </div>\n      </section>\n      <section id=\"before\">\n        <div class=\"section-label\">Preparation</div>\n        <h2 class=\"section-heading\">Before You Start</h2>\n        <div class=\"guide-text\">\n          <div class=\"step-block\"><div class=\"step-num\">1</div><div class=\"step-content\"><div class=\"step-title\">Define your rating scale</div><div class=\"step-body\">Performance ratings should be based on a consistent 1–5 scale anchored to observable behaviours - not gut feel. Every manager in the room must be using the same definition of a \"4\".</div></div></div>\n          <div class=\"step-block\"><div class=\"step-num\">2</div><div class=\"step-content\"><div class=\"step-title\">Gather potential evidence</div><div class=\"step-body\">Potential is harder to rate than performance. Use three indicators: <strong>Learning agility</strong> (how quickly do they pick up new skills?), <strong>Leadership behaviour</strong> (do others follow them?), and <strong>Ambition + drive</strong> (do they seek stretch assignments?).</div></div></div>\n          <div class=\"step-block\"><div class=\"step-num\">3</div><div class=\"step-content\"><div class=\"step-title\">Pre-populate the grid before the meeting</div><div class=\"step-body\">Don't fill in the 9-Box live in the room - that anchors everyone to the first opinion. Have each manager independently place their direct reports first, then compare placements in the calibration session.</div></div></div>\n          <div class=\"warning-box\"><strong>⚠️ Watch out for:</strong> Recency bias (rating based on last 3 months, not the full year), halo effect (one strong project inflates the whole rating), and the \"nice manager\" trap (managers who rate everyone high to avoid conflict).</div>\n        </div>\n      </section>\n      <section id=\"process\">\n        <div class=\"section-label\">The Process</div>\n        <h2 class=\"section-heading\">Step-by-Step: Running the Session</h2>\n        <div class=\"guide-text\">\n          <div class=\"step-block\"><div class=\"step-num\">1</div><div class=\"step-content\"><div class=\"step-title\">Set the rules upfront (5 min)</div><div class=\"step-body\">Open with the ground rules: this is a talent conversation, not a performance review. Ratings are not final until the full group agrees. All placements are confidential. No one defends - everyone challenges constructively.</div></div></div>\n          <div class=\"step-block\"><div class=\"step-num\">2</div><div class=\"step-content\"><div class=\"step-title\">Review pre-submitted placements (15 min)</div><div class=\"step-body\">Display all managers' pre-submitted placements on a shared screen. Highlight discrepancies - where two managers placed the same person in very different boxes. These are your calibration flashpoints.</div></div></div>\n          <div class=\"step-block\"><div class=\"step-num\">3</div><div class=\"step-content\"><div class=\"step-title\">Calibrate box by box, not person by person (30–45 min)</div><div class=\"step-body\">Work through the boxes systematically. Start with the <strong>Stars (top-right)</strong> - these are your easiest conversations and build momentum. Then tackle the <strong>Low Performers (bottom-left)</strong>. Leave the middle boxes for last.</div></div></div>\n          <div class=\"step-block\"><div class=\"step-num\">4</div><div class=\"step-content\"><div class=\"step-title\">Apply the distribution check (10 min)</div><div class=\"step-body\">After placements, count the distribution. A healthy org typically has 10–15% Stars, 25–35% High Performers, 40–50% Core Performers, 10–20% in the lower boxes.</div></div></div>\n          <div class=\"step-block\"><div class=\"step-num\">5</div><div class=\"step-content\"><div class=\"step-title\">Define next steps per box (10 min)</div><div class=\"step-body\">The 9-Box only has value if it drives action. Agree on the management response for each box before leaving the room.</div></div></div>\n        </div>\n      </section>\n      <section id=\"mistakes\">\n        <div class=\"section-label\">Common Pitfalls</div>\n        <h2 class=\"section-heading\">Mistakes That Kill the 9-Box</h2>\n        <div class=\"guide-text\">\n          <ul>\n            <li><strong>Treating it as a once-a-year exercise.</strong> The 9-Box should be a living document, updated at least twice a year.</li>\n            <li><strong>No action after the session.</strong> If the output stays in a slide deck and no manager has a different conversation as a result, the exercise was theatre.</li>\n            <li><strong>Using only manager input.</strong> The best organisations triangulate manager ratings with 360° feedback, OKR attainment, and skip-level conversations.</li>\n            <li><strong>Forgetting to look at box trajectories.</strong> Someone moving from box 5 to box 2 in 12 months is a different conversation than someone who's been in box 5 for three years.</li>\n          </ul>\n        </div>\n      </section>",
  "checklist": [
   "Defined consistent performance rating scale (1–5) with behavioural anchors",
   "Gathered performance data for the full review period (not just last 3 months)",
   "Collected potential evidence: learning agility, leadership behaviour, drive",

   "Set and shared ground rules before the session starts",

   "Ran the distribution check - no box has >50% of the population",
   "Defined specific next steps (development, conversations, opportunities) per box",
   "Scheduled a follow-up review in 6 months to track movement"
  ]
 },
 "bell-curve-vs-forced-ranking": {
  "title": "Bell Curve vs Forced Ranking",
  "description": "When to use each approach and how to avoid the pitfalls of both",
  "category": "Performance",
  "tier": "Free",
  "readTime": "6 min",
  "calculatorLink": "/pages/scenarios-details.html?recordId=custom_org&calc=bellcurve",
  "calculatorName": "Bell Curve Calculator",
  "toc": [
   "What's the Difference?",
   "The Case For Each",
   "When They Go Wrong",
   "The Hybrid Approach",
   "Implementation Checklist"
  ],
  "related": [
   {
    "slug": "how-to-run-9box",
    "title": "How to Run a 9-Box Calibration",
    "icon": "📊"
   },
   {
    "slug": "mastering-calibration",
    "title": "Mastering Calibration Sessions",
    "icon": "⚖️"
   },
   {
    "slug": "salary-increment-planning",
    "title": "Salary Increment Planning",
    "icon": "💰"
   }
  ],
  "content": "\n      <section id=\"difference\">\n        <div class=\"section-label\">Overview</div>\n        <h2 class=\"section-heading\">What's the Difference?</h2>\n        <div class=\"guide-text\">\n          <p><strong>Bell Curve (Normal Distribution):</strong> Employees are expected to fall naturally across a distribution - typically 10% exceptional, 25% above average, 45% average, 15% below average, and 5% poor performers. The curve is a target shape, not a hard quota.</p>\n          <p><strong>Forced Ranking (Stack Ranking):</strong> Employees are explicitly ranked 1 to N within their group, and a fixed percentage must land in each category regardless of actual performance. The bottom X% face consequences every single cycle.</p>\n          <div class=\"callout\"><strong>The key distinction:</strong> Bell Curve is a <em>guideline</em> that shapes calibration conversations. Forced Ranking is a <em>mandate</em> that determines outcomes. One informs - the other dictates.</div>\n        </div>\n      </section>\n      <section id=\"case-for\">\n        <div class=\"section-label\">The Arguments</div>\n        <h2 class=\"section-heading\">The Case For Each</h2>\n        <div class=\"guide-text\">\n          <div class=\"step-block\"><div class=\"step-num\">🔔</div><div class=\"step-content\"><div class=\"step-title\">Why Bell Curve works</div><div class=\"step-body\">It combats grade inflation - the single biggest calibration disease in most organisations. When every manager rates 80% of their team as \"exceeds expectations,\" the rating loses all meaning.</div></div></div>\n          <div class=\"step-block\"><div class=\"step-num\">📋</div><div class=\"step-content\"><div class=\"step-title\">Why Forced Ranking was invented</div><div class=\"step-body\">GE's logic in the 1980s: continuously improving the talent pool by removing the bottom 10% annually raises the average quality of the organisation over time.</div></div></div>\n          <div class=\"step-block\"><div class=\"step-num\">🏢</div><div class=\"step-content\"><div class=\"step-title\">Context where each fits</div><div class=\"step-body\">Bell Curve fits most organisations. Forced Ranking has narrow applications: large sales organisations with clear individual metrics, or organisations where role performance is genuinely zero-sum.</div></div></div>\n        </div>\n      </section>\n      <section id=\"wrong\">\n        <div class=\"section-label\">The Pitfalls</div>\n        <h2 class=\"section-heading\">When They Go Wrong</h2>\n        <div class=\"guide-text\">\n          <div class=\"warning-box\"><strong>Bell Curve failures:</strong> Applying the curve rigidly to small teams. Treating the target distribution as a hard quota. Using the curve as a substitute for actual manager judgment.</div>\n          <div class=\"warning-box\"><strong>Forced Ranking failures:</strong> Microsoft abandoned stack ranking in 2013 after it was cited as a primary cause of talent loss and internal political behaviour. It also destroys high-performing teams: a team of 10 stars still has a bottom 10%.</div>\n          <div class=\"callout\"><strong>The research verdict:</strong> A 2012 study of 14,000 employees found forced ranking reduced collaboration scores by 28% and increased voluntary turnover among high performers by 19%.</div>\n        </div>\n      </section>\n      <section id=\"hybrid\">\n        <div class=\"section-label\">Best Practice</div>\n        <h2 class=\"section-heading\">The Hybrid Approach That Actually Works</h2>\n        <div class=\"guide-text\">\n          <div class=\"step-block\"><div class=\"step-num\">1</div><div class=\"step-content\"><div class=\"step-title\">Set a target distribution, not a quota</div><div class=\"step-body\">Publish the expected distribution as a target. Allow deviations of up to 10 percentage points without justification. Deviations beyond that require written rationale reviewed by HR.</div></div></div>\n          <div class=\"step-block\"><div class=\"step-num\">2</div><div class=\"step-content\"><div class=\"step-title\">Calibrate at the business unit level, not team level</div><div class=\"step-body\">Bell curves applied to teams of fewer than 15 people are statistically meaningless. Aggregate ratings across the business unit (50+ people) before checking distribution health.</div></div></div>\n          <div class=\"step-block\"><div class=\"step-num\">3</div><div class=\"step-content\"><div class=\"step-title\">Use distribution as a diagnostic, not a sentence</div><div class=\"step-body\">The distribution flags the conversation - it doesn't decide the outcome.</div></div></div>\n          <div class=\"step-block\"><div class=\"step-num\">4</div><div class=\"step-content\"><div class=\"step-title\">Never tie distribution directly to headcount decisions</div><div class=\"step-body\">The moment \"bottom 10%\" automatically means \"managed out,\" you have forced ranking - regardless of what you call it.</div></div></div>\n        </div>\n      </section>",

  "content": "\n      <section id=\"what-is\">\n        <div class=\"section-label\">Overview</div>\n        <h2 class=\"section-heading\">What Makes a Good OKR?</h2>\n        <div class=\"guide-text\">\n          <p>OKRs - Objectives and Key Results - were invented at Intel by Andy Grove and made famous by Google. Set a clear, inspiring <strong>Objective</strong> (what you want to achieve) and pair it with 2–4 measurable <strong>Key Results</strong> (how you'll know you got there).</p>\n          <div class=\"callout\"><strong>The OKR test:</strong> Read your Objective out loud. Does it make someone lean forward? Now read your Key Results. Can you unambiguously answer \"did we hit this?\" at the end of the quarter? If no to either - you have a to-do list with aspirational language, not an OKR.</div>\n        </div>\n      </section>\n      <section id=\"before\">\n        <div class=\"section-label\">Preparation</div>\n        <h2 class=\"section-heading\">Before You Write a Single Goal</h2>\n        <div class=\"guide-text\">\n          <div class=\"step-block\"><div class=\"step-num\">1</div><div class=\"step-content\"><div class=\"step-title\">What are the 3–5 things that must be true for this year to be a success?</div><div class=\"step-body\">Not everything - the 3–5 things. If your CEO cannot answer this in one sentence per theme, your organisation isn't ready for OKRs.</div></div></div>\n          <div class=\"step-block\"><div class=\"step-num\">2</div><div class=\"step-content\"><div class=\"step-title\">Are you using OKRs for alignment or accountability?</div><div class=\"step-body\">Alignment OKRs are shared across teams. Accountability OKRs are individually owned. Mixing both without clarity creates the worst of both worlds.</div></div></div>\n          <div class=\"step-block\"><div class=\"step-num\">3</div><div class=\"step-content\"><div class=\"step-title\">What is the grading convention?</div><div class=\"step-body\">Google uses a 0–1 scale where 0.7 is considered a success. Decide this before launch and don't change it mid-cycle.</div></div></div>\n          <div class=\"warning-box\"><strong>⚠️ The cascade trap:</strong> Don't cascade OKRs top-down like a waterfall. Best practice: \"top-down context, bottom-up goals.\"</div>\n        </div>\n      </section>\n      <section id=\"process\">\n        <div class=\"section-label\">The Process</div>\n        <h2 class=\"section-heading\">Writing OKRs Step-by-Step</h2>\n        <div class=\"guide-text\">\n          <div class=\"step-block\"><div class=\"step-num\">1</div><div class=\"step-content\"><div class=\"step-title\">Write the Objective - make it a rallying cry, not a task</div><div class=\"step-body\">Bad: \"Improve customer satisfaction.\" Good: \"Become the most trusted onboarding experience in our category by Q4.\"</div></div></div>\n          <div class=\"step-block\"><div class=\"step-num\">2</div><div class=\"step-content\"><div class=\"step-title\">Write 2–4 Key Results - outcomes, not activities</div><div class=\"step-body\">Bad: \"Launch new onboarding flow.\" Good: \"Increase Day-30 retention from 61% to 78%.\" The launch is an activity. The retention improvement is a Key Result.</div></div></div>\n          <div class=\"step-block\"><div class=\"step-num\">3</div><div class=\"step-content\"><div class=\"step-title\">Apply the \"so what\" test to each Key Result</div><div class=\"step-body\">If we hit this number and nothing else changed, would the Objective be meaningfully advanced? If no - it's a proxy metric.</div></div></div>\n          <div class=\"step-block\"><div class=\"step-num\">4</div><div class=\"step-content\"><div class=\"step-title\">Set the baseline before setting the target</div><div class=\"step-body\">\"Increase NPS from 32 to 55\" is valid. \"Increase NPS to 55\" is not - no baseline means no way to assess ambition or fairness.</div></div></div>\n          <div class=\"step-block\"><div class=\"step-num\">5</div><div class=\"step-content\"><div class=\"step-title\">Run a weekly or bi-weekly check-in, not a quarterly one</div><div class=\"step-body\">OKRs without cadenced check-ins are just goal documents. 15 minutes. Three questions: status, confidence score, one blocker.</div></div></div>\n        </div>\n      </section>\n      <section id=\"mistakes\">\n        <div class=\"section-label\">Common Pitfalls</div>\n        <h2 class=\"section-heading\">The Most Common OKR Mistakes</h2>\n        <div class=\"guide-text\">\n          <ul>\n            <li><strong>Too many OKRs.</strong> More than 3 Objectives and 9 Key Results means you have priorities, not OKRs.</li>\n            <li><strong>Tying OKRs directly to bonuses.</strong> The moment OKRs are financially consequential, people start sandbagging.</li>\n            <li><strong>Set-and-forget culture.</strong> OKRs that aren't reviewed regularly become irrelevant within six weeks.</li>\n            <li><strong>Writing KRs for tasks you'd do anyway.</strong> \"Complete Q3 product roadmap\" is not a Key Result - it's your job.</li>\n          </ul>\n        </div>\n      </section>",
  "checklist": [
   "Company-level Objectives are set by leadership and communicated before team OKR-writing begins",
   "Each Objective is qualitative, inspiring, and achievable within the OKR period",
   "Each team has no more than 3 Objectives and 4 Key Results per Objective",
   "Every Key Result is an outcome metric, not an activity or deliverable",
   "Every Key Result has a clear baseline number and a stretch target",
   "Grading convention (0–1 scale, RAG, % completion) is agreed and communicated",
   "OKRs are not directly tied to bonus or compensation decisions",
   "Weekly or bi-weekly check-in cadence is scheduled for the full OKR period",
   "At least one Key Result per Objective would be uncomfortable to miss",
   "OKRs are visible across the team - not siloed in individual documents"
  ]
 },

// Returns 'ok', 'denied' (no valid Pro key) or 'error' (network / server problem).
async function loadProContent(slug) {
  var key = '';
  try { key = (localStorage.getItem('viorah_key') || '').trim(); } catch (e) {}
  try {
    var res = await fetch('https://pms-toolkit-ai.kumarvivek-srv.workers.dev/guide-content', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slug: slug, key: key })
    });
    if (res.status === 401) return 'denied';
    if (!res.ok) return 'error';
    var data = await res.json();
    if (!data || !data.content) return 'error';
    GUIDES[slug].content = data.content;
    GUIDES[slug].checklist = data.checklist || [];
    return 'ok';
  } catch (e) { return 'error'; }
}

  document.title = `${guide.title} - Virorah PMS`;

    return;
  }
  // Pro guide text is not shipped in this page. It is fetched from the Worker,
  // which only returns it for a valid Pro key (or a signed-in Pro account).
  if (guide.tier === 'Pro' && !guide.content) {
    app.innerHTML = loadingHTML(guide);
    loadProContent(slug).then(function (state) {
      if (state === 'ok') render();
      else if (state === 'denied') app.innerHTML = proGateHTML(guide);
      else app.innerHTML = loadErrorHTML(guide);
    });
    return;
  }
  // ── END PRO GATE ──

  const progress = loadProgress(slug);
  const checklist = guide.checklist || [];
  const completed = checklist.filter((_, i) => progress[i]).length;
  const pct = checklist.length ? Math.round(completed / checklist.length * 100) : 0;
  const tierClass = guide.tier === 'Free' ? 'badge-free' : 'badge-pro';

  app.innerHTML = `
    <div class="breadcrumb">
      <a href="/pages/learning-hub.html">Learning Hub</a>
      <span>›</span>
      <span>${guide.category}</span>
      <span>›</span>
      <span>${guide.title}</span>
    </div>
    <div class="guide-hero">
      <div class="guide-meta-row">
        <span class="guide-badge ${tierClass}">${guide.tier}</span>
        <span class="guide-badge badge-category">${guide.category}</span>
        <span class="badge-time">⏱ ${guide.readTime} read</span>
      </div>
      <h1 class="guide-title">${guide.title}</h1>
      <p class="guide-description">${guide.description}</p>
      ${checklist.length ? `<div class="progress-wrap"><div class="progress-bar" id="hero-progress-bar" style="width:${pct}%"></div></div><div class="progress-label">${completed}/${checklist.length} checklist items complete · ${pct}%</div>` : ''}
    </div>
    <div class="guide-layout">
      <div class="guide-body">
        ${guide.content.split('<section').map((section, idx) => {
          if (idx === 0) return '';
          return `<div class="content-section" style="animation-delay:${idx * 0.08}s"><section ${section}</div>`;
        }).join('')}
        <div class="content-section" style="animation-delay:.4s">
          <div class="section-label">Implementation Checklist</div>
          <h2 class="section-heading">${guide.toc[guide.toc.length - 1]}</h2>
          <p style="font-size:13px;color:#6b7280;margin-bottom:20px;">Tick off each step as you complete it - your progress is saved automatically.</p>
          <div class="checklist-wrap" id="checklist-wrap">
            ${checklist.map((item, i) => `<div class="checklist-item ${progress[i] ? 'checked' : ''}" data-index="${i}" onclick="toggleCheck(${i})"><div class="check-box"></div><div class="check-text">${item}</div></div>`).join('')}
          </div>
          <div style="margin-top:16px;padding:14px;background:#f0f4ff;border-radius:8px;text-align:center;font-size:13px;color:#667eea;font-weight:600;display:none;" id="completion-msg"></div>
        </div>
      </div>
      <div class="guide-sidebar">
        ${guide.calculatorLink ? `<div class="cta-card"><div class="cta-icon">📊</div><div class="cta-title">Try it on your data</div><div class="cta-sub">Run the ${guide.calculatorName} on your own organisation's employee data.</div><a href="${guide.calculatorLink}" class="cta-btn">Open Calculator →</a></div>` : ''}
        ${guide.toc ? `<div class="sidebar-card"><div class="sidebar-title">In This Guide</div>${guide.toc.map(item => `<div class="toc-item"><div class="toc-dot"></div>${item}</div>`).join('')}</div>` : ''}
        ${guide.related && guide.related.length ? `<div class="sidebar-card"><div class="sidebar-title">Related Guides</div>${guide.related.map(r => `<a class="related-item" href="/pages/guide.html?slug=${r.slug}"><span class="related-icon">${r.icon}</span>${r.title}</a>`).join('')}</div>` : ''}
        <div class="sidebar-card" style="text-align:center;">
          <div style="font-size:24px;margin-bottom:8px;">💡</div>
          <div style="font-size:12px;font-weight:700;color:#1a1a2e;margin-bottom:6px;">All guides are included in your plan</div>
          <div style="font-size:11px;color:#6b7280;line-height:1.6;">Free guides are available to all users. Pro guides require a Pro subscription.</div>
        </div>
      </div>
    </div>`;

  updateCompletionMsg(slug);
}

function toggleCheck(index) {
  const slug = getSlug();
  const progress = loadProgress(slug);
  progress[index] = !progress[index];
  saveProgress(slug, progress);
  const item = document.querySelector(`[data-index="${index}"]`);
  if (item) item.classList.toggle('checked', !!progress[index]);
  const checklist = GUIDES[slug].checklist || [];
  const completed = checklist.filter((_, i) => progress[i]).length;
  const pct = Math.round(completed / checklist.length * 100);
  const bar = document.getElementById('hero-progress-bar');
  if (bar) bar.style.width = pct + '%';
  const label = document.querySelector('.progress-label');
  if (label) label.textContent = `${completed}/${checklist.length} checklist items complete · ${pct}%`;
  updateCompletionMsg(slug);
}

function updateCompletionMsg(slug) {
  const guide = GUIDES[slug];
  if (!guide || !guide.checklist) return;
  const progress = loadProgress(slug);
  const completed = guide.checklist.filter((_, i) => progress[i]).length;
  const msg = document.getElementById('completion-msg');
  if (!msg) return;
  if (completed === guide.checklist.length) { msg.style.display = 'block'; msg.textContent = '🎉 All done! You\'re fully prepared.'; }
  else if (completed > 0) { msg.style.display = 'block'; msg.textContent = `${guide.checklist.length - completed} item${guide.checklist.length - completed > 1 ? 's' : ''} left to complete.`; }
  else { msg.style.display = 'none'; }
}

render();
</script>
