  'family-business-problem': {
    company:'Verma Textiles', industry:'Manufacturing', outcome:'success',
    accent:'#34d399',
    title:'The Rating That Everyone Saw Through',
    standfirst:'For six years, the founder\'s son received a Rating 5 - while missing his targets four of those years. Everyone in the building knew. Nobody said a word. Until one employee, in one calibration meeting, finally asked the question that stopped the room cold.',
    meta:['Manufacturing','Family business','6 years of silence'],
    scenes:[
      { type:'beat', kicker:'The open secret',
        head:'Everyone knew. That was the problem.',
        body:'At Verma Textiles, the founder\'s son held a senior role and, every single year, the top rating. The trouble was that his numbers didn\'t support it - he\'d <strong>missed his targets in four of the last six years</strong>. The whole organisation understood the unwritten rule: his rating wasn\'t about performance, it was about surname. People didn\'t resent him so much as they resented what his rating <em>signalled</em> - <strong>that the system was rigged, and that effort and merit were optional for the right people.</strong>' },

      { type:'bars', kicker:'The data nobody acted on', vizTitle:'Founder\'s son - rating vs. target achievement', vizSub:'Verma Textiles - 6-year view',
        bars:[
          {lbl:'Avg\nRating\ngiven', val:50, color:'#a78bfa'},
          {lbl:'Years\ntarget\nmet', val:17, color:'#ef4444'}
        ],
        caption:'A perfect rating record against a target-miss record of <strong>four years out of six</strong>. The gap between the two bars was visible to everyone - and addressed by no one.' },

      { type:'beat', kicker:'The hidden cost',
        head:'One unearned 5 devalues every earned one.',
        body:'The damage wasn\'t really to the son - it was to <strong>everyone else</strong>. When the highest rating in the company demonstrably had nothing to do with results, every other person\'s rating lost meaning too. Why push for a 5 through genuine excellence when the top rating is visibly available through birth? The unearned rating quietly told the most ambitious people at Verma that <strong>this was not a place where merit was the currency.</strong> The best of them started to drift.' },

      { type:'quote',
        quote:'"Nobody was angry that the boss\'s son had a job. We were angry that his 5 meant our 5s were worth nothing. He didn\'t cheapen himself. He cheapened all of us."',
        attr:' - Plant supervisor, Verma Textiles' },

      { type:'decision',
        tag:'Your turn',
        q:'The founder\'s underperforming son gets a 5 every year. You run HR. What do you do?',
        setup:'You\'ve just taken over People at Verma. The pattern is obvious and documented. The founder is proud, protective, and signs your paycheck. Confronting this could end your tenure. Looking away corrodes the whole company. What\'s your move?',
        choices:[
          { key:'A', text:'Leave it alone - it\'s a family business, the founder\'s prerogative, and not worth your job.',
            verdict:'the slow corrosion', verdictColor:'#f87171',
            what:'Self-preservation is understandable, but every cycle you let it stand, the rating system loses more credibility and your best non-family people lose more faith. You\'d be trading short-term safety for the slow hollowing-out of the entire performance culture - and your own integrity along with it.',
            actual:'For six years, this was effectively the organisation\'s posture - and it quietly eroded merit across the whole company.' },
          { key:'B', text:'Present the founder with the data privately - rating vs. results - and frame it around what the unearned 5 costs the rest of the company.',
            verdict:'the move that broke the cycle', verdictColor:'#34d399',
            what:'You don\'t win this by attacking the son or moralising. You win by showing the founder, privately and with data, that <strong>the unearned rating is damaging the very company he built</strong> - demotivating his best people and signalling that merit doesn\'t matter. Frame it as protecting his legacy, not policing his family. Make the cost concrete and the choice his.',
            actual:'A version of this is what finally shifted Verma - the founder, shown the cost to the wider business, agreed the rating had to reflect results like everyone else\'s.' },
          { key:'C', text:'Quietly tell other managers to rate their own people more generously to "balance it out."',
            verdict:'spreads the rot', verdictColor:'#f87171',
            what:'Fighting one inflated rating by inflating everyone\'s just gives you TechCorp\'s problem on purpose - universal inflation where no rating means anything. You\'d be curing favouritism with company-wide dishonesty. Two wrongs make a broken system.',
            actual:'Compensating with broader inflation would have destroyed the rating\'s meaning entirely - trading one problem for a worse one.' },
          { key:'D', text:'Raise it publicly in the calibration meeting to force the issue with witnesses.',
            verdict:'right issue, reckless method', verdictColor:'#fbbf24',
            what:'Ambushing the founder publicly may feel principled, but it corners a proud person into defending his son in front of an audience - the most likely way to get a hard "no" and a short exit for you. The issue is right; the venue is wrong. <strong>Private data first, public process second.</strong>',
            actual:'Interestingly, in the real arc it took one brave employee\'s question in a meeting to surface it - but the resolution came through the founder being shown the cost privately, not cornered publicly.' }
        ] },

      { type:'beat', kicker:'The turning point',
        head:'The question that stopped the room.',
        body:'It finally broke open when one employee, in a calibration session, asked the simple question everyone had swallowed for six years: <strong>"If any of us missed targets four years out of six, what rating would we get?"</strong> The silence said everything. Confronted - privately, with the data, and framed around the health of the company he\'d spent his life building - the founder made the hard call. His son would be rated on results, like everyone else. <strong>The rating dropped. And across the company, the meaning of a 5 quietly came back to life.</strong>' },

      { type:'lesson', tag:'What this teaches',
        items:[
          {strong:'An unearned top rating devalues every earned one.', rest:'Favouritism at the top tells everyone below that merit is optional - and your best people believe it.' },
          {strong:'The damage is to the system, not just the individual.', rest:'One rigged rating quietly corrodes the credibility of the entire performance process.' },
          {strong:'Influence the powerful with cost, not morality.', rest:'Frame it around what the unearned rating costs the business they care about - not around fairness lectures.' },
          {strong:'Private data beats public ambush.', rest:'Cornering a proud decision-maker in front of an audience invites a defensive "no." Bring the evidence privately first.' }
        ] },

      { type:'closing',
        head:'See what one rigged rating does to the whole curve.',
        sub:'Model rating integrity across a full org in the Bell Curve and Calibration tools - and see the corrosion Verma lived for six years.',
        primary:{label:'Open the Calibration Simulator', href:'/pages/scenarios.html'},
        secondary:{label:'Next case study →', href:'/pages/case-studies.html'} }
    ],
    textVersion:{
      lessonsTitle:'The four lessons',
      lessons:[
        'An unearned top rating devalues every earned one.',
        'The damage is to the system, not just the individual.',
        'Influence the powerful with cost, not morality.',
        'Private data beats public ambush.'
      ],
      sections:[
        { h:null, p:['At Verma Textiles, the founder\'s son held a senior role and, every year, the top rating - despite missing his targets four of the last six years. The whole organisation understood the unwritten rule: his rating wasn\'t about performance, it was about surname.'] },
        { h:'The hidden cost', p:['The damage wasn\'t really to the son - it was to everyone else. When the highest rating in the company demonstrably had nothing to do with results, every other rating lost meaning. The unearned rating quietly told the most ambitious people that this was not a place where merit was the currency. The best of them started to drift.'], quote:'"Nobody was angry that the boss\'s son had a job. We were angry that his 5 meant our 5s were worth nothing." - Plant supervisor' },
        { h:'The turning point', p:['It broke open when one employee asked, in a calibration session, the question everyone had swallowed for six years: "If any of us missed targets four years out of six, what rating would we get?" The silence said everything.','Confronted privately, with data, and framed around the health of the company he\'d built, the founder made the hard call. His son would be rated on results, like everyone else. The rating dropped - and across the company, the meaning of a 5 quietly came back to life.'] }

  'remote-first-reckoning': {
    company:'NovaBuild Technologies', industry:'SaaS', outcome:'success',
    accent:'#34d399',
    title:'Managing People You\'ve Never Met',
    standfirst:'NovaBuild ran 95 employees across 14 countries. When they finally analysed their ratings, they found APAC staff scored 0.7 points lower than everyone else - not because of their performance, but because of their time zone.',
    meta:['SaaS','95 people · 14 countries','Proximity bias'],
    scenes:[
      { type:'beat', kicker:'The setup',
        head:'A truly global team - rated by a local instinct.',
        body:'NovaBuild was proudly remote-first: 95 people spread across 14 countries and almost every time zone. The leadership team, however, sat mostly in one region. When the annual ratings came back, a quiet pattern emerged that nobody had designed: <strong>employees in APAC - the time zone furthest from leadership - were consistently rated lower</strong> than everyone else. Not a little. By about <strong>0.7 of a full rating point.</strong>' },

      { type:'bars', kicker:'The finding', vizTitle:'Average rating by region', vizSub:'NovaBuild - same roles, same levels',
        bars:[
          {lbl:'HQ\nregion', val:42, color:'#667eea'},
          {lbl:'Europe', val:40, color:'#a78bfa'},
          {lbl:'Americas', val:39, color:'#60a5fa'},
          {lbl:'APAC', val:30, color:'#ef4444'}
        ],
        caption:'APAC sat <strong>0.7 points below</strong> everyone else at identical roles and levels. The cause wasn\'t performance. It was <strong>proximity - the people leadership saw least, scored lowest.</strong>' },

      { type:'beat', kicker:'The mechanism',
        head:'Out of sight, out of mind, down a rating.',
        body:'The bias had a simple, human cause: <strong>proximity</strong>. APAC employees overlapped least with leadership\'s working hours. They were in fewer live conversations, fewer hallway-equivalent moments, fewer "saw it happen" experiences. So their contributions were less <em>visible</em> - and managers, unconsciously, rated visibility as performance. The work was just as good. It simply happened while the decision-makers were asleep. <strong>In a remote company, whoever managers can\'t see, they undervalue.</strong>' },

      { type:'quote',
        quote:'"My manager never saw me work. He saw my pull requests merge overnight while he slept and somehow read that as ‘less engaged.\' I wasn\'t less engaged. I was eight hours ahead."',
        attr:' - Senior Engineer, APAC, NovaBuild' },

      { type:'decision',
        tag:'Your turn',
        q:'Your remote team\'s farthest time zone is rated 0.7 lower. How do you fix it?',
        setup:'You\'re Head of People at NovaBuild. The gap is real, documented, and tied to proximity, not performance. You need a fix that works for a 14-country, always-distributed company. What do you do?',
        choices:[
          { key:'A', text:'Tell managers to "be aware of proximity bias" in a training session and trust them to correct it.',
            verdict:'awareness alone rarely sticks', verdictColor:'#fbbf24',
            what:'Bias training raises awareness for about a week, then the unconscious pattern quietly returns - because the <strong>underlying conditions</strong> haven\'t changed. APAC is still less visible, managers are still rating on what they see. You can\'t willpower your way out of a structural visibility gap.',
            actual:'NovaBuild knew awareness alone wouldn\'t hold - the gap was structural, so the fix had to be too.' },
          { key:'B', text:'Require evidence-based ratings drawn from written artifacts (shipped work, docs, async updates) - not from live visibility.',
            verdict:'the structural fix that worked', verdictColor:'#34d399',
            what:'If the bias comes from rating <strong>visibility</strong>, the fix is to rate <strong>evidence</strong> instead. NovaBuild required every rating to be grounded in artifacts - code shipped, docs written, async updates, measurable outcomes - things that exist regardless of time zone. Suddenly APAC\'s "invisible" overnight work was just as documented as anyone\'s. The proximity advantage evaporated because proximity stopped being the input.',
            actual:'This is what NovaBuild did - anchoring ratings in async, written evidence that exists independent of when leadership is awake. The gap closed.' },
          { key:'C', text:'Rotate leadership working hours so they overlap with APAC regularly.',
            verdict:'helps, but band-aids the cause', verdictColor:'#fbbf24',
            what:'More overlap with APAC is genuinely good for connection - but it doesn\'t fix the root problem that ratings depend on being <em>seen</em> at all. You\'d improve one region\'s visibility while leaving the underlying "I rate what I witness" instinct intact for the next distributed team. Treat the cause, not the symptom.',
            actual:'NovaBuild did improve overlap for connection - but the rating fix was anchoring judgment in evidence, not presence.' },
          { key:'D', text:'Apply a +0.7 correction factor to all APAC ratings to close the statistical gap.',
            verdict:'fakes fairness, fixes nothing', verdictColor:'#f87171',
            what:'A blanket correction factor papers over the gap without addressing why it exists - and it\'s unfair in both directions, over-rewarding weak APAC performers and under-recognising strong ones. You\'d replace one distortion with another and learn nothing about the real cause.',
            actual:'A mechanical correction would have hidden the symptom while leaving the proximity bias fully operational underneath.' }
        ] },

      { type:'beat', kicker:'What they did',
        head:'They rated the evidence, not the eyeballs.',
        body:'NovaBuild rebuilt its rating process around a single principle: <strong>a rating must be grounded in artifacts, not impressions.</strong> Shipped work, written docs, async updates, measurable outcomes - evidence that exists independent of when the decision-maker happens to be online. Live visibility stopped being a proxy for performance. Within one cycle, the APAC gap narrowed sharply, not because anyone\'s work changed, but because <strong>the work was finally being judged on what it was, not on whether leadership had watched it happen.</strong>' },

      { type:'lesson', tag:'What this teaches',
        items:[
          {strong:'In remote teams, visibility masquerades as performance.', rest:'Whoever managers see least, they unconsciously rate lowest - regardless of actual output.' },
          {strong:'Proximity bias is structural, so the fix must be structural.', rest:'Awareness training fades; anchoring ratings in evidence removes the bias at its source.' },
          {strong:'Rate artifacts, not impressions.', rest:'Written, async evidence exists regardless of time zone - it levels the playing field automatically.' },
          {strong:'Correction factors hide problems; they don\'t solve them.', rest:'Statistical patches mask the symptom while leaving the underlying bias fully intact.' }
        ] },

      { type:'closing',
        head:'Find the proximity bias in your own ratings.',
        sub:'Use DEI Analytics to break ratings down by region and team - and surface the time-zone gap NovaBuild almost missed.',
        primary:{label:'Open DEI Analytics', href:'/pages/scenarios.html'},
        secondary:{label:'Next case study →', href:'/pages/case-studies.html'} }
    ],
    textVersion:{
      lessonsTitle:'The four lessons',
      lessons:[
        'In remote teams, visibility masquerades as performance.',
        'Proximity bias is structural, so the fix must be structural.',
        'Rate artifacts, not impressions.',
        'Correction factors hide problems; they don\'t solve them.'
      ],
      sections:[
        { h:null, p:['NovaBuild was proudly remote-first: 95 people across 14 countries. The leadership team sat mostly in one region. When the annual ratings came back, a pattern emerged nobody had designed: employees in APAC - the time zone furthest from leadership - were consistently rated about 0.7 of a point lower than everyone else.'] },
        { h:'The mechanism', p:['The bias had a simple, human cause: proximity. APAC employees overlapped least with leadership\'s hours. They were in fewer live conversations, so their contributions were less visible - and managers unconsciously rated visibility as performance. The work was just as good. It simply happened while the decision-makers were asleep.'], quote:'"My manager never saw me work. He saw my pull requests merge overnight while he slept and read that as \'less engaged.\' I wasn\'t less engaged. I was eight hours ahead." - Senior Engineer, APAC' },
        { h:'What they did', p:['NovaBuild rebuilt its rating process around a single principle: a rating must be grounded in artifacts, not impressions. Shipped work, docs, async updates, measurable outcomes - evidence that exists independent of when the decision-maker is online.','Within one cycle, the APAC gap narrowed sharply - not because anyone\'s work changed, but because it was finally being judged on what it was, not on whether leadership had watched it happen.'] }
      ]
    }
  },

  'post-merger-crisis': {
    company:'Meridian + Apex', industry:'Professional Services', outcome:'cautionary',
    accent:'#ef4444',
    title:'Two Rating Scales, One Culture War',
    standfirst:'One company rated on a 5-point scale. The other used 3 points. The merger made them one company overnight. The first combined performance review cycle made them enemies - because nobody had asked what a "good" rating even meant anymore.',
    meta:['Professional Services','Cautionary tale','Post-merger collision'],
    scenes:[
      { type:'beat', kicker:'The merger',
        head:'Two companies. Two scales. One review cycle.',
        body:'When Meridian and Apex merged, leadership integrated the obvious things - payroll, email, branding, office space. What nobody flagged as urgent was the <strong>performance rating scale</strong>. Meridian had always used a generous 5-point scale where most strong performers landed at 4. Apex used a stricter 3-point scale where a 3 was reserved for the genuinely exceptional. On paper, a trivial difference. In practice, <strong>a buried landmine set to go off at the first combined review cycle.</strong>' },

      { type:'beat', kicker:'The collision',
        head:'The same number meant opposite things.',
        body:'When the merged company ran its first unified review, the scales were crudely mapped together - and chaos followed. Apex employees, used to a 3 meaning "outstanding," suddenly saw their 3s sitting alongside Meridian 3s that meant "merely adequate." Meridian people who\'d always gotten 4s now looked inflated next to Apex\'s hard-earned 3s. <strong>Everyone felt cheated, and everyone was technically right</strong> - because the company had merged two languages without agreeing on a dictionary. The "ex-Apex vs ex-Meridian" resentment hardened into open factionalism.' },

      { type:'quote',
        quote:'"A 3 was the proudest rating of my career at Apex. After the merger, a 3 made me look average. Nobody changed my work. They just changed what the number meant - and didn\'t tell anyone."',
        attr:' - Senior Consultant, formerly Apex' },

      { type:'decision',
        tag:'Your turn',
        q:'Two merged companies, two incompatible rating scales, one cycle away. What do you do?',
        setup:'You\'re leading People integration. The first combined review cycle is approaching fast. Both legacy scales are still in people\'s heads and emotions. What\'s your move before the cycle hits?',
        choices:[
          { key:'A', text:'Map the old scales together with a conversion formula and run the cycle on schedule.',
            verdict:'the move that started the war', verdictColor:'#f87171',
            what:'A mechanical conversion ignores that the two scales encode totally different <strong>meanings and cultures</strong>, not just different numbers. Mapping 3→4 or 5→3 on a spreadsheet doesn\'t translate "what good looks like" - it just collides two value systems and lets each side feel robbed. This is exactly how Meridian+Apex turned a merger into factions.',
            actual:'This is essentially what happened - a crude mapping run under time pressure, which detonated the cultural integration.' },
          { key:'B', text:'Pause, co-design ONE new shared scale with clear definitions, and explicitly re-onboard everyone to what each level means before any cycle runs.',
            verdict:'the integration that holds', verdictColor:'#34d399',
            what:'The real problem isn\'t the numbers - it\'s that the two halves of the company don\'t share a <strong>definition of good</strong>. You have to build one new scale, define each level with concrete examples, and re-onboard <em>both</em> legacy populations to it as equals. It\'s slower, and it may mean delaying the first cycle - but it\'s the only path that makes the merged company one organisation instead of two tribes sharing a logo.',
            actual:'The lesson in hindsight: a merger of rating systems is a merger of meanings. One co-designed scale, taught to everyone, is the only thing that prevents the culture war.' },
          { key:'C', text:'Let each legacy group keep its own scale for the first year to ease the transition.',
            verdict:'delays and entrenches the divide', verdictColor:'#fbbf24',
            what:'Running two scales in one company doesn\'t ease anything - it <strong>institutionalises the us-vs-them split</strong> and makes cross-company comparison (for promotions, pay, calibration) impossible. You\'d be postponing the hard conversation while making the eventual reconciliation even messier.',
            actual:'Parallel scales would have hard-wired the factional divide into the company\'s structure for a full year.' },
          { key:'D', text:'Adopt whichever scale the larger legacy company used - majority wins.',
            verdict:'wins on optics, loses on trust', verdictColor:'#fbbf24',
            what:'Imposing the bigger company\'s scale signals to the smaller side that the "merger" was really an <strong>acquisition where their culture loses</strong>. Even if the scale itself is fine, the message - your way of measuring worth doesn\'t count - poisons the integration. Co-design beats conquest.',
            actual:'Defaulting to the larger company\'s scale would have read as cultural takeover, deepening the resentment rather than resolving it.' }
        ] },

      { type:'beat', kicker:'The aftermath',
        head:'A landmine that was entirely avoidable.',
        body:'The factionalism that followed Meridian+Apex\'s first review cycle took far longer and cost far more to heal than simply pausing to build a shared scale ever would have. Trust between the two legacy halves fractured along rating lines. Top performers on the "losing" side of the conversion left, convinced the merger had quietly downgraded them. The bitter irony: <strong>the integration team had carefully merged every system that was easy to see - and missed the one that lived in people\'s sense of their own worth.</strong>' },

      { type:'lesson', tag:'What this teaches',
        items:[
          {strong:'A rating scale is a language, not a number.', rest:'Merging scales means merging meanings - a 3 on one scale and a 3 on another can be opposites.' },
          {strong:'You can\'t convert your way out of a culture clash.', rest:'A conversion formula maps numbers; it doesn\'t reconcile two different definitions of "good."' },
          {strong:'Co-design beats conquest.', rest:'Imposing one side\'s scale reads as an acquisition of worth - build one new shared scale together instead.' },
          {strong:'The dangerous integration gaps are the invisible ones.', rest:'Payroll and email are easy to merge. The systems tied to people\'s sense of their own value are where mergers actually fracture.' }
        ] },

      { type:'closing',
        head:'Design one scale everyone can trust.',
        sub:'Use the Calibration and Rating tools to build clear, shared definitions of each level - the dictionary Meridian+Apex never wrote.',
        primary:{label:'Open the Calibration Simulator', href:'/pages/scenarios.html'},
        secondary:{label:'Next case study →', href:'/pages/case-studies.html'} }
    ],
    textVersion:{
      lessonsTitle:'The four lessons',
      lessons:[
        'A rating scale is a language, not a number - merging scales means merging meanings.',
        'You can\'t convert your way out of a culture clash.',
        'Co-design beats conquest - build one new shared scale together.',
        'The dangerous integration gaps are the invisible ones.'
      ],
      sections:[
        { h:null, p:['When Meridian and Apex merged, leadership integrated the obvious things - payroll, email, branding. What nobody flagged as urgent was the performance rating scale. Meridian used a generous 5-point scale where strong performers landed at 4. Apex used a stricter 3-point scale where a 3 was reserved for the exceptional. On paper, trivial. In practice, a buried landmine.'] },
        { h:'The collision', p:['When the merged company ran its first unified review, the scales were crudely mapped together and chaos followed. Apex employees used to a 3 meaning "outstanding" saw their 3s sitting next to Meridian 3s meaning "adequate." Everyone felt cheated, and everyone was technically right - because the company had merged two languages without agreeing on a dictionary.'], quote:'"A 3 was the proudest rating of my career at Apex. After the merger, it made me look average. Nobody changed my work. They just changed what the number meant - and didn\'t tell anyone." - Senior Consultant, formerly Apex' },
        { h:'The aftermath', p:['The factionalism took far longer and cost far more to heal than pausing to build a shared scale would have. Top performers on the "losing" side of the conversion left, convinced the merger had downgraded them.','The bitter irony: the integration team had carefully merged every system that was easy to see - and missed the one that lived in people\'s sense of their own worth.'] }
      ]
    }

  'ipo-pressure-cooker': {
    company:'Luminary Labs', industry:'SaaS / Pre-IPO', outcome:'success',
    accent:'#34d399',
    title:'Performance Management in 90 Days',
    standfirst:'The S-1 filing was 90 days out. The investment bank asked Luminary Labs to describe its performance and talent framework. There wasn\'t one. What followed - under brutal time pressure - became the most instructive talent conversation the leadership team had ever had.',
    meta:['SaaS / Pre-IPO','90 days to S-1','High-stakes sprint'],
    scenes:[
      { type:'beat', kicker:'The pressure',
        head:'The one question the bankers always ask.',
        body:'Luminary Labs was sprinting toward an IPO. The product was strong, revenue was real, the deck was polished. Then, during diligence, the investment bank asked the question that exposes every fast-grown company: <strong>"Walk us through your performance management and key-talent retention framework."</strong> Luminary didn\'t have one. With 90 days to the S-1, this wasn\'t a nice-to-have - public-market investors price <strong>talent risk</strong>, and "we have no system" is a discount on your valuation.' },

      { type:'bigstat', num:'90', label:'Days to the S-1 filing. <strong>Zero</strong> formal performance framework. The forcing function that turned a gap into the leadership team\'s sharpest talent conversation.' },

      { type:'beat', kicker:'The realisation',
        head:'The deadline forced a clarity they\'d avoided.',
        body:'Under the gun, Luminary\'s leadership couldn\'t do what they\'d always done - defer the messy people questions. The IPO clock forced them to answer things they\'d dodged for years: <strong>Who are our genuinely critical people? What happens to the company if any of them leaves next month? How do we even know who\'s performing?</strong> The pressure didn\'t create the talent risk - it had been there all along. It just made it <strong>impossible to keep ignoring.</strong>' },

      { type:'quote',
        quote:'"The bankers didn\'t want a perfect HR system in 90 days - they\'re not naive. They wanted proof we knew who our critical people were and had a credible plan to keep them. That question taught us more about our own company than two years of growth had."',
        attr:' - CEO, Luminary Labs' },

      { type:'decision',
        tag:'Your turn',
        q:'90 days to S-1, no framework. What do you prioritise?',
        setup:'You\'re brought in to fix this fast. The temptation is to build a comprehensive enterprise system to impress the bankers. But you have 90 days and a company that\'s never had process. What do you focus on first?',
        choices:[
          { key:'A', text:'Build a full, sophisticated enterprise PMS to show the bank a mature, complete system.',
            verdict:'impressive on paper, hollow underneath', verdictColor:'#fbbf24',
            what:'A elaborate framework slapped together in 90 days is theatre - and sophisticated investors see through theatre. Worse, you\'d be presenting a system nobody actually uses, which is a <strong>credibility risk</strong> if diligence digs even one layer down. Depth you can\'t demonstrate is worse than honest simplicity.',
            actual:'Luminary resisted building an elaborate facade - the bankers wanted credibility, not complexity.' },
          { key:'B', text:'Focus first on identifying critical talent and a credible retention plan, then a simple, real performance framework around it.',
            verdict:'exactly what the moment needs', verdictColor:'#34d399',
            what:'The bank\'s actual concern is <strong>talent risk</strong>: if your key people walk after the IPO, the investment thesis breaks. So you lead with what matters most - a clear-eyed map of your critical people and a real plan to retain them - then build a simple, genuine performance framework around it. It\'s honest, it\'s achievable in 90 days, and it answers the question they\'re actually asking.',
            actual:'This is what Luminary did - critical-talent identification and retention first, wrapped in a lightweight but real performance framework. The diligence conversation became a strength, not a liability.' },
          { key:'C', text:'Buy an off-the-shelf HR platform and point to it as evidence of a system.',
            verdict:'a tool is not a framework', verdictColor:'#fbbf24',
            what:'Purchasing software answers "do you have a tool" but not "do you understand and manage your talent" - which is the real question. A platform with no thinking behind it is an empty box with a logo. The bankers want to see <strong>judgment</strong>, not a procurement receipt.',
            actual:'Luminary knew a tool wouldn\'t substitute for actually understanding their talent landscape.' },
          { key:'D', text:'Delay the IPO timeline to build the framework properly over six months.',
            verdict:'over-corrects, misses the point', verdictColor:'#fbbf24',
            what:'Slipping an IPO to build a perfect HR system is the tail wagging the dog - and signals you can\'t execute under pressure, which itself spooks investors. The bank never asked for perfection in 90 days; they asked for evidence of <strong>credible understanding and a plan</strong>. That\'s achievable on schedule.',
            actual:'Luminary hit the timeline - the point was a credible, honest framework, not a delayed perfect one.' }
        ] },

      { type:'beat', kicker:'What they built',
        head:'Credible, honest, and done in time.',
        body:'Luminary built exactly what the moment required: a clear map of their <strong>critical talent</strong>, a concrete retention plan for the people the company couldn\'t afford to lose, and a <strong>simple, genuinely-used performance framework</strong> around it - real role expectations, real check-ins, real rating definitions. No enterprise bloat, no theatre. When the bankers asked their question, leadership answered with clarity and evidence. The framework didn\'t just satisfy diligence - <strong>it made Luminary a better-run company on the other side of the IPO.</strong>' },

      { type:'lesson', tag:'What this teaches',
        items:[
          {strong:'A deadline is a clarity-forcing function.', rest:'The IPO clock made Luminary answer talent questions it had dodged for years - pressure surfaced what comfort had hidden.' },
          {strong:'Investors price talent risk, not HR sophistication.', rest:'The real question is "who are your critical people and how do you keep them" - not "how elaborate is your system."' },
          {strong:'Credibility beats complexity under scrutiny.', rest:'A simple framework you actually use beats an impressive one you can\'t demonstrate. Sophisticated investors see through theatre.' },
          {strong:'A tool is not a framework.', rest:'Buying software answers "do you have a system" but not "do you understand your talent" - and judgment is what\'s being assessed.' }
        ] },

      { type:'closing',
        head:'Map your critical talent before someone asks.',
        sub:'Use the Succession and Manager Report Card tools to identify flight risk and key-person dependency - the questions Luminary answered just in time.',
        primary:{label:'Open the Succession tool', href:'/pages/scenarios.html'},

    '<p class="cse-hero-standfirst">'+esc(c.standfirst)+'</p>'+
    '<div class="cse-hero-meta">'+c.meta.map(function(m){ return '<div class="cse-hero-metaitem">◦ '+esc(m)+'</div>'; }).join('')+'</div>'+
    '<div class="cse-scroll-cue">↓ scroll to begin</div>'+
  '</div></div>';

  // SCENES
  c.scenes.forEach(function(sc, idx){
    html+='<div class="cse-scene" data-scene><div class="cse-scene-inner">'+renderScene(sc, idx)+'</div></div>';
  });

  document.getElementById('cse-cinema').innerHTML=html;
}

function renderScene(sc, idx){
  if(sc.type==='beat'){
    return (sc.kicker?'<div class="cse-kicker">'+esc(sc.kicker)+'</div>':'')+
      '<h2 class="cse-beat-head">'+esc(sc.head)+'</h2>'+
      '<div class="cse-beat-body">'+sc.body+'</div>';
  }
  if(sc.type==='quote'){
    return '<blockquote class="cse-pullquote">'+esc(sc.quote)+
      (sc.attr?'<span class="cse-pullquote-attr">'+esc(sc.attr)+'</span>':'')+'</blockquote>';
  }
  if(sc.type==='bigstat'){
    return '<div class="cse-bigstat"><div class="cse-bigstat-num" data-bigstat>'+esc(sc.num)+'</div>'+
      '<div class="cse-bigstat-label">'+sc.label+'</div></div>';
  }
  if(sc.type==='bars'){
    var maxv=Math.max.apply(null, sc.bars.map(function(b){return b.val;}));
    var bars=sc.bars.map(function(b){
      var h=Math.round((b.val/maxv)*100);
      return '<div class="cse-bar-col">'+
        '<div class="cse-bar-val" style="color:'+b.color+'">'+b.val+'%</div>'+
        '<div class="cse-bar" data-barh="'+h+'" style="background:linear-gradient(180deg,'+b.color+','+b.color+'aa);"></div>'+
        '<div class="cse-bar-lbl">'+esc(b.lbl).replace(/\n/g,'<br>')+'</div>'+
      '</div>';
    }).join('');
    return (sc.kicker?'<div class="cse-kicker">'+esc(sc.kicker)+'</div>':'')+
      '<div class="cse-viz-wrap">'+
        '<div class="cse-viz-title">'+esc(sc.vizTitle)+'</div>'+
        '<div class="cse-viz-sub">'+esc(sc.vizSub)+'</div>'+
        '<div class="cse-bars" data-bars>'+bars+'</div>'+
        '<div class="cse-viz-caption">'+sc.caption+'</div>'+
      '</div>';
  }
  if(sc.type==='people'){
    var dots='';
    for(var i=0;i<sc.total;i++){
      var cls='cse-person';
      if(i<sc.stars) cls+=' star';
      dots+='<div class="'+cls+'" data-person="'+i+'"></div>';
    }
    return (sc.kicker?'<div class="cse-kicker">'+esc(sc.kicker)+'</div>':'')+
      '<div class="cse-viz-wrap">'+
        '<div class="cse-viz-title">'+esc(sc.vizTitle)+'</div>'+
        '<div class="cse-viz-sub" style="margin-bottom:18px;"><span style="color:#34d399;">●</span> top performers &nbsp; <span style="color:#ef4444;">●</span> resigned</div>'+
        '<div class="cse-people-grid" data-people="'+sc.stars+'">'+dots+'</div>'+
        '<div class="cse-viz-caption">'+sc.caption+'</div>'+
      '</div>';
  }
  if(sc.type==='decision'){
    var choices=sc.choices.map(function(ch,ci){
      return '<button class="cse-choice" id="cse-ch-'+ci+'" onclick="cseChoose('+ci+')">'+
        '<div class="cse-choice-key">'+esc(ch.key)+'</div>'+
        '<div>'+esc(ch.text)+'</div>'+
      '</button>';
    }).join('');
    return '<div class="cse-decision">'+
      '<div class="cse-decision-tag">⚡ '+esc(sc.tag)+'</div>'+
      '<div class="cse-decision-q">'+esc(sc.q)+'</div>'+
      '<div class="cse-decision-setup">'+esc(sc.setup)+'</div>'+
      '<div class="cse-choices" id="cse-choices">'+choices+'</div>'+
      '<div class="cse-reveal" id="cse-reveal"></div>'+
    '</div>';
  }
  if(sc.type==='lesson'){
    var items=sc.items.map(function(it){
      return '<div class="cse-lesson-item"><div class="cse-lesson-check">✓</div><div><strong>'+esc(it.strong)+'</strong> '+it.rest+'</div></div>';
    }).join('');
    return '<div class="cse-lesson"><div class="cse-lesson-tag">🎓 '+esc(sc.tag)+'</div><div class="cse-lesson-list">'+items+'</div></div>';
  }
  if(sc.type==='closing'){
    return '<div class="cse-closing">'+
      '<h2 class="cse-closing-head">'+esc(sc.head)+'</h2>'+
      '<p class="cse-closing-sub">'+esc(sc.sub)+'</p>'+
      '<div class="cse-closing-btns">'+
        '<a href="'+esc(sc.primary.href)+'" class="cse-btn-p">'+esc(sc.primary.label)+'</a>'+
        '<a href="'+esc(sc.secondary.href)+'" class="cse-btn-g">'+esc(sc.secondary.label)+'</a>'+
      '</div>'+
    '</div>';
  }
  return '';
}

/* DECISION interaction */
var DECISION_SCENE=null;
CASE.scenes.forEach(function(sc){ if(sc.type==='decision') DECISION_SCENE=sc; });

window.cseChoose=function(ci){
  if(!DECISION_SCENE) return;
  var picked=DECISION_SCENE.choices[ci];
  // lock all
  DECISION_SCENE.choices.forEach(function(ch,j){
    var btn=document.getElementById('cse-ch-'+j);
    if(!btn) return;
    btn.disabled=true;
    if(j===ci) btn.classList.add('picked'); else btn.classList.add('faded');
  });
  var rev=document.getElementById('cse-reveal');
  rev.innerHTML=
    '<div class="cse-reveal-verdict" style="color:'+picked.verdictColor+'">'+
      (picked.verdict==='the strongest first move'?'✓ ':(picked.verdictColor==='#34d399'?'✓ ':'→ '))+esc(picked.verdict)+'</div>'+
    '<div class="cse-reveal-what">'+picked.what+'</div>'+
    '<div class="cse-reveal-actual"><b>What actually happened:</b> '+picked.actual+'</div>'+
    '<button class="cse-continue" onclick="cseScrollNext()">Continue the story →</button>';
  rev.classList.add('show');
};

window.cseScrollNext=function(){
  var scenes=document.querySelectorAll('#cse-cinema .cse-scene');
  // find the decision scene, scroll to the one after
  for(var i=0;i<scenes.length;i++){
    if(scenes[i].querySelector('.cse-decision')){
      if(scenes[i+1]) scenes[i+1].scrollIntoView({behavior:'smooth',block:'center'});
      break;
    }
  }
};

/* ════════════════════════════════════════════
   SCROLL OBSERVER - reveal scenes + trigger viz
   ════════════════════════════════════════════ */
function initScrollObserver(){
  var scenes=document.querySelectorAll('#cse-cinema .cse-scene');
  if(!('IntersectionObserver' in window)){
    scenes.forEach(function(s){ s.classList.add('in'); triggerViz(s); });
    return;
  }
  var obs=new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){
        e.target.classList.add('in');
        triggerViz(e.target);
      }
    });
  }, { threshold:0.35 });
  scenes.forEach(function(s){ obs.observe(s); });
}

function triggerViz(scene){
  if(scene.dataset.vizDone) return;
  // bars
  var bars=scene.querySelector('[data-bars]');
  if(bars){
    scene.dataset.vizDone='1';
    bars.querySelectorAll('.cse-bar').forEach(function(b,i){
      setTimeout(function(){
        b.style.height=b.getAttribute('data-barh')+'%';
        var val=b.parentElement.querySelector('.cse-bar-val');
        if(val) setTimeout(function(){ val.style.opacity='1'; }, 500);
      }, i*120);
    });
  }
  // people exodus
  var people=scene.querySelector('[data-people]');
  if(people){
    scene.dataset.vizDone='1';
    var starCount=parseInt(people.getAttribute('data-people'));
    setTimeout(function(){
      var dots=people.querySelectorAll('.cse-person');
      // the stars (first N) turn red one by one = the resignations
      for(var i=0;i<starCount;i++){
        (function(idx){ setTimeout(function(){
          if(dots[idx]) dots[idx].classList.add('leaving');
        }, 600+idx*450); })(i);
      }
    }, 400);
  }
  // big stat count-up
  var big=scene.querySelector('[data-bigstat]');
  if(big && !big.dataset.done){
    big.dataset.done='1';
    var raw=big.textContent.trim();
    var num=parseInt(raw.replace(/[^0-9]/g,''));
    var suffix=raw.replace(/[0-9]/g,'');
    if(!isNaN(num)){
      var start=0, step=num/(900/16);
      var iv=setInterval(function(){ start+=step; if(start>=num){ big.textContent=num+suffix; clearInterval(iv); } else big.textContent=Math.floor(start)+suffix; },16);
    }
  }
}

/* ════════════════════════════════════════════
   PROGRESS RAIL
   ════════════════════════════════════════════ */
function initRail(){
  window.addEventListener('scroll', function(){
    var h=document.documentElement.scrollHeight - window.innerHeight;
    var pct=h>0 ? (window.scrollY/h)*100 : 0;
    var rail=document.getElementById('cse-rail');
    if(rail) rail.style.width=Math.min(100,pct)+'%';
  }, { passive:true });
}

/* ════════════════════════════════════════════
   TEXT MODE
   ════════════════════════════════════════════ */
function buildText(){
  var c=CASE, t=c.textVersion;
  var html='<div class="cse-text-kicker">'+esc(c.company)+' · '+esc(c.industry)+'</div>'+
    '<h1>'+esc(c.title)+'</h1>'+
    '<div class="cse-text-stand">'+esc(c.standfirst)+'</div>';
  t.sections.forEach(function(sec){
    if(sec.h) html+='<h2>'+esc(sec.h)+'</h2>';
    sec.p.forEach(function(para){ html+='<p>'+esc(para)+'</p>'; });
    if(sec.quote) html+='<blockquote class="cse-text-quote">'+esc(sec.quote)+'</blockquote>';
  });
  html+='<div class="cse-text-lessons"><h2 style="margin-top:0;">'+esc(t.lessonsTitle)+'</h2>';
  t.lessons.forEach(function(l,i){ html+='<p style="margin-bottom:10px;"><strong>'+(i+1)+'.</strong> '+esc(l)+'</p>'; });
  html+='</div>';
  document.getElementById('cse-text').innerHTML=html;
}

window.cseSetMode=function(mode){
  var cinema=document.getElementById('cse-cinema');
  var text=document.getElementById('cse-text');
  var rail=document.getElementById('cse-rail');
  document.getElementById('cse-mode-cinema').classList.toggle('active', mode==='cinema');
  document.getElementById('cse-mode-text').classList.toggle('active', mode==='text');
  if(mode==='cinema'){ cinema.style.display='block'; text.style.display='none'; if(rail) rail.style.display='block'; }
  else { cinema.style.display='none'; text.style.display='block'; if(rail) rail.style.display='none'; window.scrollTo(0,0); }
};

        '<h2 style="font-family:\'Space Grotesk\',sans-serif;font-size:22px;font-weight:800;color:#f0eeff;margin-bottom:10px;">'+esc(caseTitle)+'</h2>'+

        '<a href="/pages/pricing.html" style="display:block;padding:13px 24px;border-radius:11px;font-size:14px;font-weight:700;background:linear-gradient(135deg,#667eea,#764ba2);color:white;text-decoration:none;margin-bottom:10px;">🚀 Upgrade to Pro</a>'+
        '<div style="display:flex;gap:8px;margin-bottom:6px;">'+
          '<input id="cse-gate-key" type="text" placeholder="Already have a key? Enter it here" style="flex:1;padding:10px 13px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid rgba(102,126,234,.3);color:#f0eeff;font-size:12px;font-family:monospace;outline:none;">'+
          '<button id="cse-gate-btn" style="padding:10px 16px;border-radius:8px;background:linear-gradient(135deg,#667eea,#764ba2);border:none;color:white;font-size:12px;font-weight:700;cursor:pointer;">Unlock</button>'+
        '</div>'+

        '<div style="margin-top:14px;"><a href="/pages/case-studies.html" style="font-size:11px;color:rgba(165,180,252,.4);text-decoration:none;">← Back to all case studies</a></div>'+
      '</div>'+
    '</div>';

    err.style.display = 'none';

      method: 'POST',
      headers: {'Content-Type':'application/json','X-Action':'validate-key'},

    }).then(function(r){ return r.json(); }).then(function(result){

        err.style.display = 'block';
      }
    }).catch(function(){

      err.style.display = 'block';

  document.getElementById('cse-gate-key').addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('cse-gate-btn').click(); });
}
