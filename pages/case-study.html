/* ════════════════════════════════════════════
   THE CASE LIBRARY
   Each case is pure data. The engine renders it.
   Scene types: hero | beat | quote | bigstat | bars | people | decision | lesson | closing
   ════════════════════════════════════════════ */
var CASES = {

  'techcorp-rating-inflation': {
    company:'TechCorp Solutions', industry:'B2B SaaS', outcome:'success',
    accent:'#667eea',
    title:'The Year Everyone Was Exceptional',
    standfirst:'When 78% of a workforce is rated "Exceeds Expectations," the rating has stopped meaning anything. The four people who noticed first were the four best engineers - and they all resigned within ninety days of each other.',
    meta:['B2B SaaS','420 employees','18-month arc'],
    scenes:[
      { type:'beat', kicker:'How it began',
        head:'It looked like a great year on paper.',
        body:'TechCorp had just closed its best revenue year ever. Morale felt high. And when the annual performance ratings came in, the distribution seemed to confirm it: <strong>almost four out of five employees had "exceeded expectations."</strong> Leadership saw a high-performing organisation. What they were actually looking at was a measurement system that had quietly stopped working.' },

      { type:'bars', kicker:'The data', vizTitle:'TechCorp rating distribution', vizSub:'Annual review - 420 employees',
        bars:[
          {lbl:'Needs\nImprovement', val:2, color:'#ef4444'},
          {lbl:'Meets\nExpectations', val:20, color:'#f59e0b'},
          {lbl:'Exceeds\nExpectations', val:62, color:'#667eea'},
          {lbl:'Outstanding', val:16, color:'#a78bfa'}
        ],
        caption:'A healthy distribution clusters around "Meets." TechCorp\'s clustered around <strong>"Exceeds" - 78% above the bar.</strong> When almost everyone is exceptional, the word means nothing.' },

      { type:'beat', kicker:'The hidden cost',
        head:'Inflation devalues the currency.',
        body:'A rating is a currency. Its value comes from scarcity. When a "5" is handed out freely, it stops signalling anything - to managers, to compensation, and most dangerously, <strong>to the people who genuinely earned it.</strong> The strongest performers looked around, saw colleagues who coasted holding the same rating they did, and drew the obvious conclusion: <strong>excellence here is invisible.</strong>' },

      { type:'quote',
        quote:'"I realised my 5 was worth exactly the same as the 5 of someone who shipped nothing all year. So what was the point of the late nights?"',
        attr:' - Senior Engineer, in her exit interview' },

      { type:'people', kicker:'The exodus', vizTitle:'What happened over the next 90 days',
        total:60, stars:4, leaving:4,
        caption:'Four of TechCorp\'s strongest engineers resigned within a single quarter. None cited pay. All four, independently, described <strong>a rating system that had stopped telling the truth.</strong>' },

      { type:'decision',
        tag:'Your turn',
        q:'You\'re the new Head of People. What do you fix first?',
        setup:'You\'ve inherited the inflated system. The board wants the attrition stopped. You have four obvious levers. Most leaders reach for the wrong one first. What\'s your opening move?',
        choices:[
          { key:'A', text:'Impose a forced ranking / bell curve - cap the top ratings so the numbers normalise immediately.',
            verdict:'risky', verdictColor:'#f87171',
            what:'This fixes the <strong>symptom</strong> overnight but detonates trust. Forced distributions pit colleagues against each other and punish genuinely strong teams who happen to sit together. You\'d trade an inflation problem for a morale collapse - and likely a discrimination claim.',
            actual:'This is exactly what FinanceY Capital did in a different case - and lost its three best portfolio managers inside 18 months.' },
          { key:'B', text:'Retrain managers on what each rating actually means, with calibrated examples and evidence requirements.',
            verdict:'the strongest first move', verdictColor:'#34d399',
            what:'Inflation isn\'t a numbers problem - it\'s a <strong>definition problem</strong>. Managers were rating generously because nobody had ever defined the bar with real evidence. Recalibrating the meaning, with worked examples and a requirement to cite evidence, fixes the <strong>source</strong>. The distribution corrects itself because the judgments behind it are finally sound.',
            actual:'This is what TechCorp\'s new Head of People actually did first - definitions and manager calibration before touching a single number.' },
          { key:'C', text:'Tie ratings directly to compensation tiers to force managers to take them seriously.',
            verdict:'risky', verdictColor:'#f87171',
            what:'Linking inflated ratings straight to money <strong>before</strong> fixing their meaning just makes the inflation expensive. Managers under pressure will inflate <em>more</em> to protect their people\'s pay. You\'d harden the exact behaviour you\'re trying to undo.',
            actual:'TechCorp considered this and explicitly sequenced it for later - after definitions were fixed, not before.' },
          { key:'D', text:'Run an engagement survey to understand why the top performers are leaving.',
            verdict:'too slow', verdictColor:'#fbbf24',
            what:'Not wrong - but not first. You already know <strong>why</strong> they\'re leaving; the exit interviews told you. Spending a quarter surveying while more stars walk out the door treats diagnosis as a substitute for action. Listen, yes - but the source is already clear.',
            actual:'TechCorp did survey - but in parallel, not instead of fixing the calibration.' }
        ] },

      { type:'beat', kicker:'What they did',
        head:'They fixed the meaning before the math.',
        body:'TechCorp\'s new Head of People resisted the urge to slam a bell curve on the org. Instead, over one cycle, they: rewrote each rating definition with <strong>concrete, evidenced examples</strong>; ran live calibration sessions where managers had to defend ratings with proof; and only <strong>then</strong> let the distribution find its honest shape. No quota was ever imposed. The curve normalised on its own - because the judgments underneath it had become real.' },

      { type:'bigstat', num:'31%', label:'The share rated "Exceeds" the following year - down from 62%. Not because a quota forced it, but because <strong>the rating finally meant something again.</strong>' },

      { type:'lesson', tag:'What this teaches',
        items:[
          {strong:'Rating inflation is a definition problem, not a numbers problem.', rest:'Fix what each level <em>means</em> with evidence before you ever touch the distribution.' },
          {strong:'A forced curve treats the symptom and detonates trust.', rest:'Normalisation should emerge from honest judgment, not be imposed by quota.' },
          {strong:'Your best people are the first to notice a broken system.', rest:'When excellence becomes invisible, the excellent leave first - and quietly.' },
          {strong:'Sequence matters.', rest:'Definitions → calibration → then compensation links. Reverse the order and you harden the problem.' }
        ] },

      { type:'closing',
        head:'See it happen on real data.',
        sub:'Run TechCorp\'s exact rating distribution through the Bell Curve and Calibration Simulator - and watch inflation correct itself the way it did here.',
        primary:{label:'Open the Calibration Simulator', href:'/pages/scenarios.html'},
        secondary:{label:'Next case study →', href:'/pages/case-studies.html'} }
    ],

    /* full prose version for "Read as text" */
    textVersion:{
      lessonsTitle:'The four lessons',
      lessons:[
        'Rating inflation is a definition problem, not a numbers problem.',
        'A forced curve treats the symptom and detonates trust.',
        'Your best people are the first to notice a broken system.',
        'Sequence matters: definitions, then calibration, then compensation.'
      ],
      sections:[
        { h:null, p:['TechCorp had just closed its best revenue year ever. Morale felt high. And when the annual performance ratings came in, the distribution seemed to confirm it: almost four out of five employees had "exceeded expectations." Leadership saw a high-performing organisation. What they were actually looking at was a measurement system that had quietly stopped working.'] },
        { h:'The hidden cost', p:['A rating is a currency. Its value comes from scarcity. When a "5" is handed out freely, it stops signalling anything - to managers, to compensation, and most dangerously, to the people who genuinely earned it.','The strongest performers looked around, saw colleagues who coasted holding the same rating they did, and drew the obvious conclusion: excellence here is invisible.'], quote:'"I realised my 5 was worth exactly the same as the 5 of someone who shipped nothing all year. So what was the point of the late nights?" - Senior Engineer, exit interview' },
        { h:'The exodus', p:['Four of TechCorp\'s strongest engineers resigned within a single quarter. None cited pay. All four, independently, described a rating system that had stopped telling the truth.'] },
        { h:'What they did', p:['TechCorp\'s new Head of People resisted the urge to slam a bell curve on the org. Instead, over one cycle, they rewrote each rating definition with concrete, evidenced examples; ran live calibration sessions where managers had to defend ratings with proof; and only then let the distribution find its honest shape.','No quota was ever imposed. The curve normalised on its own - because the judgments underneath it had become real. The following year, the share rated "Exceeds" fell from 62% to 31% - not because a quota forced it, but because the rating finally meant something again.'] }
      ]

  'startupx-chaos-to-structure': {
    company:'StartupX', industry:'Consumer Tech', outcome:'success',
    accent:'#34d399',
    title:'Growing Pains: When a Startup Realises It Needs Real HR',
    standfirst:'Series B. 140 employees. Zero performance system. And 90 days until investor due diligence. One question on the term sheet turned a scrappy startup\'s biggest blind spot into its sharpest advantage.',
    meta:['Consumer Tech','140 employees','90-day sprint'],
    scenes:[
      { type:'beat', kicker:'The setup',
        head:'Speed was the whole identity.',
        body:'StartupX had grown from 12 to 140 people in two years. Performance management was a luxury they\'d deliberately skipped - it felt like the kind of bureaucracy they\'d left big companies to escape. <strong>Promotions happened by gut. Raises happened by who asked loudest. Feedback happened in Slack, or not at all.</strong> It worked, right up until the moment it very publicly didn\'t.' },

      { type:'beat', kicker:'The trigger',
        head:'Then the term sheet arrived.',
        body:'Series B funding was on the table. Buried in the due-diligence checklist was a single line: <strong>"Describe your performance management and talent retention framework."</strong> The founders looked at each other. There wasn\'t one. The investor wasn\'t asking out of curiosity - at 140 people, the absence of a system <strong>is</strong> the risk.' },

      { type:'quote',
        quote:'"We told ourselves we were too fast-moving for process. What the investor heard was: we have no idea who our best people are, or how to keep them."',
        attr:' - Co-founder & CEO, StartupX' },

      { type:'bigstat', num:'90', label:'Days until due diligence. <strong>Zero</strong> existing framework. The clock that turned a blind spot into a forcing function.' },

      { type:'decision',
        tag:'Your turn',
        q:'90 days, 140 people, no system. Where do you start?',
        setup:'You\'re brought in as StartupX\'s first People lead. The temptation is to copy a big-company framework wholesale. But you have 90 days and a culture that despises bureaucracy. What\'s your opening move?',
        choices:[
          { key:'A', text:'Buy and roll out a full enterprise PMS suite - annual reviews, 9-box, calibration, the works.',
            verdict:'too heavy, too fast', verdictColor:'#fbbf24',
            what:'Dropping a 50-page enterprise framework onto a 140-person startup in 90 days is how you get <strong>malicious compliance</strong>. People fill in forms to satisfy the investor, then ignore them. You\'d have a framework that exists on paper and nowhere else - which is arguably worse than nothing, because now it\'s <em>documented</em> that you don\'t follow your own process.',
            actual:'StartupX explicitly rejected this. The CEO called it "buying a suit three sizes too big and hoping we grow into it before anyone notices."' },
          { key:'B', text:'Start with one lightweight thing done well: clear role expectations + a simple quarterly check-in. Build from there.',
            verdict:'the right first move', verdictColor:'#34d399',
            what:'A startup needs a <strong>skeleton, not an exoskeleton</strong>. Defining what good looks like for each role, plus a simple quarterly conversation, gives the investor a real, honest framework <em>and</em> respects the culture. It\'s small enough to actually get adopted - and adoption is the only metric that matters in 90 days.',
            actual:'This is exactly what StartupX did - role clarity first, then a single quarterly check-in ritual, before anything more.' },
          { key:'C', text:'Survey all 140 employees first to understand what they want from a performance system.',
            verdict:'admirable, but stalls', verdictColor:'#fbbf24',
            what:'Listening is good - but a 90-day clock means you can\'t spend three weeks gathering opinions on something most employees have never experienced. You\'d be asking people to design a system they have no reference point for. <strong>Ship a v1, then listen as they use it.</strong>',
            actual:'StartupX did gather input - but lightweight and in parallel, not as a blocker to shipping v1.' },
          { key:'D', text:'Focus only on identifying and locking in the top 20 performers before the investor looks closer.',
            verdict:'solves optics, not the risk', verdictColor:'#f87171',
            what:'Retention of your best people matters enormously - but doing <em>only</em> this is treating the symptom the investor noticed, not the cause. A system that only "sees" 20 people leaves 120 in the dark and signals that performance management here is about politics, not fairness.',
            actual:'StartupX did prioritise retention - but built it into the universal framework, not as a separate VIP track.' }
        ] },

      { type:'beat', kicker:'What they built',
        head:'A skeleton, not an exoskeleton.',
        body:'In 90 days, StartupX shipped exactly three things: <strong>clear role expectations</strong> for every position, a <strong>simple quarterly check-in</strong> between every employee and manager, and a <strong>lightweight rating scale</strong> with real definitions. No 9-box. No forced curve. No 50-page handbook. Just enough structure to be honest, and light enough to actually get used. The investor didn\'t want a perfect system - they wanted evidence the founders <em>understood the risk</em> and had a credible plan.' },

      { type:'bigstat', num:'94%', label:'Quarterly check-in completion rate within two cycles. <strong>Adoption</strong> - the only number that proves a system is real and not theatre.' },

      { type:'lesson', tag:'What this teaches',
        items:[
          {strong:'A startup needs a skeleton, not an exoskeleton.', rest:'Match the weight of the system to the stage of the company. One thing done well beats ten things ignored.' },
          {strong:'Adoption is the only metric that matters early.', rest:'A simple framework people actually use beats a sophisticated one they route around.' },
          {strong:'The absence of a system IS the risk.', rest:'At scale, "we move too fast for process" reads to investors as "we can\'t see or keep our talent."' },
          {strong:'Ship v1, then listen.', rest:'You can\'t survey your way to a system people have never experienced. Launch small, iterate on real usage.' }
        ] },

      { type:'closing',
        head:'Build the skeleton on real data.',
        sub:'Use the Scenario Library to model a 140-person startup and design a lightweight framework that scales - exactly like StartupX did.',
        primary:{label:'Open the Scenario Library', href:'/pages/scenarios.html'},
        secondary:{label:'Next case study →', href:'/pages/case-studies.html'} }
    ],
    textVersion:{
      lessonsTitle:'The four lessons',
      lessons:[
        'A startup needs a skeleton, not an exoskeleton - match the system to the stage.',
        'Adoption is the only metric that matters early.',
        'The absence of a system is itself the risk at scale.',
        'Ship a v1, then listen - don\'t survey your way to a system nobody has used.'
      ],
      sections:[
        { h:null, p:['StartupX had grown from 12 to 140 people in two years. Performance management was a luxury they\'d deliberately skipped. Promotions happened by gut. Raises happened by who asked loudest. Feedback happened in Slack, or not at all. It worked, right up until the moment it very publicly didn\'t.'] },
        { h:'The trigger', p:['Series B funding was on the table. Buried in the due-diligence checklist was a single line: "Describe your performance management and talent retention framework." There wasn\'t one. At 140 people, the absence of a system is the risk.'], quote:'"We told ourselves we were too fast-moving for process. What the investor heard was: we have no idea who our best people are, or how to keep them." - Co-founder & CEO' },
        { h:'What they built', p:['In 90 days, StartupX shipped exactly three things: clear role expectations for every position, a simple quarterly check-in between every employee and manager, and a lightweight rating scale with real definitions.','No 9-box. No forced curve. No 50-page handbook. Just enough structure to be honest, and light enough to actually get used. Within two cycles, quarterly check-in completion hit 94% - proof the system was real, not theatre.'] }
      ]
    }

  'financey-forced-ranking': {
    company:'FinanceY Capital', industry:'Investment Management', outcome:'cautionary',
    accent:'#ef4444',
    title:'The Year the Stars Went Dark',
    standfirst:'A new CEO imported forced ranking from his Wall Street days, certain it would sharpen performance. Within eighteen months, the firm\'s three best portfolio managers had walked - and a discrimination claim was making its way through the courts.',
    meta:['Investment Mgmt','Cautionary tale','18-month collapse'],
    scenes:[
      { type:'beat', kicker:'How it began',
        head:'A conviction borrowed from somewhere else.',
        body:'FinanceY\'s new CEO had spent two decades at a bulge-bracket bank where <strong>stack ranking was gospel</strong> - every year, the bottom 10% were managed out, the top 20% lavishly rewarded. It had felt brutal but effective. So he imported it wholesale into FinanceY, a 90-person investment firm built on tight-knit, collaborative deal teams. <strong>He never asked whether the medicine fit the patient.</strong>' },

      { type:'beat', kicker:'The mechanism',
        head:'The math that forces a loser.',
        body:'Forced ranking requires that <strong>someone</strong> lands at the bottom - regardless of how good they actually are. At FinanceY, deal teams of four or five were now competing internally for a fixed number of top slots. People who had spent years sharing models, covering each other\'s blind spots, and mentoring juniors suddenly had a structural reason to <strong>stop helping each other.</strong> The collaboration that made the firm great became a competitive liability overnight.' },

      { type:'quote',
        quote:'"I used to walk a junior through my whole thesis. Now? Why would I? If she ranks above me, I\'m the one in the bottom bucket. The system taught us to hoard."',
        attr:' - Portfolio Manager, FinanceY (one of the three who left)' },

      { type:'people', kicker:'The exodus', vizTitle:'The collaboration network, 18 months in',
        total:60, stars:3, leaving:3,
        caption:'The three highest-conviction portfolio managers - the firm\'s actual stars - resigned within 18 months. <strong>Forced ranking doesn\'t identify your best people. It teaches them that excellence here is a zero-sum trap.</strong>' },

      { type:'decision',
        tag:'Your turn',
        q:'You\'re the CHRO. The CEO is set on forced ranking. What do you do?',
        setup:'The CEO is convinced stack ranking will sharpen the firm. You can see the collaborative culture that makes FinanceY work. You have one meeting to influence the decision. What\'s your play?',
        choices:[
          { key:'A', text:'Implement it as instructed - he\'s the CEO, and it worked at his last firm.',
            verdict:'the costly path they took', verdictColor:'#f87171',
            what:'Deferring to "it worked there" ignores that <strong>context is the whole game</strong>. A model built for thousands of interchangeable analysts is poison for small, interdependent deal teams. Implementing without challenge is how FinanceY lost three stars and inherited a lawsuit. "The CEO said so" is not a defence in an employment tribunal.',
            actual:'This is the path FinanceY actually took - and it cost them their best people and a discrimination claim.' },
          { key:'B', text:'Bring data: model the impact on FinanceY\'s specific team structure and present the collaboration risk before rollout.',
            verdict:'the move that could have saved them', verdictColor:'#34d399',
            what:'You don\'t win this by saying "I disagree." You win by showing the CEO <strong>what forced ranking does to teams of five versus teams of five thousand</strong> - the interdependency math, the comparison to firms that abandoned it, the legal exposure of forced distributions. Make the risk concrete and specific to FinanceY. Influence through evidence, not opinion.',
            actual:'This is what the case teaches in hindsight - the CHRO who models the specific risk, with data, before rollout is the one who prevents the disaster.' },
          { key:'C', text:'Refuse to implement it and escalate to the board.',
            verdict:'right instinct, wrong first step', verdictColor:'#fbbf24',
            what:'Going over the CEO\'s head in your first disagreement burns the relationship and your credibility - and you may lose the war anyway. Escalation is a real tool, but it\'s a <strong>last</strong> resort, not an opening move. Try to win with evidence first; keep the board in reserve.',
            actual:'No FinanceY exec took this path - but even if they had, leading with escalation rather than evidence rarely persuades.' },
          { key:'D', text:'Implement a softer version - ranking for the bottom 5% only, to limit the damage.',
            verdict:'still the same poison, diluted', verdictColor:'#fbbf24',
            what:'A "lite" forced ranking still introduces the zero-sum logic that breaks collaboration - it just breaks it more slowly. The fundamental problem isn\'t the <em>size</em> of the forced bucket; it\'s that <strong>any</strong> forced distribution tells interdependent teammates to compete instead of cooperate.',
            actual:'Compromise versions of forced ranking tend to deliver the cultural damage without even the clarity the CEO wanted.' }
        ] },

      { type:'beat', kicker:'The aftermath',
        head:'Two years to undo eighteen months.',
        body:'FinanceY eventually scrapped forced ranking - but the damage outlasted the policy. The three departed PMs took institutional knowledge and client relationships with them. The discrimination claim, rooted in how the forced distribution had disproportionately bucketed certain groups, dragged through the courts and the press. <strong>It took the firm roughly two years to rebuild the collaborative trust that eighteen months of stack ranking had dismantled.</strong>' },

      { type:'lesson', tag:'What this teaches',
        items:[
          {strong:'A model that works in one context can be poison in another.', rest:'Stack ranking built for thousands of interchangeable roles destroys small interdependent teams.' },
          {strong:'Forced ranking doesn\'t find your best people - it teaches them to leave.', rest:'When excellence becomes zero-sum, your stars are the first to opt out.' },
          {strong:'Forced distributions carry real legal exposure.', rest:'When a quota disproportionately buckets protected groups, the system itself becomes evidence.' },
          {strong:'Influence the decision with data, before rollout.', rest:'"I disagree" loses. Modelling the specific, contextual risk is how HR actually changes a CEO\'s mind.' }
        ] },

      { type:'closing',
        head:'Model the damage before it happens.',
        sub:'Run a forced-ranking distribution against a collaborative team structure in the Bell Curve tool - and see the collaboration risk FinanceY missed.',
        primary:{label:'Open the Bell Curve tool', href:'/pages/scenarios.html'},
        secondary:{label:'Next case study →', href:'/pages/case-studies.html'} }
    ],
    textVersion:{
      lessonsTitle:'The four lessons',
      lessons:[
        'A model that works in one context can be poison in another.',
        'Forced ranking doesn\'t find your best people - it teaches them to leave.',
        'Forced distributions carry real legal exposure.',
        'Influence the decision with data, before rollout - not opinion, after.'
      ],
      sections:[
        { h:null, p:['FinanceY\'s new CEO had spent two decades at a bulge-bracket bank where stack ranking was gospel - every year the bottom 10% managed out, the top 20% lavishly rewarded. So he imported it wholesale into FinanceY, a 90-person firm built on tight-knit, collaborative deal teams. He never asked whether the medicine fit the patient.'] },
        { h:'The mechanism', p:['Forced ranking requires that someone lands at the bottom, regardless of how good they are. Deal teams of four or five were now competing internally for a fixed number of top slots. People who had shared models and mentored juniors suddenly had a structural reason to stop helping each other.'], quote:'"I used to walk a junior through my whole thesis. Now? Why would I? If she ranks above me, I\'m the one in the bottom bucket. The system taught us to hoard." - Portfolio Manager who left' },
        { h:'The exodus', p:['The three highest-conviction portfolio managers - the firm\'s actual stars - resigned within 18 months. A discrimination claim, rooted in how the forced distribution had bucketed certain groups, made its way through the courts.'] },
        { h:'The aftermath', p:['FinanceY eventually scrapped forced ranking, but the damage outlasted the policy. It took roughly two years to rebuild the collaborative trust that eighteen months of stack ranking had dismantled.'] }
      ]
    }

  'legal-challenge': {
    company:'Crestwood Facilities', industry:'Facilities Management', outcome:'cautionary',
    accent:'#ef4444',
    title:'The PIP That Became a Court Case',
    standfirst:'A performance improvement plan was opened twenty-two days after an employee disclosed her pregnancy - with no prior documented feedback anywhere in her file. What followed was eighteen months of litigation and a settlement that cost more than her annual salary.',
    meta:['Facilities Mgmt','Cautionary tale','18 months in court'],
    scenes:[
      { type:'beat', kicker:'The background',
        head:'A quiet performer, until suddenly she wasn\'t.',
        body:'For three years, the employee\'s file at Crestwood was unremarkable - no glowing reviews, but no documented concerns either. Her manager would later claim her performance had been "slipping for months." <strong>None of it was written down.</strong> Not one formal conversation, not one logged piece of feedback, not a single note. In performance management, what isn\'t documented didn\'t happen.' },

      { type:'beat', kicker:'The trigger',
        head:'Twenty-two days.',
        body:'On a Monday, the employee disclosed to her manager that she was pregnant. <strong>Twenty-two days later</strong>, she was placed on a formal Performance Improvement Plan - the first formal performance action in her entire three-year tenure. From the company\'s side, the timing was a coincidence. From every other angle that matters - hers, her lawyer\'s, and eventually the court\'s - <strong>the timing was the whole story.</strong>' },

      { type:'bigstat', num:'22', label:'Days between the pregnancy disclosure and the PIP. <strong>With zero prior documented feedback</strong>, that number became the centre of gravity for everything that followed.' },

      { type:'quote',
        quote:'"There was no paper trail showing a performance problem before the disclosure. So the only documented thing that changed before the PIP… was that she told us she was pregnant. That\'s not a defensible position. That\'s the plaintiff\'s opening slide."',
        attr:' - Employment counsel reviewing the case' },

      { type:'decision',
        tag:'Your turn',
        q:'You\'re the HRBP. The manager wants to PIP her now. What do you do?',
        setup:'The manager insists performance has genuinely declined and wants to move fast. You\'ve just learned she disclosed her pregnancy three weeks ago. There is nothing in her file. The manager is frustrated with your hesitation. What\'s your move?',
        choices:[
          { key:'A', text:'Approve the PIP - if performance is genuinely down, the timing is just unfortunate coincidence.',
            verdict:'the move that became the lawsuit', verdictColor:'#f87171',
            what:'Genuine performance issues don\'t protect you when there\'s <strong>no contemporaneous documentation</strong> and the only recorded event before the PIP is a protected disclosure. "It was a coincidence" is not a legal defence - the burden shifts to <em>you</em> to prove it wasn\'t. With an empty file, you can\'t. This is precisely the move that cost Crestwood 18 months and a six-figure settlement.',
            actual:'This is exactly what Crestwood did. The empty file turned a possibly-legitimate performance concern into an indefensible legal position.' },
          { key:'B', text:'Pause the PIP. Start proper, contemporaneous documentation of specific performance gaps from today - and involve legal before any formal action.',
            verdict:'the move that prevents the case', verdictColor:'#34d399',
            what:'If the performance problem is real, it will still be real in 60 days - now <strong>documented, specific, and evidenced</strong>. Pausing isn\'t protecting a poor performer; it\'s protecting the <em>process</em> so that any future action is defensible. Involving legal early, given the proximity to a protected disclosure, is not optional. You separate the timing from the substance by building a real record before you act.',
            actual:'This is the path the case teaches: pause, document properly, involve legal - the timing risk is managed by building an evidenced record before any formal step.' },
          { key:'C', text:'Drop the performance concern entirely to avoid any legal risk.',
            verdict:'overcorrection', verdictColor:'#fbbf24',
            what:'A pregnancy disclosure doesn\'t make someone immune to performance management - and abandoning a genuine concern entirely is its own failure. It\'s unfair to the team and signals that protected status pauses accountability. The answer isn\'t "never address it." It\'s <strong>"address it properly, with documentation, and legal awareness."</strong>',
            actual:'Doing nothing would have spared the lawsuit but left a real issue unmanaged - the goal is a defensible process, not avoidance.' },
          { key:'D', text:'Approve the PIP but back-date some informal feedback notes to establish a prior record.',
            verdict:'catastrophic - never do this', verdictColor:'#f87171',
            what:'Fabricating or back-dating documentation transforms a civil employment dispute into potential <strong>fraud and spoliation of evidence</strong>. It is discoverable, it destroys all credibility, and it can expose individuals personally. There is no version of this that ends well. The empty file is a problem; faking its contents is a catastrophe.',
            actual:'Any hint of back-dated documentation would have escalated Crestwood\'s exposure from an employment claim into something far graver.' }
        ] },

      { type:'beat', kicker:'The aftermath',
        head:'Eighteen months, and a number bigger than her salary.',
        body:'The claim alleged the PIP was a pretext for pregnancy discrimination. With no prior documentation, Crestwood couldn\'t demonstrate the performance concern pre-dated the disclosure. The matter dragged through proceedings for <strong>eighteen months</strong> before settling - for a sum that exceeded the employee\'s annual salary, before legal fees. The manager\'s frustration in that first meeting had felt urgent. <strong>The empty file made the urgency irrelevant.</strong>' },

      { type:'lesson', tag:'What this teaches',
        items:[
          {strong:'No documentation means it didn\'t happen.', rest:'A performance concern with no contemporaneous record is legally invisible - and indefensible.' },
          {strong:'Timing near a protected disclosure shifts the burden to you.', rest:'A PIP weeks after a pregnancy, illness, or complaint disclosure must be airtight, or it reads as retaliation.' },
          {strong:'Pausing to document is protecting the process, not the poor performer.', rest:'A real problem survives 60 days. Build the evidenced record first, then act.' },
          {strong:'Never, ever back-date documentation.', rest:'It converts an employment dispute into fraud - and exposes individuals personally.' }
        ] },

      { type:'closing',
        head:'Build a defensible PIP, the right way.',
        sub:'Use the PIP Tracker to structure documented, milestone-based plans that hold up - with the paper trail Crestwood never had.',
        primary:{label:'Open the PIP Tracker', href:'/pages/scenarios.html'},
        secondary:{label:'Next case study →', href:'/pages/case-studies.html'} }
    ],
    textVersion:{
      lessonsTitle:'The four lessons',
      lessons:[
        'No documentation means it didn\'t happen - a concern with no record is indefensible.',
        'Timing near a protected disclosure shifts the legal burden onto you.',
        'Pausing to document properly protects the process, not the poor performer.',
        'Never back-date documentation - it converts a dispute into fraud.'
      ],
      sections:[
        { h:null, p:['For three years, the employee\'s file at Crestwood was unremarkable - no glowing reviews, but no documented concerns either. Her manager would later claim her performance had been "slipping for months." None of it was written down. In performance management, what isn\'t documented didn\'t happen.'] },
        { h:'The trigger', p:['On a Monday, the employee disclosed that she was pregnant. Twenty-two days later, she was placed on a formal Performance Improvement Plan - the first formal performance action in her entire three-year tenure. From the company\'s side, the timing was a coincidence. From every other angle that matters, the timing was the whole story.'], quote:'"The only documented thing that changed before the PIP was that she told us she was pregnant. That\'s not a defensible position. That\'s the plaintiff\'s opening slide." - Employment counsel' },
        { h:'The aftermath', p:['The claim alleged the PIP was a pretext for pregnancy discrimination. With no prior documentation, Crestwood couldn\'t demonstrate the performance concern pre-dated the disclosure.','The matter dragged through proceedings for eighteen months before settling - for a sum that exceeded the employee\'s annual salary, before legal fees. The empty file made the manager\'s urgency irrelevant.'] }
      ]
    }
  },

  'retailz-reduced-turnover': {
    company:'RetailZ', industry:'Organised Retail', outcome:'success',
    accent:'#34d399',
    title:'Fixing the Revolving Door',
    standfirst:'RetailZ was bleeding 40% of its workforce every year, burning crores in replacement costs. Leadership assumed the fix would be expensive - better pay, bigger bonuses, a new benefits platform. The actual fix cost almost nothing. It was five minutes per employee, per week.',
    meta:['Organised Retail','40% turnover','Near-zero-cost fix'],
    scenes:[
      { type:'beat', kicker:'The problem',
        head:'A revolving door nobody could stop.',
        body:'RetailZ ran dozens of stores and lost <strong>roughly four in ten frontline employees every year</strong>. Each exit cost real money - hiring, onboarding, the productivity dip while a new person learned the ropes. Leadership had tried the obvious levers: small pay bumps, a referral bonus, a slicker benefits portal. The needle barely moved. They were treating a retention problem as a <strong>compensation problem</strong>, and it wasn\'t.' },

      { type:'bigstat', num:'40%', label:'Annual frontline turnover. Crores in repeated replacement cost - and every expensive fix they\'d tried had <strong>missed the actual cause.</strong>' },

      { type:'beat', kicker:'The real diagnosis',
        head:'People weren\'t leaving for money.',
        body:'When RetailZ finally analysed exit data properly, a pattern emerged that had nothing to do with pay. Employees who left overwhelmingly reported the same thing: <strong>they had no idea how they were doing, no one checked in on them, and they felt invisible.</strong> Most had gone weeks or months without a single meaningful conversation with their manager. They didn\'t leave because the money was bad. <strong>They left because nobody noticed they were there.</strong>' },

      { type:'quote',
        quote:'"In four months, my manager spoke to me about my actual work exactly twice. Both times it was to point out a mistake. I wasn\'t underpaid. I was unseen."',
        attr:' - Former store associate, exit survey' },

      { type:'decision',
        tag:'Your turn',
        q:'40% turnover, every expensive fix has failed. What do you try?',
        setup:'You\'re the new People Director. The CFO is bracing for you to ask for a big retention budget. But the exit data is pointing somewhere else entirely. What do you propose?',
        choices:[
          { key:'A', text:'Push for an across-the-board pay raise to make RetailZ more competitive.',
            verdict:'expensive, and misses the cause', verdictColor:'#fbbf24',
            what:'Raising pay when people are leaving because they feel <strong>invisible</strong> is spending a fortune to fix the wrong problem. You might slow the bleed slightly, but you\'ll have permanently raised your cost base without addressing why people actually disengage. The exit data already told you money isn\'t the driver.',
            actual:'RetailZ had already tried pay-based fixes. They barely moved the needle - because pay was never the real issue.' },
          { key:'B', text:'Introduce a simple, mandatory weekly 5-minute check-in between every employee and their manager.',
            verdict:'the fix that worked', verdictColor:'#34d399',
            what:'The root cause was invisibility, so the fix is <strong>visibility</strong> - and it\'s almost free. A structured five-minute weekly conversation ("how\'s it going, what\'s in your way, what did you do well") makes every employee feel seen, every week. It\'s small enough to actually sustain, and it directly targets the real reason people were leaving.',
            actual:'This is precisely what RetailZ did - a mandatory weekly five-minute check-in. Turnover fell dramatically, at near-zero cost.' },
          { key:'C', text:'Launch an annual engagement survey to track sentiment over time.',
            verdict:'measures the problem, doesn\'t fix it', verdictColor:'#fbbf24',
            what:'A survey tells you how people feel once a year - but people who feel invisible don\'t need to be <em>measured</em>, they need to be <em>seen</em>. Surveying without changing the daily manager-employee contact is like weighing yourself repeatedly instead of changing your diet.',
            actual:'RetailZ did eventually track sentiment - but the actual fix was the weekly contact, not the measurement of it.' },
          { key:'D', text:'Build a recognition platform with points, badges, and rewards.',
            verdict:'gamifies the symptom', verdictColor:'#fbbf24',
            what:'Recognition tech can help - but bolting a points system onto managers who never talk to their people just automates a relationship that doesn\'t exist. Badges don\'t make someone feel seen; <strong>a manager who knows their name and their week does.</strong> Fix the human contact first.',
            actual:'RetailZ kept it human and analog first. The five-minute conversation did what no platform could.' }
        ] },

      { type:'beat', kicker:'What they did',
        head:'Five minutes. Every week. Non-negotiable.',
        body:'RetailZ rolled out a single ritual: every manager, every week, a <strong>five-minute structured check-in</strong> with each direct report. Three questions - how\'s it going, what\'s blocking you, what went well. No forms to file, no system to log into. Just consistent, structured human contact. The entire intervention cost almost nothing but manager time. <strong>And manager time, it turned out, was the one thing employees had been starving for.</strong>' },

      { type:'bigstat', num:'5 min', label:'Per employee, per week. The entire cost of the fix that solved a crores-deep turnover problem. <strong>Visibility was never expensive - it was just absent.</strong>' },

      { type:'lesson', tag:'What this teaches',
        items:[
          {strong:'People rarely leave for the reason you assume.', rest:'RetailZ spent on pay for years; the real driver was feeling invisible. Diagnose before you spend.' },
          {strong:'The most powerful retention lever is often the cheapest.', rest:'Consistent human contact beats expensive platforms and pay bumps for frontline engagement.' },
          {strong:'Frequency beats formality.', rest:'A five-minute weekly conversation outperforms an elaborate annual review for making people feel seen.' },
          {strong:'You can\'t survey your way out of an attention problem.', rest:'Measuring sentiment isn\'t the same as changing the daily experience that creates it.' }
        ] },

      { type:'closing',
        head:'Model the cost of turnover yourself.',
        sub:'Use the Manager Dashboard to see how check-in frequency maps to retention - and find the cheap lever RetailZ almost missed.',
        primary:{label:'Open the Manager Dashboard', href:'/pages/scenarios.html'},
        secondary:{label:'Next case study →', href:'/pages/case-studies.html'} }
    ],

        'The most powerful retention lever is often the cheapest: human contact.',

        'You can\'t survey your way out of an attention problem.'
      ],
      sections:[
        { h:null, p:['RetailZ ran dozens of stores and lost roughly four in ten frontline employees every year. Each exit cost real money. Leadership had tried the obvious levers: small pay bumps, a referral bonus, a slicker benefits portal. The needle barely moved. They were treating a retention problem as a compensation problem, and it wasn\'t.'] },
        { h:'The real diagnosis', p:['When RetailZ finally analysed exit data properly, a pattern emerged that had nothing to do with pay. Employees who left reported the same thing: they had no idea how they were doing, no one checked in, and they felt invisible. They didn\'t leave because the money was bad. They left because nobody noticed they were there.'], quote:'"In four months, my manager spoke to me about my actual work exactly twice. Both times to point out a mistake. I wasn\'t underpaid. I was unseen." - Former associate' },

  'star-who-burned-out': {
    company:'Centris Pharma', industry:'Pharmaceuticals', outcome:'cautionary',
    accent:'#ef4444',
    title:'What Happens When You Push a Star Too Far',
    standfirst:'Five consecutive Rating 5s. Every critical project routed through her. Then one Monday she simply didn\'t show up - and never came back. There were seven warning signs across eighteen months. Every one of them was visible. Every one was read as a strength.',
    meta:['Pharmaceuticals','Cautionary tale','7 missed signals'],
    scenes:[
      { type:'beat', kicker:'The star',
        head:'She was the one you could always count on.',
        body:'At Centris Pharma, she was the gold standard. Five straight years of top ratings. When a project absolutely could not fail, it went to her. When a deadline was impossible, she made it possible. Leadership loved her, and they showed it the way organisations usually do - <strong>by giving her more.</strong> More projects, more scope, more of the load that nobody else could carry. It looked like recognition. It was actually a slow-motion overload.' },

      { type:'beat', kicker:'The signals',
        head:'Seven warnings, all read as strengths.',
        body:'Over eighteen months the signs accumulated: she stopped taking leave. She was emailing at 2am. She quietly absorbed two departing colleagues\' workloads without complaint. She went silent in meetings she used to dominate. She stopped pushing back. Each signal had a healthy-sounding interpretation - <strong>"dedicated," "committed," "low-maintenance," "a safe pair of hands."</strong> The organisation chose the flattering reading every single time. <strong>Burnout doesn\'t always look like collapse. Sometimes it looks like your most reliable employee getting quieter.</strong>' },

      { type:'people', kicker:'The warning signs', vizTitle:'18 months of signals',
        total:40, stars:7, leaving:7,
        caption:'Seven distinct warning signs over eighteen months - declining leave, late-night work, absorbed workloads, growing silence. <strong>All visible. All reframed as virtues. None acted on.</strong>' },

      { type:'quote',
        quote:'"We kept saying how lucky we were to have someone so committed. We never once asked what that commitment was costing her. We mistook her silence for stability."',
        attr:' - Her manager, after she left' },

      { type:'decision',
        tag:'Your turn',
        q:'Your best performer has gone quiet and stopped taking leave. What do you do?',
        setup:'She\'s still delivering flawlessly. She\'s never complained. But you\'ve noticed the 2am emails, the cancelled holidays, the new silence in meetings. Everything on paper says she\'s fine. Your gut says otherwise. What\'s your move?',
        choices:[
          { key:'A', text:'Nothing - she\'s your top performer and she\'s still delivering. Don\'t fix what isn\'t broken.',
            verdict:'the path that lost her', verdictColor:'#f87171',
            what:'"Still delivering" is exactly what makes burnout invisible until it\'s terminal. By the time output drops, the person is often already gone internally. Reading flawless delivery as proof of wellbeing is how Centris lost her - <strong>the absence of complaint is not the presence of wellbeing.</strong>',
            actual:'This is what Centris did. She delivered right up until the Monday she didn\'t show - and never came back.' },
          { key:'B', text:'Proactively intervene: reduce her load, mandate her leave, and have an honest conversation about sustainability - before output drops.',
            verdict:'the move that saves her', verdictColor:'#34d399',
            what:'High performers will almost never raise the hand themselves - their identity is tied to carrying the load. So the manager has to act <strong>before</strong> the data shows a problem, on the behavioural signals alone. Forcing rest she won\'t take for herself, and redistributing load she\'ll never admit she can\'t handle, is the intervention. <strong>Protecting your best people from their own over-commitment is the job.</strong>',
            actual:'This is the lesson Centris learned too late - the signals were all there to act on, eighteen months before she broke.' },
          { key:'C', text:'Give her a big bonus and public recognition to show she\'s valued.',
            verdict:'rewards the overload', verdictColor:'#fbbf24',
            what:'Recognition feels caring, but rewarding someone for unsustainable effort just <strong>reinforces the behaviour that\'s burning them out</strong>. A bonus tells her the 2am emails are working. What she needs isn\'t more reason to push harder - it\'s permission, structurally enforced, to stop.',
            actual:'Centris did reward her generously every year. The rewards confirmed that overextension was the path to approval.' },
          { key:'D', text:'Wait for her next 1:1 and ask if everything\'s okay.',
            verdict:'too passive, too late', verdictColor:'#fbbf24',
            what:'Asking "are you okay?" to someone whose entire identity is being okay will get you one answer: "I\'m fine." Burned-out high performers are the <em>least</em> likely to self-report. A passive question isn\'t an intervention - you have to act on the behaviour you can see, not wait for an admission that will never come.',
            actual:'Gentle check-ins that rely on self-disclosure rarely surface burnout in high performers - they\'re built to mask it.' }
        ] },

      { type:'beat', kicker:'The Monday',
        head:'And then she was simply gone.',
        body:'There was no dramatic blow-up, no resignation letter full of grievances. One Monday she didn\'t come in. A doctor\'s note followed - burnout, complete exhaustion. She never returned to Centris. The organisation lost five years of institutional excellence not to a competitor, not to better pay, <strong>but to its own inability to read reliability as a risk.</strong> The seven signals had been a countdown. Nobody had been reading the clock.' },

      { type:'lesson', tag:'What this teaches',
        items:[
          {strong:'Burnout in high performers looks like reliability, not collapse.', rest:'Stopped leave, late-night work, growing silence - the warning signs masquerade as virtues.' },
          {strong:'The absence of complaint is not the presence of wellbeing.', rest:'Your best people are the least likely to ask for help. You have to act on signals, not wait for words.' },
          {strong:'Rewarding overload reinforces it.', rest:'Bonuses for unsustainable effort tell your stars that burning out is the path to approval.' },
          {strong:'Protecting people from their own over-commitment is a core management duty.', rest:'Sometimes the kindest, smartest act is to force the rest they\'ll never take themselves.' }
        ] },

      { type:'closing',
        head:'Spot the signals before the Monday.',
        sub:'Use the Manager Report Card to surface flight and burnout risk in your team - the warning signs Centris read as strengths.',
        primary:{label:'Open the Manager Report Card', href:'/pages/scenarios.html'},
        secondary:{label:'Next case study →', href:'/pages/case-studies.html'} }
    ],
    textVersion:{
      lessonsTitle:'The four lessons',
      lessons:[
        'Burnout in high performers looks like reliability, not collapse.',
        'The absence of complaint is not the presence of wellbeing.',
        'Rewarding overload reinforces it.',
        'Protecting people from their own over-commitment is a core management duty.'
      ],
      sections:[
        { h:null, p:['At Centris Pharma, she was the gold standard. Five straight years of top ratings. When a project absolutely could not fail, it went to her. Leadership showed their appreciation the way organisations usually do - by giving her more. More projects, more scope, more of the load nobody else could carry. It looked like recognition. It was a slow-motion overload.'] },
        { h:'The signals', p:['Over eighteen months the signs accumulated: she stopped taking leave, emailed at 2am, absorbed two departing colleagues\' workloads, went silent in meetings, stopped pushing back. Each signal had a healthy-sounding interpretation - "dedicated," "committed," "low-maintenance." The organisation chose the flattering reading every time.'], quote:'"We kept saying how lucky we were to have someone so committed. We never asked what that commitment was costing her. We mistook her silence for stability." - Her manager' },
        { h:'The Monday', p:['There was no dramatic blow-up. One Monday she didn\'t come in. A doctor\'s note followed - burnout, complete exhaustion. She never returned.','Centris lost five years of institutional excellence not to a competitor or better pay, but to its own inability to read reliability as a risk. The seven signals had been a countdown. Nobody was reading the clock.'] }
      ]

  'dei-audit-fallout': {
    company:'Harbridge Group', industry:'Financial Services', outcome:'cautionary',
    accent:'#ef4444',
    title:'Three Years of Data, One Devastating Finding',
    standfirst:'It started as a routine DEI baseline audit - a box-ticking exercise nobody expected to matter. Then the analysis surfaced three consecutive years of women being rated systematically lower than men at identical levels. The fallout was legal, financial, and cultural - and entirely self-inflicted.',
    meta:['Financial Services','Cautionary tale','3-year pattern'],
    scenes:[
      { type:'beat', kicker:'The routine check',
        head:'Nobody expected the audit to find anything.',
        body:'Harbridge Group commissioned a DEI baseline audit the way most firms do - to satisfy a board request and produce a reassuring slide. The expectation was a clean bill of health. Instead, when the performance ratings were broken down by gender <strong>at matched levels and roles</strong>, a pattern emerged that nobody could explain away: across three straight years, <strong>women were rated meaningfully lower than men doing the same jobs.</strong>' },

      { type:'bars', kicker:'The finding', vizTitle:'Average performance rating, matched levels', vizSub:'Harbridge Group - 3-year aggregate',
        bars:[
          {lbl:'Men\n(avg rating)', val:38, color:'#667eea'},
          {lbl:'Women\n(avg rating)', val:32, color:'#ef4444'}
        ],
        caption:'A consistent <strong>0.6-point gap</strong> at identical levels, sustained across three years. Not one rogue manager - a <strong>systemic pattern</strong> baked into how the whole organisation judged performance.' },

      { type:'beat', kicker:'Why it was so damaging',
        head:'A pattern is worse than an incident.',
        body:'A single biased rating is a mistake. <strong>Three years of consistent, measurable, same-direction bias is a system.</strong> And a system that the company had now <em>documented in its own audit</em>. The data Harbridge created to look responsible became the single most powerful piece of evidence against it - in legal terms, in regulatory terms, and in the eyes of every employee who eventually heard about it. <strong>You cannot un-know a finding like this once it\'s in writing.</strong>' },

      { type:'quote',
        quote:'"The most dangerous document in the building was the one we commissioned ourselves. We went looking for a clean slide and found three years of evidence we couldn\'t unsee - or undo."',
        attr:' - Chief People Officer, Harbridge Group' },

      { type:'decision',
        tag:'Your turn',
        q:'The audit just revealed a 3-year gender rating gap. What do you do first?',
        setup:'You\'re the CPO. The finding is real, documented, and systemic. The instinct in the room is to contain it. You have one chance to set the response on the right path. What\'s your first move?',
        choices:[
          { key:'A', text:'Bury the report and quietly adjust the rating process going forward without acknowledging the past.',
            verdict:'the move that compounds the risk', verdictColor:'#f87171',
            what:'Suppressing a documented finding of systemic discrimination doesn\'t make it disappear - it converts a fixable problem into a <strong>cover-up</strong>. Audits get discovered. The moment it surfaces that leadership knew and concealed, the legal and reputational damage multiplies far beyond the original gap.',
            actual:'Any attempt to bury a documented bias finding tends to transform a remediation problem into a far graver concealment problem.' },
          { key:'B', text:'Acknowledge it, bring in legal and remediate transparently: fix past pay/rating impacts AND the system that caused them.',
            verdict:'the only defensible path', verdictColor:'#34d399',
            what:'Once a pattern is documented, the only path that limits damage is <strong>transparent remediation</strong>. That means addressing the harm already done (rating and pay corrections for those affected) <em>and</em> fixing the root cause - calibration, bias training, structural checks. Painful and expensive, yes. But it\'s the only response that turns evidence-against-you into proof you acted in good faith.',
            actual:'Transparent remediation - fixing both the historical harm and the systemic cause - is the only response that holds up legally and culturally.' },
          { key:'C', text:'Blame and discipline the individual managers who gave the lower ratings.',
            verdict:'scapegoating misses the system', verdictColor:'#fbbf24',
            what:'A consistent pattern across the whole org over three years isn\'t a few bad managers - it\'s a <strong>systemic flaw in how performance is defined and calibrated</strong>. Punishing individuals lets the actual system off the hook and ensures the bias simply continues under new names. You fix systems by fixing systems, not by finding villains.',
            actual:'Pinning a systemic, organisation-wide pattern on individual managers leaves the root cause fully intact.' },
          { key:'D', text:'Commission a second audit to verify before taking any action.',
            verdict:'delay dressed as diligence', verdictColor:'#fbbf24',
            what:'A consistent three-year pattern is already robust evidence - re-auditing to "be sure" is often just a way to delay an uncomfortable response. Worse, the clock is now running: every cycle you wait without acting adds to the documented period of known, un-remediated bias.',
            actual:'Verification has its place, but using it to defer remediation only lengthens the period of documented inaction.' }
        ] },

      { type:'beat', kicker:'The reckoning',
        head:'The cost of a self-inflicted wound.',
        body:'Harbridge faced legal exposure, the expense of remediating three years of rating and pay impacts, and a deep cultural blow - employees who learned the firm had measured them through a biased lens. The hardest part for leadership to accept: <strong>none of it was an accident of fate.</strong> The bias had lived quietly in the system for years. The audit didn\'t create the problem - it forced the firm to finally see, and own, what it had been doing all along.' },

      { type:'lesson', tag:'What this teaches',
        items:[
          {strong:'A pattern is categorically worse than an incident.', rest:'Consistent, same-direction bias over years is a documented system - not a one-off mistake.' },
          {strong:'The data you create to look responsible can become evidence against you.', rest:'Audit findings are discoverable. Once a bias pattern is in writing, you cannot un-know it.' },
          {strong:'Systemic problems demand systemic fixes, not scapegoats.', rest:'Org-wide patterns come from how performance is defined and calibrated - punishing individuals leaves the cause intact.' },
          {strong:'Transparent remediation is the only defensible response.', rest:'Fix the historical harm AND the system. Concealment converts a fixable problem into a cover-up.' }
        ] },

      { type:'closing',
        head:'Audit your own ratings before someone else does.',
        sub:'Use the DEI Analytics tool to surface rating gaps across gender and level on your real data - and catch the pattern Harbridge documented too late.',
        primary:{label:'Open DEI Analytics', href:'/pages/scenarios.html'},
        secondary:{label:'Next case study →', href:'/pages/case-studies.html'} }
    ],
    textVersion:{

      lessons:[
        'A pattern is categorically worse than an incident.',
        'The data you create to look responsible can become evidence against you.',
        'Systemic problems demand systemic fixes, not scapegoats.',
        'Transparent remediation is the only defensible response.'
      ],
      sections:[
        { h:null, p:['Harbridge Group commissioned a DEI baseline audit the way most firms do - to satisfy a board request and produce a reassuring slide. Instead, when performance ratings were broken down by gender at matched levels, a pattern emerged nobody could explain away: across three straight years, women were rated meaningfully lower than men doing the same jobs - a consistent 0.6-point gap.'] },
        { h:'Why it was so damaging', p:['A single biased rating is a mistake. Three years of consistent, measurable, same-direction bias is a system - one the company had now documented in its own audit.','The data Harbridge created to look responsible became the most powerful piece of evidence against it. You cannot un-know a finding like this once it\'s in writing.'], quote:'"The most dangerous document in the building was the one we commissioned ourselves. We went looking for a clean slide and found three years of evidence we couldn\'t unsee." - Chief People Officer' },
        { h:'The reckoning', p:['Harbridge faced legal exposure, the cost of remediating three years of rating and pay impacts, and a deep cultural blow. The hardest part for leadership to accept: none of it was an accident. The bias had lived quietly in the system for years. The audit didn\'t create the problem - it forced the firm to finally own what it had been doing all along.'] }

  'calibration-collapse': {
    company:'Arcata Digital', industry:'Digital Marketing', outcome:'success',
    accent:'#667eea',
    title:'The Room Where One Voice Decided Everything',
    standfirst:'For four years, every calibration session at Arcata Digital bent toward the same person. The CRO was the loudest voice in the room, and every contested rating somehow moved in his direction. A new HRBP changed one small thing about how the room worked - and it changed everything.',
    meta:['Digital Marketing','4 years of drift','One structural fix'],
    scenes:[
      { type:'beat', kicker:'The room',
        head:'Calibration in name only.',
        body:'On paper, Arcata Digital ran proper calibration sessions - managers gathered to discuss and align on ratings before they were finalised. In practice, the room had a gravity well. The CRO was charismatic, senior, and certain. When he advocated for one of his people, the rating went up. When he questioned someone else\'s, it came down. Over four years, <strong>every contested rating in that room drifted toward whatever he thought</strong> - and everyone had quietly learned to stop fighting it.' },

      { type:'beat', kicker:'The cost',
        head:'A process that laundered one person\'s bias.',
        body:'Calibration is supposed to <strong>remove</strong> individual bias by pooling many perspectives. Arcata\'s calibration did the opposite - it took one person\'s preferences and gave them the legitimacy of a "group decision." Managers stopped preparing real evidence because they knew the room didn\'t actually decide on evidence. The strongest performers in <em>other</em> leaders\' teams were systematically under-rated relative to the CRO\'s favourites. <strong>The process designed to ensure fairness had become the mechanism of unfairness.</strong>' },

      { type:'quote',
        quote:'"We told ourselves we calibrated as a group. The truth is we calibrated to one man\'s opinion and called it consensus. Everyone knew. Nobody said it."',
        attr:' - Department head, Arcata Digital' },

      { type:'decision',
        tag:'Your turn',
        q:'One dominant voice owns every calibration. How do you fix the room?',
        setup:'You\'re the new HRBP. You can see the CRO bends every session his way, and everyone defers. You can\'t remove him from calibration. You have one change to make to how the room works. What is it?',
        choices:[
          { key:'A', text:'Privately ask the CRO to speak less and let others lead more.',
            verdict:'relies on goodwill, rarely holds', verdictColor:'#fbbf24',
            what:'A quiet word might work for one session, but it depends entirely on one powerful person voluntarily ceding influence - and old dynamics reassert themselves fast. You\'re trying to fix a <strong>structural</strong> problem with a <strong>personal</strong> favour. Structure beats willpower every time.',
            actual:'Behavioural requests on dominant personalities tend to fade within a session or two without a structural change underneath them.' },
          { key:'B', text:'Change the process: require evidence-based pre-reads and have each manager commit their ratings privately BEFORE open discussion.',
            verdict:'the structural fix that worked', verdictColor:'#34d399',
            what:'The fix isn\'t to silence the loud voice - it\'s to <strong>capture independent judgment before the loud voice can anchor it.</strong> When every manager submits evidence-backed ratings privately first, the room starts from genuine independent positions, not from whatever the CRO says first. Anchoring bias collapses. The discussion becomes about reconciling real evidence, not deferring to status. One small change to <em>sequence</em>, and the whole power dynamic dissolves.',
            actual:'This is exactly what Arcata\'s new HRBP did - private, evidence-based commitments before open discussion. The CRO\'s gravity well disappeared overnight.' },
          { key:'C', text:'Remove the CRO from calibration sessions entirely.',
            verdict:'creates a bigger problem', verdictColor:'#fbbf24',
            what:'Excluding a senior leader from calibration is a political grenade - and it\'s also wrong in principle. His perspective <em>should</em> be in the room; it just shouldn\'t <em>dominate</em> it. The goal isn\'t to remove voices, it\'s to make sure no single voice can anchor the rest. Exclusion fixes the symptom while creating a war.',
            actual:'Removing the senior voice would have solved the anchoring at the cost of a major political rupture - and lost a legitimate perspective.' },
          { key:'D', text:'Bring in an external facilitator to run the sessions.',
            verdict:'helps, but doesn\'t fix the cause', verdictColor:'#fbbf24',
            what:'A skilled facilitator can manage the room better - but the moment they leave, the gravity well returns, because the <strong>underlying sequence</strong> still lets one voice anchor everyone. Facilitation manages the dynamic; changing when and how judgments are captured <em>removes</em> it.',
            actual:'Facilitation can soften a dominant voice, but only a structural change to how ratings are committed removes the anchoring for good.' }
        ] },

      { type:'beat', kicker:'What changed',
        head:'One change to sequence. Everything else followed.',
        body:'The new HRBP introduced a single rule: <strong>before any discussion, every manager submitted their ratings privately, each backed by specific evidence.</strong> Only then did the room open up - and now the conversation was about reconciling genuine differences in documented judgment, not about reading which way the CRO was leaning. He still had a voice. It was just one voice among many now, instead of the only one that counted. Within two cycles, ratings in other leaders\' teams corrected upward, and managers started actually preparing - because for the first time, <strong>the evidence in the room mattered more than the volume.</strong>' },

      { type:'lesson', tag:'What this teaches',
        items:[
          {strong:'Calibration can launder bias instead of removing it.', rest:'A process meant to pool perspectives can instead give one person\'s preference the legitimacy of "consensus."' },
          {strong:'Capture independent judgment before discussion begins.', rest:'Private, evidence-based commitments first kills anchoring bias - the loudest voice can\'t set the starting point.' },
          {strong:'Fix the structure, not the personality.', rest:'You rarely fix a dominant voice with a quiet word. You fix it by changing the sequence so no voice can anchor the room.' },
          {strong:'Evidence requirements raise the whole room\'s game.', rest:'When managers must bring proof, they prepare - and the discussion shifts from status to substance.' }
        ] },

      { type:'closing',
        head:'Run a calibration the room can trust.',
        sub:'Use the Calibration Simulator to practise evidence-first, anchor-free sessions - the structure that broke Arcata\'s four-year drift.',
        primary:{label:'Open the Calibration Simulator', href:'/pages/scenarios.html'},
        secondary:{label:'Next case study →', href:'/pages/case-studies.html'} }
    ],
    textVersion:{
      lessonsTitle:'The four lessons',
      lessons:[
        'Calibration can launder bias instead of removing it.',
        'Capture independent judgment before discussion begins.',
        'Fix the structure, not the personality.',
        'Evidence requirements raise the whole room\'s game.'
      ],
      sections:[
        { h:null, p:['On paper, Arcata Digital ran proper calibration sessions. In practice, the room had a gravity well. The CRO was charismatic, senior, and certain. When he advocated for one of his people, the rating went up. When he questioned someone else\'s, it came down. Over four years, every contested rating drifted toward whatever he thought - and everyone had learned to stop fighting it.'] },
        { h:'The cost', p:['Calibration is supposed to remove individual bias by pooling perspectives. Arcata\'s did the opposite - it took one person\'s preferences and gave them the legitimacy of a "group decision." The strongest performers in other leaders\' teams were systematically under-rated relative to the CRO\'s favourites.'], quote:'"We told ourselves we calibrated as a group. The truth is we calibrated to one man\'s opinion and called it consensus. Everyone knew. Nobody said it." - Department head' },
        { h:'What changed', p:['The new HRBP introduced a single rule: before any discussion, every manager submitted their ratings privately, each backed by specific evidence. Only then did the room open up - and now the conversation was about reconciling documented judgment, not reading which way the CRO was leaning.','He still had a voice - just one among many. Within two cycles, ratings in other teams corrected upward, and managers started preparing, because the evidence in the room finally mattered more than the volume.'] }
