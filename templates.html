<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMS Toolkit Templates</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --purple: #667eea;
  --purple-dark: #764ba2;
  --ink: #1a1a2e;
  --muted: #6b7280;
  --border: #e5e7eb;
  --success: #059669;
  --gold: #d97706;
  --danger: #dc2626;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: #f8f7ff;
  color: var(--ink);
  min-height: 100vh;
}

/* ── PRINT BAR ── */
.print-bar {
  background: var(--ink);
  padding: 12px 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.print-bar-logo {
  font-family: 'Playfair Display', serif;
  font-size: 14px; font-weight: 900;
  color: white; letter-spacing: -0.3px;
}
.print-bar-logo span { color: var(--purple); }
.print-bar-actions { display: flex; gap: 10px; align-items: center; }
.print-btn {
  padding: 8px 20px;
  border-radius: 8px;
  font-size: 13px; font-weight: 700;
  cursor: pointer; border: none;
  font-family: 'DM Sans', sans-serif;
  transition: all .2s;
  display: flex; align-items: center; gap: 6px;
}
.print-btn-primary {
  background: linear-gradient(135deg, var(--purple), var(--purple-dark));
  color: white;
}
.print-btn-primary:hover { opacity: .9; transform: translateY(-1px); }
.print-btn-secondary {
  background: rgba(255,255,255,.1);
  color: rgba(255,255,255,.8);
  border: 1px solid rgba(255,255,255,.2);
}
.print-btn-secondary:hover { background: rgba(255,255,255,.15); }
.print-bar-badge {
  font-size: 11px; color: rgba(255,255,255,.5);
  padding: 4px 10px;
  background: rgba(255,255,255,.07);
  border-radius: 100px;
  border: 1px solid rgba(255,255,255,.1);
}

/* ── TEMPLATE WRAPPER ── */
.tmpl-wrap {
  max-width: 860px;
  margin: 32px auto;
  padding: 0 24px 60px;
}

/* ── TEMPLATE CARD ── */
.tmpl {
  background: white;
  border-radius: 16px;
  box-shadow: 0 4px 24px rgba(0,0,0,.08);
  overflow: hidden;
}

/* Template header */
.tmpl-header {
  padding: 32px 40px 28px;
  border-bottom: 2px solid var(--border);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
}
.tmpl-header-left { flex: 1; }
.tmpl-category {
  font-size: 10px; font-weight: 700;
  letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--purple); margin-bottom: 6px;
}
.tmpl-title {
  font-family: 'Playfair Display', serif;
  font-size: 22px; font-weight: 900;
  color: var(--ink); line-height: 1.2;
  margin-bottom: 6px;
}
.tmpl-subtitle {
  font-size: 13px; color: var(--muted); line-height: 1.6;
}
.tmpl-meta {
  display: flex; flex-direction: column;
  gap: 6px; flex-shrink: 0;
  text-align: right;
}
.tmpl-meta-item {
  font-size: 11px; color: var(--muted);
  display: flex; align-items: center;
  gap: 6px; justify-content: flex-end;
}
.tmpl-meta-item strong { color: var(--ink); }

/* Fill fields */
.tmpl-body { padding: 32px 40px; }

.field-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 16px;
}
.field-row-3 {
  grid-template-columns: 1fr 1fr 1fr;
}
.field-row-full { grid-template-columns: 1fr; }

.field-group { display: flex; flex-direction: column; gap: 6px; }
.field-label {
  font-size: 10px; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase;
  color: var(--muted);
}
.field-input {
  border: none;
  border-bottom: 2px solid var(--border);
  padding: 8px 0;
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  color: var(--ink);
  background: transparent;
  outline: none;
  width: 100%;
  transition: border-color .2s;
}
.field-input:focus { border-bottom-color: var(--purple); }
.field-input::placeholder { color: #d1d5db; }

.field-textarea {
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 13px;
  font-family: 'DM Sans', sans-serif;
  color: var(--ink);
  background: #fafafa;
  resize: vertical;
  min-height: 80px;
  outline: none;
  width: 100%;
  transition: border-color .2s;
  line-height: 1.6;
}
.field-textarea:focus { border-color: var(--purple); background: white; }
.field-textarea::placeholder { color: #d1d5db; }

/* Section dividers */
.tmpl-section {
  margin-bottom: 28px;
}
.tmpl-section-title {
  font-size: 13px; font-weight: 700;
  color: white;
  background: linear-gradient(135deg, var(--ink), #2d1b69);
  padding: 8px 16px;
  border-radius: 8px;
  margin-bottom: 16px;
  letter-spacing: .3px;
}
.tmpl-section-title.alt {
  background: linear-gradient(135deg, var(--purple), var(--purple-dark));
}
.tmpl-section-title.success {
  background: linear-gradient(135deg, #059669, #047857);
}
.tmpl-section-title.gold {
  background: linear-gradient(135deg, #d97706, #b45309);
}

/* Rating scale */
.rating-scale {
  display: flex; gap: 8px; align-items: center;
  flex-wrap: wrap; margin: 8px 0;
}
.rating-box {
  width: 40px; height: 40px;
  border-radius: 8px;
  border: 2px solid var(--border);
  display: flex; align-items: center;
  justify-content: center;
  font-size: 16px; font-weight: 800;
  color: var(--muted);
  cursor: pointer;
  transition: all .2s;
  flex-shrink: 0;
}
.rating-box:hover { border-color: var(--purple); color: var(--purple); }
.rating-label {
  font-size: 11px; color: var(--muted);
  line-height: 1.4; flex: 1;
}

/* Competency row */
.competency-row {
  display: grid;
  grid-template-columns: 2fr 1fr 3fr;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
  align-items: start;
}
.competency-row:last-child { border-bottom: none; }
.competency-name { font-size: 13px; font-weight: 600; color: var(--ink); }
.competency-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* Signature block */
.sig-block {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 24px;
  margin-top: 32px;
  padding-top: 24px;
  border-top: 2px solid var(--border);
}
.sig-line {
  border-bottom: 1.5px solid var(--ink);
  padding-bottom: 6px;
  margin-bottom: 6px;
  min-height: 36px;
}
.sig-label { font-size: 11px; color: var(--muted); font-weight: 600; }

/* Email template specific */
.email-meta {
  background: #f8f7ff;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 20px;
  margin-bottom: 20px;
}
.email-meta-row {
  display: flex; align-items: baseline;
  gap: 10px; padding: 4px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.email-meta-row:last-child { border-bottom: none; }
.email-meta-key {
  font-weight: 700; color: var(--muted);
  width: 60px; flex-shrink: 0;
  font-size: 11px; text-transform: uppercase;
  letter-spacing: .5px;
}
.email-meta-val {
  flex: 1; color: var(--ink);
}
.email-meta-val input {
  border: none; border-bottom: 1.5px solid var(--border);
  background: transparent; font-family: 'DM Sans', sans-serif;
  font-size: 13px; color: var(--ink); width: 100%;
  outline: none; padding: 2px 0;
}

.email-body {
  font-size: 14px; line-height: 1.85;
  color: #374151;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 24px;
  background: white;
  min-height: 320px;
}
.email-body p { margin-bottom: 14px; }
.email-body p:last-child { margin-bottom: 0; }
.email-placeholder {
  display: inline-block;
  background: #fef3c7;
  border: 1px dashed #f59e0b;
  border-radius: 4px;
  padding: 1px 6px;
  font-size: 12px; font-weight: 700;
  color: #92400e;
}

/* Agenda specific */
.agenda-item {
  display: flex; gap: 16px;
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
  align-items: flex-start;
}
.agenda-item:last-child { border-bottom: none; }
.agenda-time {
  font-size: 12px; font-weight: 700;
  color: var(--purple);
  min-width: 56px;
  padding-top: 2px;
  flex-shrink: 0;
}
.agenda-content { flex: 1; }
.agenda-title { font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
.agenda-notes { font-size: 12px; color: var(--muted); line-height: 1.6; }
.agenda-owner {
  font-size: 11px; font-weight: 700;
  color: white; background: var(--purple);
  padding: 2px 8px; border-radius: 100px;
  white-space: nowrap; flex-shrink: 0;
  margin-top: 2px;
}

/* Checklist specific */
.check-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.check-item:last-child { border-bottom: none; }
.check-box-print {
  width: 18px; height: 18px;
  border: 2px solid var(--border);
  border-radius: 4px;
  flex-shrink: 0;
  margin-top: 2px;
}
.check-text { font-size: 13px; color: #374151; line-height: 1.6; flex: 1; }
.check-text strong { color: var(--ink); }

/* Tracker table */
.tracker-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.tracker-table th {
  padding: 10px 12px;
  text-align: left;
  font-size: 10px; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase;
  color: white;
  background: linear-gradient(135deg, var(--ink), #2d1b69);
}
.tracker-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.tracker-table tr:nth-child(even) td { background: #fafafa; }
.tracker-table tr:hover td { background: #f0f4ff; }
.tracker-input {
  border: none; background: transparent;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px; color: var(--ink);
  width: 100%; outline: none;
  border-bottom: 1px dashed var(--border);
  padding: 2px 0;
}

/* Not found */
.tmpl-notfound {
  text-align: center; padding: 80px 40px;
  background: white;
  border-radius: 16px;
}
.tmpl-notfound-icon { font-size: 48px; margin-bottom: 16px; }
.tmpl-notfound-title {
  font-family: 'Playfair Display', serif;
  font-size: 24px; font-weight: 700;
  margin-bottom: 8px;
}
.tmpl-notfound-sub { font-size: 14px; color: var(--muted); }

/* ── PRINT STYLES ── */
@media print {
  .print-bar { display: none !important; }
  body { background: white; }
  .tmpl-wrap { margin: 0; padding: 0; max-width: 100%; }
  .tmpl { box-shadow: none; border-radius: 0; }
  @page { margin: 20mm; }
}
</style>
</head>
<body>

<div class="print-bar">
  <div class="print-bar-logo">PMS <span>Toolkit</span></div>
  <div class="print-bar-actions">
    <span class="print-bar-badge" id="tmpl-badge">Template</span>
    <button class="print-btn print-btn-secondary" onclick="window.history.back()">← Back</button>
    <button class="print-btn print-btn-primary" onclick="window.print()">⬇️ Save as PDF</button>
  </div>
</div>

<div class="tmpl-wrap">
  <div id="tmpl-root"></div>
</div>

<script>
// ═══════════════════════════════════════════════
// TEMPLATE DEFINITIONS
// ═══════════════════════════════════════════════
var TEMPLATES = {

  // ── CATEGORY 1: PERFORMANCE REVIEW FORMS ──

  'self-assessment': {
    category: 'Performance Review Forms',
    title: 'Employee Self-Assessment',
    subtitle: 'Annual / Mid-Year Review · To be completed by the employee before the manager review conversation',
    meta: [
      { label: 'Format', value: 'Fillable Form' },
      { label: 'Time', value: '~30 mins to complete' },
      { label: 'Tone', value: 'Reflective' },
    ],
    render: function() {
      return `
      <div class="tmpl-body">
        <div class="field-row">
          <div class="field-group"><div class="field-label">Employee Name</div><input class="field-input" placeholder="Full name"></div>
          <div class="field-group"><div class="field-label">Role & Level</div><input class="field-input" placeholder="e.g. Senior Product Manager, L4"></div>
        </div>
        <div class="field-row">
          <div class="field-group"><div class="field-label">Department</div><input class="field-input" placeholder="e.g. Product"></div>
          <div class="field-group"><div class="field-label">Review Period</div><input class="field-input" placeholder="e.g. Jan–Dec 2025"></div>
        </div>
        <div class="field-row">
          <div class="field-group"><div class="field-label">Manager</div><input class="field-input" placeholder="Manager's name"></div>
          <div class="field-group"><div class="field-label">Date Submitted</div><input class="field-input" placeholder="DD/MM/YYYY"></div>
        </div>

        <div class="tmpl-section">
          <div class="tmpl-section-title">Part 1 — Goal & OKR Achievement</div>
          <div class="field-group" style="margin-bottom:16px">
            <div class="field-label">List your 3–5 primary goals/OKRs for this period and rate your achievement</div>
          </div>
          ${[1,2,3,4,5].map(i => `
          <div style="background:#f8f7ff;border-radius:10px;padding:16px;margin-bottom:12px;border-left:3px solid var(--purple)">
            <div class="field-row">
              <div class="field-group"><div class="field-label">Goal / OKR ${i}</div><input class="field-input" placeholder="Describe the goal or key result"></div>
              <div class="field-group"><div class="field-label">Achievement Status</div>
                <select class="field-input" style="cursor:pointer">
                  <option value="">Select...</option>
                  <option>✅ Fully achieved</option>
                  <option>⚡ Partially achieved</option>
                  <option>❌ Not achieved</option>
                  <option>➡️ Ongoing / rolled over</option>
                </select>
              </div>
            </div>
            <div class="field-group"><div class="field-label">Key evidence and impact</div><textarea class="field-textarea" placeholder="What specific outcomes did you deliver? What was the measurable impact?" style="min-height:60px"></textarea></div>
          </div>`).join('')}
        </div>

        <div class="tmpl-section">
          <div class="tmpl-section-title alt">Part 2 — Competency Self-Rating</div>
          <p style="font-size:12px;color:var(--muted);margin-bottom:16px">Rate yourself 1–5 on each competency. 1 = Developing, 3 = Meets expectations, 5 = Outstanding. Be honest — this is a starting point for the conversation with your manager.</p>
          ${[
            ['Delivery & Results', 'Consistently delivers on commitments, meets deadlines, achieves targets'],
            ['Communication', 'Communicates clearly and proactively with team, manager, and stakeholders'],
            ['Collaboration & Teamwork', 'Contributes positively to team goals, supports colleagues, builds trust'],
            ['Problem Solving', 'Identifies issues, proposes solutions, thinks through implications'],
            ['Growth & Learning', 'Actively develops skills, seeks feedback, applies learning to work'],
            ['Leadership & Influence', 'Influences outcomes, takes initiative, supports others\' growth'],
          ].map(([name, desc]) => `
          <div class="competency-row">
            <div><div class="competency-name">${name}</div><div class="competency-sub">${desc}</div></div>
            <div class="rating-scale" style="justify-content:center">
              ${[1,2,3,4,5].map(r => `<div class="rating-box">${r}</div>`).join('')}
            </div>
            <textarea class="field-textarea" placeholder="Specific examples and evidence..." style="min-height:60px"></textarea>
          </div>`).join('')}
        </div>

        <div class="tmpl-section">
          <div class="tmpl-section-title success">Part 3 — Highlights & Development</div>
          <div class="field-group" style="margin-bottom:16px">
            <div class="field-label">What are you most proud of this period? (2–3 specific achievements)</div>
            <textarea class="field-textarea" placeholder="Describe your most significant contributions and why they mattered..."></textarea>
          </div>
          <div class="field-group" style="margin-bottom:16px">
            <div class="field-label">What would you do differently? What were your learning moments?</div>
            <textarea class="field-textarea" placeholder="Be honest about challenges, mistakes, and what you learned from them..."></textarea>
          </div>
          <div class="field-group" style="margin-bottom:16px">
            <div class="field-label">What are your top 2–3 development priorities for the next period?</div>
            <textarea class="field-textarea" placeholder="Specific skills, experiences, or behaviours you want to develop..."></textarea>
          </div>
          <div class="field-group" style="margin-bottom:16px">
            <div class="field-label">What support do you need from your manager to succeed?</div>
            <textarea class="field-textarea" placeholder="Resources, time, exposure, coaching, feedback..."></textarea>
          </div>
          <div class="field-group">
            <div class="field-label">What are your career goals for the next 1–2 years?</div>
            <textarea class="field-textarea" placeholder="Where do you want to be? What roles or skills are you building toward?"></textarea>
          </div>
        </div>

        <div class="tmpl-section">
          <div class="tmpl-section-title gold">Part 4 — Overall Self-Rating</div>
          <div style="display:flex;gap:16px;align-items:center;margin-bottom:16px;flex-wrap:wrap">
            <div style="font-size:13px;font-weight:600;color:var(--ink)">Overall performance rating (1–5):</div>
            <div class="rating-scale">
              ${[1,2,3,4,5].map(r => `<div class="rating-box">${r}</div>`).join('')}
            </div>
          </div>
          <div class="field-group">
            <div class="field-label">Rationale for your overall rating</div>
            <textarea class="field-textarea" placeholder="Summarise why you've given yourself this rating, referencing your goals and competency scores above..."></textarea>
          </div>
        </div>

        <div class="sig-block">
          <div><div class="sig-line"></div><div class="sig-label">Employee Signature</div></div>
          <div><div class="sig-line"></div><div class="sig-label">Date</div></div>
          <div><div class="sig-line"></div><div class="sig-label">Employee ID / Role</div></div>
        </div>
      </div>`;
    }
  },

  'manager-review-5pt': {
    category: 'Performance Review Forms',
    title: 'Manager Review Form — 5-Point Scale',
    subtitle: 'To be completed by the line manager after receiving the employee\'s self-assessment',
    meta: [
      { label: 'Scale', value: '1–5 Rating' },
      { label: 'Time', value: '~45 mins per employee' },
      { label: 'Tone', value: 'Formal' },
    ],
    render: function() {
      return `
      <div class="tmpl-body">
        <div class="field-row">
          <div class="field-group"><div class="field-label">Employee Name</div><input class="field-input" placeholder="Full name"></div>
          <div class="field-group"><div class="field-label">Role & Level</div><input class="field-input" placeholder="e.g. Senior Engineer, L5"></div>
        </div>
        <div class="field-row">
          <div class="field-group"><div class="field-label">Department</div><input class="field-input" placeholder="Department name"></div>
          <div class="field-group"><div class="field-label">Review Period</div><input class="field-input" placeholder="e.g. Jan–Dec 2025"></div>
        </div>
        <div class="field-row">
          <div class="field-group"><div class="field-label">Manager Name</div><input class="field-input" placeholder="Your full name"></div>
          <div class="field-group"><div class="field-label">Date Completed</div><input class="field-input" placeholder="DD/MM/YYYY"></div>
        </div>

        <div style="background:#f0f4ff;border-radius:10px;padding:16px;margin-bottom:24px;font-size:12px;line-height:1.7;color:#374151;border-left:4px solid var(--purple)">
          <strong style="display:block;margin-bottom:4px;color:var(--purple)">Rating Scale Guide</strong>
          <strong>5 — Outstanding:</strong> Consistently exceeds all expectations; role model behaviour; significant impact beyond role scope<br>
          <strong>4 — Exceeds Expectations:</strong> Regularly delivers above what is required; proactive and high-impact<br>
          <strong>3 — Meets Expectations:</strong> Reliably delivers on all core responsibilities; solid, dependable contributor<br>
          <strong>2 — Below Expectations:</strong> Inconsistent delivery; some key responsibilities not met; requires active support<br>
          <strong>1 — Unsatisfactory:</strong> Significant performance gap; formal improvement plan required
        </div>

        <div class="tmpl-section">
          <div class="tmpl-section-title">Part 1 — Goal Achievement Assessment</div>
          ${[1,2,3].map(i => `
          <div style="background:#f8f7ff;border-radius:10px;padding:16px;margin-bottom:12px">
            <div class="field-row">
              <div class="field-group"><div class="field-label">Goal / OKR ${i}</div><input class="field-input" placeholder="State the goal as originally set"></div>
              <div class="field-group"><div class="field-label">Manager Assessment</div>
                <select class="field-input" style="cursor:pointer">
                  <option>✅ Fully achieved</option>
                  <option>⚡ Partially achieved</option>
                  <option>❌ Not achieved</option>
                </select>
              </div>
            </div>
            <div class="field-group"><div class="field-label">Manager's observations and evidence</div><textarea class="field-textarea" style="min-height:60px" placeholder="Specific instances, outcomes, and evidence supporting your assessment..."></textarea></div>
          </div>`).join('')}
        </div>

        <div class="tmpl-section">
          <div class="tmpl-section-title alt">Part 2 — Competency Ratings</div>
          ${[
            ['Delivery & Results', 'Quality of output, deadline adherence, target achievement'],
            ['Communication', 'Clarity, proactivity, stakeholder management, written and verbal'],
            ['Collaboration', 'Team contribution, cross-functional working, relationship building'],
            ['Problem Solving', 'Analytical thinking, solution quality, handling ambiguity'],
            ['Growth Mindset', 'Learning agility, receptiveness to feedback, continuous improvement'],
            ['Leadership & Impact', 'Influence, initiative, developing others, role modelling'],
          ].map(([name, desc]) => `
          <div class="competency-row">
            <div><div class="competency-name">${name}</div><div class="competency-sub">${desc}</div></div>
            <div>
              <div class="rating-scale" style="justify-content:center">
                ${[1,2,3,4,5].map(r => `<div class="rating-box">${r}</div>`).join('')}
              </div>
            </div>
            <textarea class="field-textarea" style="min-height:60px" placeholder="Specific behavioural examples supporting this rating..."></textarea>
          </div>`).join('')}
        </div>

        <div class="tmpl-section">

  var params = new URLSearchParams(window.location.search);
  return params.get(name) || '';
}

function boot() {
  var id = getParam('id');
  var tmpl = TEMPLATES[id];
  var root = document.getElementById('tmpl-root');
  var badge = document.getElementById('tmpl-badge');

  if (!tmpl) {
    if(badge) badge.textContent = 'Not Found';
    root.innerHTML = `
      <div class="tmpl-notfound">
        <div class="tmpl-notfound-icon">📄</div>
        <div class="tmpl-notfound-title">Template Not Found</div>
        <div class="tmpl-notfound-sub">The template you're looking for doesn't exist. Go back to the Templates page to browse all 25 templates.</div>
      </div>`;
    return;
  }

  document.title = tmpl.title + ' — PMS Toolkit Templates';
  if(badge) badge.textContent = tmpl.category;

  root.innerHTML = `
    <div class="tmpl">
      <div class="tmpl-header">
        <div class="tmpl-header-left">
          <div class="tmpl-category">${tmpl.category}</div>
          <div class="tmpl-title">${tmpl.title}</div>
          <div class="tmpl-subtitle">${tmpl.subtitle}</div>
        </div>
        <div class="tmpl-meta">
          ${(tmpl.meta||[]).map(m => `
          <div class="tmpl-meta-item">
            <span>${m.label}:</span><strong>${m.value}</strong>
          </div>`).join('')}
        </div>
      </div>
      ${tmpl.render()}
    </div>`;
}

if(document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
</body>
</html>
