<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMS Toolkit Templates</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --purple: #667eea;
  --purple-dark: #764ba2;
  --ink: #1a1a2e;
  --muted: #6b7280;
  --border: #e5e7eb;
  --success: #059669;
  --gold: #d97706;
  --danger: #dc2626;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: #f8f7ff;
  color: var(--ink);
  min-height: 100vh;
}

/* ── PRINT BAR ── */
.print-bar {
  background: var(--ink);
  padding: 12px 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.print-bar-logo {
  font-family: 'Playfair Display', serif;
  font-size: 14px; font-weight: 900;
  color: white; letter-spacing: -0.3px;
}
.print-bar-logo span { color: var(--purple); }
.print-bar-actions { display: flex; gap: 10px; align-items: center; }
.print-btn {
  padding: 8px 20px;
  border-radius: 8px;
  font-size: 13px; font-weight: 700;
  cursor: pointer; border: none;
  font-family: 'DM Sans', sans-serif;
  transition: all .2s;
  display: flex; align-items: center; gap: 6px;
}
.print-btn-primary {
  background: linear-gradient(135deg, var(--purple), var(--purple-dark));
  color: white;
}
.print-btn-primary:hover { opacity: .9; transform: translateY(-1px); }
.print-btn-secondary {
  background: rgba(255,255,255,.1);
  color: rgba(255,255,255,.8);
  border: 1px solid rgba(255,255,255,.2);
}
.print-btn-secondary:hover { background: rgba(255,255,255,.15); }
.print-bar-badge {
  font-size: 11px; color: rgba(255,255,255,.5);
  padding: 4px 10px;
  background: rgba(255,255,255,.07);
  border-radius: 100px;
  border: 1px solid rgba(255,255,255,.1);
}

/* ── TEMPLATE WRAPPER ── */
.tmpl-wrap {
  max-width: 860px;
  margin: 32px auto;
  padding: 0 24px 60px;
}

/* ── TEMPLATE CARD ── */
.tmpl {
  background: white;
  border-radius: 16px;
  box-shadow: 0 4px 24px rgba(0,0,0,.08);
  overflow: hidden;
}

/* Template header */
.tmpl-header {
  padding: 32px 40px 28px;
  border-bottom: 2px solid var(--border);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
}
.tmpl-header-left { flex: 1; }
.tmpl-category {
  font-size: 10px; font-weight: 700;
  letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--purple); margin-bottom: 6px;
}
.tmpl-title {
  font-family: 'Playfair Display', serif;
  font-size: 22px; font-weight: 900;
  color: var(--ink); line-height: 1.2;
  margin-bottom: 6px;
}
.tmpl-subtitle {
  font-size: 13px; color: var(--muted); line-height: 1.6;
}
.tmpl-meta {
  display: flex; flex-direction: column;
  gap: 6px; flex-shrink: 0;
  text-align: right;
}
.tmpl-meta-item {
  font-size: 11px; color: var(--muted);
  display: flex; align-items: center;
  gap: 6px; justify-content: flex-end;
}
.tmpl-meta-item strong { color: var(--ink); }

/* Fill fields */
.tmpl-body { padding: 32px 40px; }

.field-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 16px;
}
.field-row-3 {
  grid-template-columns: 1fr 1fr 1fr;
}
.field-row-full { grid-template-columns: 1fr; }

.field-group { display: flex; flex-direction: column; gap: 6px; }
.field-label {
  font-size: 10px; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase;
  color: var(--muted);
}
.field-input {
  border: none;
  border-bottom: 2px solid var(--border);
  padding: 8px 0;
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  color: var(--ink);
  background: transparent;
  outline: none;
  width: 100%;
  transition: border-color .2s;
}
.field-input:focus { border-bottom-color: var(--purple); }
.field-input::placeholder { color: #d1d5db; }

.field-textarea {
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 13px;
  font-family: 'DM Sans', sans-serif;
  color: var(--ink);
  background: #fafafa;
  resize: vertical;
  min-height: 80px;
  outline: none;
  width: 100%;
  transition: border-color .2s;
  line-height: 1.6;
}
.field-textarea:focus { border-color: var(--purple); background: white; }
.field-textarea::placeholder { color: #d1d5db; }

/* Section dividers */
.tmpl-section {
  margin-bottom: 28px;
}
.tmpl-section-title {
  font-size: 13px; font-weight: 700;
  color: white;
  background: linear-gradient(135deg, var(--ink), #2d1b69);
  padding: 8px 16px;
  border-radius: 8px;
  margin-bottom: 16px;
  letter-spacing: .3px;
}
.tmpl-section-title.alt {
  background: linear-gradient(135deg, var(--purple), var(--purple-dark));
}
.tmpl-section-title.success {
  background: linear-gradient(135deg, #059669, #047857);
}
.tmpl-section-title.gold {
  background: linear-gradient(135deg, #d97706, #b45309);
}

/* Rating scale */
.rating-scale {
  display: flex; gap: 8px; align-items: center;
  flex-wrap: wrap; margin: 8px 0;
}
.rating-box {
  width: 40px; height: 40px;
  border-radius: 8px;
  border: 2px solid var(--border);
  display: flex; align-items: center;
  justify-content: center;
  font-size: 16px; font-weight: 800;
  color: var(--muted);
  cursor: pointer;
  transition: all .2s;
  flex-shrink: 0;
}
.rating-box:hover { border-color: var(--purple); color: var(--purple); }
.rating-label {
  font-size: 11px; color: var(--muted);
  line-height: 1.4; flex: 1;
}

/* Competency row */
.competency-row {
  display: grid;
  grid-template-columns: 2fr 1fr 3fr;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
  align-items: start;
}
.competency-row:last-child { border-bottom: none; }
.competency-name { font-size: 13px; font-weight: 600; color: var(--ink); }
.competency-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* Signature block */
.sig-block {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 24px;
  margin-top: 32px;
  padding-top: 24px;
  border-top: 2px solid var(--border);
}
.sig-line {
  border-bottom: 1.5px solid var(--ink);
  padding-bottom: 6px;
  margin-bottom: 6px;
  min-height: 36px;
}
.sig-label { font-size: 11px; color: var(--muted); font-weight: 600; }

/* Email template specific */
.email-meta {
  background: #f8f7ff;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 20px;
  margin-bottom: 20px;
}
.email-meta-row {
  display: flex; align-items: baseline;
  gap: 10px; padding: 4px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.email-meta-row:last-child { border-bottom: none; }
.email-meta-key {
  font-weight: 700; color: var(--muted);
  width: 60px; flex-shrink: 0;
  font-size: 11px; text-transform: uppercase;
  letter-spacing: .5px;
}
.email-meta-val {
  flex: 1; color: var(--ink);
}
.email-meta-val input {
  border: none; border-bottom: 1.5px solid var(--border);
  background: transparent; font-family: 'DM Sans', sans-serif;
  font-size: 13px; color: var(--ink); width: 100%;
  outline: none; padding: 2px 0;
}

.email-body {
  font-size: 14px; line-height: 1.85;
  color: #374151;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 24px;
  background: white;
  min-height: 320px;
}
.email-body p { margin-bottom: 14px; }
.email-body p:last-child { margin-bottom: 0; }
.email-placeholder {
  display: inline-block;
  background: #fef3c7;
  border: 1px dashed #f59e0b;
  border-radius: 4px;
  padding: 1px 6px;
  font-size: 12px; font-weight: 700;
  color: #92400e;
}

/* Agenda specific */
.agenda-item {
  display: flex; gap: 16px;
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
  align-items: flex-start;
}
.agenda-item:last-child { border-bottom: none; }
.agenda-time {
  font-size: 12px; font-weight: 700;
  color: var(--purple);
  min-width: 56px;
  padding-top: 2px;
  flex-shrink: 0;
}
.agenda-content { flex: 1; }
.agenda-title { font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
.agenda-notes { font-size: 12px; color: var(--muted); line-height: 1.6; }
.agenda-owner {
  font-size: 11px; font-weight: 700;
  color: white; background: var(--purple);
  padding: 2px 8px; border-radius: 100px;
  white-space: nowrap; flex-shrink: 0;
  margin-top: 2px;
}

/* Checklist specific */
.check-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.check-item:last-child { border-bottom: none; }
.check-box-print {
  width: 18px; height: 18px;
  border: 2px solid var(--border);
  border-radius: 4px;
  flex-shrink: 0;
  margin-top: 2px;
}
.check-text { font-size: 13px; color: #374151; line-height: 1.6; flex: 1; }
.check-text strong { color: var(--ink); }

/* Tracker table */
.tracker-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.tracker-table th {
  padding: 10px 12px;
  text-align: left;
  font-size: 10px; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase;
  color: white;
  background: linear-gradient(135deg, var(--ink), #2d1b69);
}
.tracker-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.tracker-table tr:nth-child(even) td { background: #fafafa; }
.tracker-table tr:hover td { background: #f0f4ff; }
.tracker-input {
  border: none; background: transparent;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px; color: var(--ink);
  width: 100%; outline: none;
  border-bottom: 1px dashed var(--border);
  padding: 2px 0;
}

/* Not found */
.tmpl-notfound {
  text-align: center; padding: 80px 40px;
  background: white;
  border-radius: 16px;
}
.tmpl-notfound-icon { font-size: 48px; margin-bottom: 16px; }
.tmpl-notfound-title {
  font-family: 'Playfair Display', serif;
  font-size: 24px; font-weight: 700;
  margin-bottom: 8px;
}
.tmpl-notfound-sub { font-size: 14px; color: var(--muted); }

/* ── PRINT STYLES ── */
@media print {
  .print-bar { display: none !important; }
  body { background: white; }
  .tmpl-wrap { margin: 0; padding: 0; max-width: 100%; }
  .tmpl { box-shadow: none; border-radius: 0; }
  @page { margin: 20mm; }
}
</style>
</head>
<body>

<div class="print-bar">
  <div class="print-bar-logo">PMS <span>Toolkit</span></div>
  <div class="print-bar-actions">
    <span class="print-bar-badge" id="tmpl-badge">Template</span>
    <button class="print-btn print-btn-secondary" onclick="window.history.back()">← Back</button>
    <button class="print-btn print-btn-primary" onclick="window.print()">⬇️ Save as PDF</button>
  </div>
</div>

<div class="tmpl-wrap">
  <div id="tmpl-root"></div>
</div>

<script>
// ═══════════════════════════════════════════════
// TEMPLATE DEFINITIONS
// ═══════════════════════════════════════════════
var TEMPLATES = {

  'self-assessment': {
    category: 'Performance Review Forms',
    title: 'Employee Self-Assessment',
    subtitle: 'Annual / Mid-Year Review · To be completed by the employee before the manager review conversation',
    meta: [
      { label: 'Format', value: 'Fillable Form' },
      { label: 'Time', value: '~30 mins to complete' },
      { label: 'Tone', value: 'Reflective' },
    ],
    render: function() {
      return `
      <div class="tmpl-body">
        <div class="field-row">
          <div class="field-group"><div class="field-label">Employee Name</div><input class="field-input" placeholder="Full name"></div>
          <div class="field-group"><div class="field-label">Role & Level</div><input class="field-input" placeholder="e.g. Senior Product Manager, L4"></div>
        </div>
        <div class="field-row">
          <div class="field-group"><div class="field-label">Department</div><input class="field-input" placeholder="e.g. Product"></div>
          <div class="field-group"><div class="field-label">Review Period</div><input class="field-input" placeholder="e.g. Jan–Dec 2025"></div>
        </div>
        <div class="field-row">
          <div class="field-group"><div class="field-label">Manager</div><input class="field-input" placeholder="Manager's name"></div>
          <div class="field-group"><div class="field-label">Date Submitted</div><input class="field-input" placeholder="DD/MM/YYYY"></div>
        </div>

        <div class="tmpl-section">
          <div class="tmpl-section-title">Part 1 — Goal & OKR Achievement</div>
          <div class="field-group" style="margin-bottom:16px">
            <div class="field-label">List your 3–5 primary goals/OKRs for this period and rate your achievement</div>
          </div>
          ${[1,2,3,4,5].map(i => `
          <div style="background:#f8f7ff;border-radius:10px;padding:16px;margin-bottom:12px;border-left:3px solid var(--purple)">
            <div class="field-row">
              <div class="field-group"><div class="field-label">Goal / OKR ${i}</div><input class="field-input" placeholder="Describe the goal or key result"></div>
              <div class="field-group"><div class="field-label">Achievement Status</div>
                <select class="field-input" style="cursor:pointer">
                  <option value="">Select...</option>
                  <option>✅ Fully achieved</option>
                  <option>⚡ Partially achieved</option>
                  <option>❌ Not achieved</option>
                  <option>➡️ Ongoing / rolled over</option>
                </select>
              </div>
            </div>
            <div class="field-group"><div class="field-label">Key evidence and impact</div><textarea class="field-textarea" placeholder="What specific outcomes did you deliver? What was the measurable impact?" style="min-height:60px"></textarea></div>
          </div>`).join('')}
        </div>

        <div class="tmpl-section">
          <div class="tmpl-section-title alt">Part 2 — Competency Self-Rating</div>
          <p style="font-size:12px;color:var(--muted);margin-bottom:16px">Rate yourself 1–5 on each competency. 1 = Developing, 3 = Meets expectations, 5 = Outstanding. Be honest — this is a starting point for the conversation with your manager.</p>
          ${[
            ['Delivery & Results', 'Consistently delivers on commitments, meets deadlines, achieves targets'],
            ['Communication', 'Communicates clearly and proactively with team, manager, and stakeholders'],
            ['Collaboration & Teamwork', 'Contributes positively to team goals, supports colleagues, builds trust'],
            ['Problem Solving', 'Identifies issues, proposes solutions, thinks through implications'],
            ['Growth & Learning', 'Actively develops skills, seeks feedback, applies learning to work'],
            ['Leadership & Influence', 'Influences outcomes, takes initiative, supports others\' growth'],
          ].map(([name, desc]) => `
          <div class="competency-row">
            <div><div class="competency-name">${name}</div><div class="competency-sub">${desc}</div></div>
            <div class="rating-scale" style="justify-content:center">
              ${[1,2,3,4,5].map(r => `<div class="rating-box">${r}</div>`).join('')}
            </div>
            <textarea class="field-textarea" placeholder="Specific examples and evidence..." style="min-height:60px"></textarea>
          </div>`).join('')}
        </div>

        <div class="tmpl-section">
          <div class="tmpl-section-title success">Part 3 — Highlights & Development</div>
          <div class="field-group" style="margin-bottom:16px">
            <div class="field-label">What are you most proud of this period? (2–3 specific achievements)</div>
            <textarea class="field-textarea" placeholder="Describe your most significant contributions and why they mattered..."></textarea>
          </div>
          <div class="field-group" style="margin-bottom:16px">
            <div class="field-label">What would you do differently? What were your learning moments?</div>
            <textarea class="field-textarea" placeholder="Be honest about challenges, mistakes, and what you learned from them..."></textarea>
          </div>
          <div class="field-group" style="margin-bottom:16px">
            <div class="field-label">What are your top 2–3 development priorities for the next period?</div>
            <textarea class="field-textarea" placeholder="Specific skills, experiences, or behaviours you want to develop..."></textarea>
          </div>
          <div class="field-group" style="margin-bottom:16px">
            <div class="field-label">What support do you need from your manager to succeed?</div>
            <textarea class="field-textarea" placeholder="Resources, time, exposure, coaching, feedback..."></textarea>
          </div>
          <div class="field-group">
            <div class="field-label">What are your career goals for the next 1–2 years?</div>
            <textarea class="field-textarea" placeholder="Where do you want to be? What roles or skills are you building toward?"></textarea>
          </div>
        </div>

        <div class="tmpl-section">
          <div class="tmpl-section-title gold">Part 4 — Overall Self-Rating</div>
          <div style="display:flex;gap:16px;align-items:center;margin-bottom:16px;flex-wrap:wrap">
            <div style="font-size:13px;font-weight:600;color:var(--ink)">Overall performance rating (1–5):</div>
            <div class="rating-scale">
              ${[1,2,3,4,5].map(r => `<div class="rating-box">${r}</div>`).join('')}
            </div>
          </div>
          <div class="field-group">
            <div class="field-label">Rationale for your overall rating</div>
            <textarea class="field-textarea" placeholder="Summarise why you've given yourself this rating, referencing your goals and competency scores above..."></textarea>
          </div>
        </div>

        <div class="sig-block">
          <div><div class="sig-line"></div><div class="sig-label">Employee Signature</div></div>
          <div><div class="sig-line"></div><div class="sig-label">Date</div></div>
          <div><div class="sig-line"></div><div class="sig-label">Employee ID / Role</div></div>
        </div>
      </div>`;
    }
  },

  'manager-review-5pt': {
    category: 'Performance Review Forms',
    title: 'Manager Review Form — 5-Point Scale',
    subtitle: 'To be completed by the line manager after receiving the employee\'s self-assessment',
    meta: [
      { label: 'Scale', value: '1–5 Rating' },
      { label: 'Time', value: '~45 mins per employee' },
      { label: 'Tone', value: 'Formal' },
    ],
    render: function() {
      return `
      <div class="tmpl-body">
        <div class="field-row">
          <div class="field-group"><div class="field-label">Employee Name</div><input class="field-input" placeholder="Full name"></div>
          <div class="field-group"><div class="field-label">Role & Level</div><input class="field-input" placeholder="e.g. Senior Engineer, L5"></div>
        </div>
        <div class="field-row">
          <div class="field-group"><div class="field-label">Department</div><input class="field-input" placeholder="Department name"></div>
          <div class="field-group"><div class="field-label">Review Period</div><input class="field-input" placeholder="e.g. Jan–Dec 2025"></div>
        </div>
        <div class="field-row">
          <div class="field-group"><div class="field-label">Manager Name</div><input class="field-input" placeholder="Your full name"></div>
          <div class="field-group"><div class="field-label">Date Completed</div><input class="field-input" placeholder="DD/MM/YYYY"></div>
        </div>

        <div style="background:#f0f4ff;border-radius:10px;padding:16px;margin-bottom:24px;font-size:12px;line-height:1.7;color:#374151;border-left:4px solid var(--purple)">
          <strong style="display:block;margin-bottom:4px;color:var(--purple)">Rating Scale Guide</strong>
          <strong>5 — Outstanding:</strong> Consistently exceeds all expectations; role model behaviour; significant impact beyond role scope<br>
          <strong>4 — Exceeds Expectations:</strong> Regularly delivers above what is required; proactive and high-impact<br>
          <strong>3 — Meets Expectations:</strong> Reliably delivers on all core responsibilities; solid, dependable contributor<br>
          <strong>2 — Below Expectations:</strong> Inconsistent delivery; some key responsibilities not met; requires active support<br>
          <strong>1 — Unsatisfactory:</strong> Significant performance gap; formal improvement plan required
        </div>

        <div class="tmpl-section">
          <div class="tmpl-section-title">Part 1 — Goal Achievement Assessment</div>
          ${[1,2,3].map(i => `
          <div style="background:#f8f7ff;border-radius:10px;padding:16px;margin-bottom:12px">
            <div class="field-row">
              <div class="field-group"><div class="field-label">Goal / OKR ${i}</div><input class="field-input" placeholder="State the goal as originally set"></div>
              <div class="field-group"><div class="field-label">Manager Assessment</div>
                <select class="field-input" style="cursor:pointer">
                  <option>✅ Fully achieved</option>
                  <option>⚡ Partially achieved</option>
                  <option>❌ Not achieved</option>
                </select>
              </div>
            </div>
            <div class="field-group"><div class="field-label">Manager's observations and evidence</div><textarea class="field-textarea" style="min-height:60px" placeholder="Specific instances, outcomes, and evidence supporting your assessment..."></textarea></div>
          </div>`).join('')}
        </div>

        <div class="tmpl-section">
          <div class="tmpl-section-title alt">Part 2 — Competency Ratings</div>
          ${[
            ['Delivery & Results', 'Quality of output, deadline adherence, target achievement'],
            ['Communication', 'Clarity, proactivity, stakeholder management, written and verbal'],
            ['Collaboration', 'Team contribution, cross-functional working, relationship building'],
            ['Problem Solving', 'Analytical thinking, solution quality, handling ambiguity'],
            ['Growth Mindset', 'Learning agility, receptiveness to feedback, continuous improvement'],
            ['Leadership & Impact', 'Influence, initiative, developing others, role modelling'],
          ].map(([name, desc]) => `
          <div class="competency-row">
            <div><div class="competency-name">${name}</div><div class="competency-sub">${desc}</div></div>
            <div>
              <div class="rating-scale" style="justify-content:center">
                ${[1,2,3,4,5].map(r => `<div class="rating-box">${r}</div>`).join('')}
              </div>
            </div>
            <textarea class="field-textarea" style="min-height:60px" placeholder="Specific behavioural examples supporting this rating..."></textarea>
          </div>`).join('')}
        </div>

        <div class="tmpl-section">
          <div class="tmpl-section-title success">Part 3 — Development & Forward Look</div>
          <div class="field-group" style="margin-bottom:16px">
            <div class="field-label">Key strengths to build on (2–3 specific observations)</div>
            <textarea class="field-textarea" placeholder="What should this employee continue and amplify?"></textarea>
          </div>
          <div class="field-group" style="margin-bottom:16px">
            <div class="field-label">Priority development areas for next period (1–2 specific)</div>
            <textarea class="field-textarea" placeholder="What needs to change or improve? What specific behaviours?"></textarea>
          </div>
          <div class="field-group" style="margin-bottom:16px">
            <div class="field-label">Agreed development actions for next period</div>
            <textarea class="field-textarea" placeholder="Specific actions, opportunities, or training agreed with the employee..."></textarea>
          </div>
          <div class="field-group">
            <div class="field-label">Promotion readiness assessment</div>
            <select class="field-input" style="cursor:pointer;margin-bottom:10px">
              <option>Ready now — recommend for promotion this cycle</option>
              <option>Ready in 6–12 months — on track</option>
              <option>Ready in 12–24 months — longer development needed</option>
              <option>Not ready — focused on performance in current role</option>
            </select>
            <textarea class="field-textarea" placeholder="Rationale for readiness assessment..."></textarea>
          </div>
        </div>

        <div class="tmpl-section">
          <div class="tmpl-section-title gold">Part 4 — Overall Rating & Recommendation</div>
          <div style="display:flex;gap:16px;align-items:center;margin-bottom:16px;flex-wrap:wrap">
            <div style="font-size:13px;font-weight:600">Overall performance rating (1–5):</div>
            <div class="rating-scale">${[1,2,3,4,5].map(r => `<div class="rating-box">${r}</div>`).join('')}</div>
          </div>
          <div class="field-group" style="margin-bottom:16px">
            <div class="field-label">Overall rating rationale (required — must include specific evidence)</div>
            <textarea class="field-textarea" placeholder="Summarise your rating decision with specific evidence and examples..."></textarea>
          </div>
          <div class="field-group">
            <div class="field-label">Recommended increment band</div>
            <select class="field-input" style="cursor:pointer">
              <option>Rating 5: 12–16% increment range</option>
              <option>Rating 4: 8–12% increment range</option>
              <option>Rating 3: 4–7% increment range</option>
              <option>Rating 2: 0–3% increment range</option>
              <option>Rating 1: 0% — performance improvement plan</option>
            </select>
          </div>
        </div>

        <div class="sig-block">
          <div><div class="sig-line"></div><div class="sig-label">Manager Signature</div></div>
          <div><div class="sig-line"></div><div class="sig-label">Skip-Level / HR Review</div></div>
          <div><div class="sig-line"></div><div class="sig-label">Employee Acknowledgement</div></div>
        </div>
      </div>`;
    }
  },

  'email-rating-3': {
    category: 'Email Templates',
    title: 'Meets Expectations Performance Email',
    subtitle: 'For employees receiving a Rating 3 — acknowledges solid contribution while being honest about growth areas',
    meta: [
      { label: 'Rating', value: '3 — Meets Expectations' },
      { label: 'Tone', value: 'Warm & honest' },
      { label: 'Goal', value: 'Motivate, not deflate' },
    ],
    render: function() {
      return renderEmailTemplate({
        subject: 'Your Performance Review Summary — [Review Period]',
        to: '[Employee Name]',
        from: '[Your Name], [Your Title]',
        body: `<p>Dear <span class="email-placeholder">[Employee Name]</span>,</p>

<p>Thank you for our review conversation. I want to follow up in writing to confirm what we discussed and make sure you leave this cycle with clarity — both about your contribution and what success looks like going forward.</p>

<p>You received a Rating 3 — Meets Expectations — for this cycle. I want to be clear about what that means: <strong>Meeting expectations at <span class="email-placeholder">[Company Name]</span> is a genuine achievement.</strong> Our expectations are set at a high standard, and consistently delivering on them is the foundation of what we need from every team member.</p>

<p>What you did well this cycle: <span class="email-placeholder">[Insert 2–3 specific positive observations — focus on behaviours and outcomes, not just effort. Be genuine and specific.]</span></p>

<p>Where I'd like to see growth in the next cycle: <span class="email-placeholder">[Insert 1–2 specific, actionable development areas. Frame these as opportunities, not criticisms — e.g. "I'd love to see you take on more ownership of stakeholder communication — I think it's the area that will most accelerate your path to the next level."]</span></p>

<p>Your increment for this cycle is <span class="email-placeholder">[X%]</span>, effective <span class="email-placeholder">[date]</span>.</p>

<p>For the next cycle, I want to work with you on <span class="email-placeholder">[1 specific development goal or stretch opportunity]</span>. Let's schedule 30 minutes in the next two weeks to turn this into a concrete plan.</p>

<p>I genuinely value your contribution to this team, and I'm committed to supporting you in getting to the next level.</p>

<p>Best regards,<br><span class="email-placeholder">[Your Name]</span></p>`
      });
    }
  },

  'agenda-1on1': {
    category: 'Meeting Agendas',
    title: 'Weekly 1:1 Meeting Agenda',
    subtitle: 'A lightweight, consistent structure for weekly manager-employee check-ins — 15 to 30 minutes',
    meta: [
      { label: 'Duration', value: '15–30 minutes' },
      { label: 'Cadence', value: 'Weekly' },
      { label: 'Owner', value: 'Manager + Employee' },
    ],
    render: function() {
      return renderAgendaTemplate({
        fields: [
          { label: 'Employee', placeholder: 'Name' },
          { label: 'Manager', placeholder: 'Name' },
          { label: 'Date', placeholder: 'DD/MM/YYYY' },
          { label: 'Meeting #', placeholder: 'e.g. Week 14' },
        ],
        groundRules: [
          'This meeting belongs to the employee, not the manager — employee sets the agenda',
          'No status updates unless they reveal a blocker or decision needed',
          'Manager listens 70% of the time, talks 30%',
          'Skip this meeting only in genuine emergencies — consistency is the value',
          'End with at least one clear action item for each person',
        ],
        items: [
          { time: '0–5 min', title: 'Wins & Accomplishments', notes: 'Employee shares: What did you ship or accomplish since we last spoke? Manager actively acknowledges — do not rush past this.', owner: 'Employee leads' },
          { time: '5–15 min', title: 'Priorities & Focus', notes: 'What is your top priority for this week? Are you working on the right things? Any priority conflicts the manager can help resolve?', owner: 'Employee leads' },
          { time: '15–22 min', title: 'Blockers & Support Needed', notes: 'What is in your way? What do you need from me? Manager action items go here — be explicit about what you will do and by when.', owner: 'Manager action' },
          { time: '22–28 min', title: 'Development Check-In (every 4th week)', notes: 'Once a month: How are you feeling about your growth? Is your development plan active? Any feedback you want to share with me?', owner: 'Monthly only' },
          { time: '28–30 min', title: 'Close & Actions', notes: 'Confirm: one action for employee, one action for manager. Write them down — spoken actions disappear.', owner: 'Both' },
        ]
      });
    }
  },

  'checklist-manager-prep': {
    category: 'Checklists & Trackers',
    title: 'Manager Review Preparation Checklist',
    subtitle: 'Everything a manager needs to complete before entering calibration or review conversations',
    meta: [
      { label: 'When', value: '1–2 weeks before review' },
      { label: 'Time', value: '~2 hours per direct report' },
      { label: 'Output', value: 'Review-ready manager' },
    ],
    render: function() {
      return renderChecklist({
        sections: [
          {
            title: '📋 Data Gathering',
            items: [
              ['Pulled full-year performance data for each direct report (not just the last 3 months)', 'Recency bias is the most common calibration error — force yourself to review the full period'],
              ['Reviewed each employee\'s original goals/OKRs as set at the start of the cycle', 'You\'re rating against the goals as set, not the goals as you remember them'],
              ['Gathered client/stakeholder feedback for each employee where available', '360 data, client emails, project retrospective notes, skip-level feedback'],
              ['Reviewed any documented feedback given during the year (1:1 notes, email follow-ups)', 'Your year-end rating should not contain surprises — if it does, the problem started earlier'],
              ['Checked team attendance, delivery metrics, and any documented performance concerns', 'Look for patterns over 12 months, not incidents in isolation'],
            ]
          },
          {
            title: '⭐ Rating Preparation',
            items: [
              ['Written 2–3 specific behavioural examples for each proposed Rating 4 and 5', 'Generic claims ("She\'s a great team player") will not survive calibration. Specific incidents will.'],
              ['Written rationale for any Rating 1 or 2, with dates and incident references', 'Low ratings are legally significant and require documentation. No exceptions.'],
              ['Checked your proposed distribution against the team benchmark', 'If 80%+ of your team is 4 or 5, you have a grade inflation problem — not an exceptional team'],
              ['Reviewed your ratings for potential bias (recency, halo, proximity)', 'Ask: am I rating the person I see most often more generously? Am I rating the most recent project, not the full year?'],
              ['Checked that no protected characteristic could be inferred from your rating pattern', 'If gender or ethnicity correlates with your ratings, that\'s a problem regardless of intent'],
            ]
          },
          {
            title: '💬 Conversation Preparation',
            items: [
              ['Prepared specific feedback for each employee — strengths and development areas', 'Feedback should be specific, behavioural, and delivered with care — not read from a form'],
              ['Anticipated how each employee will react to their rating', 'For surprising ratings (lower than self-assessment): prepare for the conversation, not the conflict'],
              ['Prepared development recommendations for each employee for next cycle', 'Every review should end with the employee knowing exactly what they need to do to progress'],
              ['Identified retention risk employees — those who may react by exploring external options', 'Have a retention conversation planned for any flight-risk employee within 48 hours of the review'],
              ['Confirmed calendar invites are sent with adequate notice (minimum 5 working days)', 'Employees who receive review invites with less than 2 days\' notice arrive unprepared and defensive'],
            ]
          },
          {
            title: '⚖️ Calibration Preparation',
            items: [
              ['Submitted all ratings in the HR system before the calibration deadline', 'Late submissions disrupt the calibration process for everyone'],
              ['Reviewed pre-calibration distribution data sent by HRBP', 'Understand how your team\'s ratings sit relative to the rest of the organisation before you enter the room'],
              ['Prepared to defend every Rating 5 with evidence — not assertion', 'The calibration room will challenge you. Be ready.'],
              ['Accepted that some ratings may change in calibration — and that this is the point', 'Calibration is designed to surface inconsistency. Ratings changing is not a failure of your judgment — it is the system working.'],
            ]
          },
        ]
      });
    }
  },

};

// HELPER RENDERERS
// ═══════════════════════════════════════════════

function renderEmailTemplate(opts) {
  return `
  <div class="tmpl-body">
    <div class="email-meta">
      ${[
        ['To', opts.to],
        ['From', opts.from],
        ['Subject', opts.subject],
      ].map(([k,v]) => `
      <div class="email-meta-row">
        <div class="email-meta-key">${k}</div>
        <div class="email-meta-val"><input value="${v}" style="border:none;border-bottom:1.5px solid var(--border);background:transparent;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--ink);width:100%;outline:none;padding:2px 0"></div>
      </div>`).join('')}
    </div>
    <div style="background:#fffbeb;border-radius:8px;padding:12px 16px;font-size:12px;color:#92400e;margin-bottom:16px;border-left:4px solid var(--gold)">
      ⚠️ <strong>Personalisation required:</strong> All <span style="background:#fef3c7;border:1px dashed #f59e0b;border-radius:3px;padding:1px 5px;font-size:11px;font-weight:700">[bracketed fields]</span> must be replaced with specific content before sending. Generic email templates sent without personalisation are worse than no email at all.
    </div>
    <div class="email-body">${opts.body}</div>
    <div class="sig-block" style="margin-top:24px">
      <div><div class="sig-line"></div><div class="sig-label">Sender confirms reviewed</div></div>
      <div><div class="sig-line"></div><div class="sig-label">Date sent</div></div>
      <div><div class="sig-line"></div><div class="sig-label">HR copy filed</div></div>
    </div>
  </div>`;
}

function renderAgendaTemplate(opts) {
  return `
  <div class="tmpl-body">
    <div class="field-row field-row-${opts.fields.length <= 2 ? '2' : opts.fields.length >= 4 ? '2' : '3'}">
      ${opts.fields.map(f => `
      <div class="field-group">
        <div class="field-label">${f.label}</div>
        <input class="field-input" placeholder="${f.placeholder}">
      </div>`).join('')}
    </div>

    <div class="tmpl-section" style="margin-top:20px">
      <div class="tmpl-section-title">Ground Rules</div>
      ${opts.groundRules.map(rule => `
      <div class="check-item">
        <div class="check-box-print"></div>
        <div class="check-text">${rule}</div>
      </div>`).join('')}
    </div>

    <div class="tmpl-section">
      <div class="tmpl-section-title alt">Agenda</div>
      ${opts.items.filter(i => i.title).map(item => `
      <div class="agenda-item">
        <div class="agenda-time">${item.time}</div>
        <div class="agenda-content">
          <div class="agenda-title">${item.title}</div>
          ${item.notes ? `<div class="agenda-notes">${item.notes}</div>` : ''}
        </div>
        ${item.owner ? `<div class="agenda-owner">${item.owner}</div>` : ''}
      </div>`).join('')}
    </div>

    <div class="tmpl-section">
      <div class="tmpl-section-title success">Actions Captured</div>
      <table class="tracker-table">
        <thead><tr><th>Action</th><th>Owner</th><th>Due Date</th><th>Done</th></tr></thead>
        <tbody>
          ${Array(5).fill(0).map(() => `
          <tr>
            <td><input class="tracker-input" placeholder="Action description..."></td>
            <td><input class="tracker-input" placeholder="Name" style="width:80px"></td>
            <td><input class="tracker-input" placeholder="DD/MM" style="width:70px"></td>
            <td><div class="check-box-print" style="margin:auto"></div></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

function renderChecklist(opts) {
  return `
  <div class="tmpl-body">
    <div class="field-row">
      <div class="field-group"><div class="field-label">Manager / HR Name</div><input class="field-input" placeholder="Your name"></div>
      <div class="field-group"><div class="field-label">Review Cycle</div><input class="field-input" placeholder="e.g. Annual 2025"></div>
    </div>
    <div class="field-row">
      <div class="field-group"><div class="field-label">Team / Function</div><input class="field-input" placeholder="Team name"></div>
      <div class="field-group"><div class="field-label">Date</div><input class="field-input" placeholder="DD/MM/YYYY"></div>
    </div>
    ${opts.sections.map(section => `
    <div class="tmpl-section" style="margin-top:20px">
      <div class="tmpl-section-title">${section.title}</div>
      ${section.items.map(([item, note]) => `
      <div class="check-item">
        <div class="check-box-print"></div>
        <div class="check-text">
          ${item}
          ${note ? `<div style="font-size:11px;color:var(--muted);margin-top:3px;font-style:italic">${note}</div>` : ''}
        </div>
      </div>`).join('')}
    </div>`).join('')}
  </div>`;
}

// ═══════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════

function getParam(name) {
  var params = new URLSearchParams(window.location.search);
  return params.get(name) || '';
}

var WORKER_URL = 'https://pms-toolkit-ai.kumarvivek-srv.workers.dev';

function renderTemplateBody(tmpl, bodyHtml) {
  document.title = tmpl.title + ' — PMS Toolkit Templates';
  var badge = document.getElementById('tmpl-badge');
  if(badge) badge.textContent = tmpl.category;
  var root = document.getElementById('tmpl-root');
  root.innerHTML = `
    <div class="tmpl">
      <div class="tmpl-header">
        <div class="tmpl-header-left">
          <div class="tmpl-category">${tmpl.category}</div>
          <div class="tmpl-title">${tmpl.title}</div>
          <div class="tmpl-subtitle">${tmpl.subtitle}</div>
        </div>
        <div class="tmpl-meta">
          ${(tmpl.meta||[]).map(function(m){
            var label = m.label !== undefined ? m.label : '';
            var value = m.value !== undefined ? m.value : m;
            return '<div class="tmpl-meta-item"><span>'+label+(label?':':'')+'</span><strong>'+value+'</strong></div>';
          }).join('')}
        </div>
      </div>
      ${bodyHtml}
    </div>`;
}

function showLocked(message) {
  var badge = document.getElementById('tmpl-badge');
  if(badge) badge.textContent = 'Pro Template';
  var root = document.getElementById('tmpl-root');
  root.innerHTML = `
    <div class="tmpl-notfound">
      <div class="tmpl-notfound-icon">🔒</div>
      <div class="tmpl-notfound-title">Pro Template</div>
      <div class="tmpl-notfound-sub">${message || 'This template is included in the Pro plan. Unlock it from the Templates page to view and download it.'}</div>
    </div>`;
}

function boot() {
  var id = getParam('id');
  var key = getParam('key');
  var tmpl = TEMPLATES[id];
  var badge = document.getElementById('tmpl-badge');

  if (tmpl) {
    renderTemplateBody(tmpl, tmpl.render());
    return;
  }

  if (!key) {
    if(badge) badge.textContent = 'Pro Template';
    showLocked();
    return;
  }

  if(badge) badge.textContent = 'Loading…';
  document.getElementById('tmpl-root').innerHTML = '<div class="tmpl-notfound"><div class="tmpl-notfound-icon">⏳</div><div class="tmpl-notfound-title">Verifying access…</div></div>';

  fetch(WORKER_URL + '/template-content', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: id, key: key })
  }).then(function(r) {
    if (!r.ok) {
      return r.json().then(function(d) { throw new Error(d.error || 'Could not load this template.'); });
    }
    return r.json();
  }).then(function(data) {
    renderTemplateBody(data, data.html);
  }).catch(function(err) {
    showLocked(err.message);
  });
}

if(document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
