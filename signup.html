<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Virorah PMS</title>
  <meta name="description" content="Create your Virorah PMS account — free to get started">
  <link rel="stylesheet" href="/assets/css/pms-core.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); }
    .auth-shell { display: flex; width: 100%; max-width: 440px; flex-direction: column; align-items: center; gap: 32px; padding: 32px 20px; }
    .auth-logo { display: flex; align-items: center; gap: 10px; }
    .auth-logo { flex-direction: column; align-items: flex-start; gap: 8px; }
    .auth-logo img { width: 210px; max-width: 70vw; height: auto; }
    .auth-logo-text { font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: -0.02em; }
    .auth-logo-sub { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }
    #clerk-sign-up { width: 100%; }
    .cl-rootBox { width: 100% !important; }
    .cl-card { background: var(--bg-card) !important; border: 1px solid var(--border) !important; border-radius: var(--radius-lg) !important; box-shadow: 0 20px 60px rgba(0,0,0,0.4) !important; }
    .cl-headerTitle { color: var(--text) !important; }
    .cl-headerSubtitle { color: var(--text-muted) !important; }
    .cl-formFieldLabel { color: var(--text-muted) !important; font-size: 12.5px !important; }
    .cl-formFieldHintText, .cl-formFieldSuccessText, .cl-formFieldInfoText, .cl-formFieldWarningText { color: var(--text-muted) !important; }
    .cl-formFieldSuccessText { color: #86efac !important; }
    .cl-formFieldWarningText { color: #fcd34d !important; }
    .cl-formFieldErrorText { color: #fca5a5 !important; }
    .cl-formFieldAction, .cl-formResendButton, .cl-formFieldInputShowPasswordButton, .cl-alternativeMethodsBlockButton { color: var(--accent) !important; }
    .cl-otpCodeFieldInput { background: var(--bg-card-2) !important; border-color: var(--border) !important; color: var(--text) !important; }
    .cl-identityPreviewText { color: var(--text) !important; }
    .cl-formHeaderSubtitle, .cl-formHeaderTitle { color: var(--text-muted) !important; }
    .cl-formFieldInput { background: var(--bg-card-2) !important; border-color: var(--border) !important; color: var(--text) !important; }
    .cl-formButtonPrimary { background: var(--accent) !important; border-radius: var(--radius-sm) !important; }
    .cl-formButtonPrimary:hover { background: var(--accent-dim) !important; }
    .cl-footerActionText { color: var(--text-muted) !important; }
    .cl-footerActionLink { color: var(--accent) !important; }
    .cl-logoBox { display: none !important; }
    .cl-dividerText { color: var(--text-dim) !important; }
    .cl-socialButtonsBlockButton { background: var(--bg-card-2) !important; border-color: var(--border) !important; color: var(--text) !important; }
    .auth-footer { text-align: center; font-size: 12px; color: var(--text-dim); }
    .auth-footer a { color: var(--text-muted); }
  </style>
</head>
<body>

<div class="auth-shell">
  <div>
    <div class="auth-logo">
      <a href="/" title="Back to Virorah PMS home"><img src="/virorah_logo_navmatch.png" alt="Virorah PMS"></a>
      <div>
        <div class="auth-logo-sub">Performance Intelligence</div>
      </div>
    </div>
  </div>

  <div id="clerk-sign-up"></div>

  <p class="auth-footer">
    By creating an account you agree to our
    <a href="/pages/terms.html">Terms</a> &amp;
    <a href="/pages/privacy.html">Privacy Policy</a>.
  </p>
</div>

<script>
  window.PMS_CLERK_PK = 'pk_live_Y2xlcmsucG1zLnZpcm9yYWguY29tJA';

  const script = document.createElement('script');
  script.async = true;
  script.crossOrigin = 'anonymous';
  script.src = 'https://unpkg.com/@clerk/clerk-js@5.128.2/dist/clerk.browser.js';
  /* Current Clerk builds read the key from this attribute and expose a ready instance. */
  script.setAttribute('data-clerk-publishable-key', window.PMS_CLERK_PK);
  script.onload = async function () {
    const PK = window.PMS_CLERK_PK;
    const ClerkCtor = window.Clerk;
    const Clerk = (typeof ClerkCtor === 'function') ? new ClerkCtor(PK) : ClerkCtor;
    await Clerk.load();
    if (Clerk.user) { window.location.replace('/pages/home.html'); return; }
    Clerk.mountSignUp(document.getElementById('clerk-sign-up'), {
      appearance: {
        variables: {
          colorBackground: '#13131f',
          colorInputBackground: '#0d0b1e',
          colorInputText: '#f4f3ff',
          colorText: '#f4f3ff',
          colorTextSecondary: '#a5b4fc',
          colorTextOnPrimaryBackground: '#ffffff',
          colorNeutral: '#f4f3ff',
          colorPrimary: '#667eea',
          colorDanger: '#fca5a5',
          colorSuccess: '#86efac'
        }
      },
      afterSignUpUrl: '/pages/home.html',
      signInUrl: '/login.html'
    });
  };
  document.head.appendChild(script);
</script>

<p style="text-align:center;margin:18px 0 28px;font-size:13px;"><a href="/" style="color:#a5b4fc;text-decoration:none;">&larr; Back to Virorah PMS home</a></p>
</body>
</html>
